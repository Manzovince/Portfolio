<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salve</title>
  <meta http-equiv="refresh" content="0; url=/salve/">
  <script>
    // Salve a déménagé de /dictee vers /salve : on retire l'ancien service worker puis on redirige.
    (async () => {
      try {
        for (const r of await navigator.serviceWorker.getRegistrations()) {
          if (new URL(r.scope).pathname.startsWith('/dictee/')) await r.unregister();
        }
      } catch {}
      location.replace('/salve/');
    })();
  </script>
</head>
<body style="background:#101417;color:#e8ecee;font-family:system-ui;padding:16px">
  <p>Salve a déménagé : <a href="/salve/" style="color:#5fd08f">manzovince.com/salve</a></p>
</body>
</html>
