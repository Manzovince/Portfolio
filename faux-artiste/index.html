<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Faux Artiste">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Un faux artiste s'est glissé parmi vous. Dessinez un trait chacun, puis démasquez-le.">
<title>Faux Artiste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe6; --card:#fffdf8; --ink:#1f1d1a; --muted:#776f65; --line:rgba(31,29,26,.12);
  --primary:#1f1d1a; --primary-ink:#fffdf8; --accent:#ff5a36; --accent-ink:#fff;
  --ok:#1f8a4c; --ok-ink:#fff; --ok-bg:#dcf1e3; --bad:#c9372c; --bad-bg:#fbe2de;
  --paper:#fffdf8; --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 22px -10px rgba(40,30,10,.3); --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140f; --card:#221f19; --ink:#f3ede2; --muted:#a59d90; --line:rgba(255,255,255,.1);
    --primary:#f3ede2; --primary-ink:#16140f; --ok:#57cf8a; --ok-ink:#0c2416; --ok-bg:#173524; --bad:#ff6d5e; --bad-bg:#3b1d19;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#16140f; --card:#221f19; --ink:#f3ede2; --muted:#a59d90; --line:rgba(255,255,255,.1);
  --primary:#f3ede2; --primary-ink:#16140f; --ok:#57cf8a; --ok-ink:#0c2416; --ok-bg:#173524; --bad:#ff6d5e; --bad-bg:#3b1d19;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
header{max-width:560px;margin:0 auto;padding:12px 16px 4px;display:flex;align-items:center;gap:8px}
.logo{font-family:Caveat,cursive;font-size:clamp(24px, 8vw, 32px);font-weight:700;letter-spacing:.5px;flex:1;min-width:0;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo span{color:var(--accent)}
.iconbtn{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;height:38px;min-width:38px;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px}
main{max-width:560px;margin:0 auto;padding:8px 16px 28px}
h1,h2{margin:.3em 0 .4em;line-height:1.15}
h2{font-size:24px}
p{line-height:1.45}
.muted{color:var(--muted)}
.card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0;margin:4px 0}
main>.card:first-child{border-top:0}
.card h3{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:6px;min-height:52px;padding:10px 16px;font-size:17px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.4;cursor:default}
.btn+.btn{margin-top:10px}
.row{display:flex;gap:10px}
.row>.btn{margin-top:0}
.seg{display:flex;background:var(--bg);border-radius:6px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:4px;padding:9px 6px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
select,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:11px 12px;font-size:16px}
.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px}
.swatch{width:36px;height:36px;border-radius:50%;border:0;flex:none;cursor:pointer;font-size:19px;display:flex;align-items:center;justify-content:center;padding:0}
.prow .reroll{border:0;background:none;font-size:18px;cursor:pointer;width:30px;padding:0;opacity:.7}
.prow input{flex:1;min-width:0}
.prow .score{font-weight:700;min-width:28px;text-align:center;color:var(--muted)}
.prow .del{border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;width:32px}
.add{margin-top:10px;border:1px dashed var(--line);background:none;border-radius:6px;width:100%;padding:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.center{text-align:center}
.big-name{font-size:34px;font-weight:700;margin:.2em 0}
.av{display:inline-flex;align-items:center;justify-content:center;width:1.45em;height:1.45em;border-radius:50%;margin-right:.4em;flex:none;vertical-align:middle;line-height:1}
.av i{font-style:normal;font-size:.85em}
.role{border-radius:8px;padding:28px 18px;text-align:center;margin:16px 0}
.role .k{font-size:14px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;font-weight:600}
.role .v{font-family:Caveat,cursive;font-size:56px;line-height:1.05;font-weight:700;margin:.15em 0 .3em;overflow-wrap:anywhere}
.role{background:var(--card);border:1px solid var(--line)}
.pass{min-height:56dvh;display:flex;flex-direction:column;justify-content:center}
.drawbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.drawbar .who{font-size:22px;font-weight:700;display:flex;align-items:center;min-width:0}
.drawbar .who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawbar .meta{font-size:13px;color:var(--muted);text-align:right;min-width:0;max-width:55%}
.drawbar .meta b{color:var(--ink);font-size:14px}
.catpill{display:inline-block;background:transparent;border:1px solid var(--line);border-radius:4px;padding:4px 12px;font-size:14px;font-weight:600}
.paper{position:relative;width:min(100%, calc((100dvh - 230px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 3 / 5));min-width:200px;aspect-ratio:3/5;margin:0 auto 12px;background:var(--paper);border-radius:2px;box-shadow:0 0 0 1px var(--line)}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:2px}
.paper.small{width:min(56%, 240px);min-width:0}
.hint{text-align:center;font-size:14px;color:var(--muted);margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:6px;padding:12px;font-weight:600;font-size:16px;cursor:pointer;text-align:left;min-width:0}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.verdict{border-radius:8px;padding:22px 16px;text-align:center;margin:8px 0 12px}
.verdict.fake{background:var(--accent);color:var(--accent-ink)}
.verdict.art{background:var(--ok);color:var(--ok-ink)}
.verdict h2{font-size:28px;margin:.1em 0 .2em}
.verdict p{margin:0;opacity:.95}
.word{font-family:Caveat,cursive;font-size:40px;font-weight:700}
.scores{list-style:none;padding:0;margin:0}
.scores li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:17px}
.scores li:last-child{border-bottom:0}
.scores .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scores .gain{font-weight:700;color:var(--ok);min-width:30px;text-align:right}
.scores .pts{font-weight:700;min-width:30px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:14px;margin-bottom:12px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.compare div{background:var(--bg);border-radius:6px;padding:12px;text-align:center}
.compare small{display:block;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.compare b{font-family:Caveat,cursive;font-size:30px;overflow-wrap:anywhere}
.match{font-size:14px;text-align:center;font-weight:600}
.trophy{background:#ffd447;color:#1f1d1a;border-radius:6px;padding:14px;text-align:center;font-weight:700;font-size:18px;margin:12px 0}
dialog{border:1px solid var(--line);border-radius:8px;padding:0;max-width:min(520px, calc(100vw - 32px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .in{padding:20px 20px 16px;max-height:80dvh;overflow:auto}
dialog ol{padding-left:20px;line-height:1.5}
dialog li{margin-bottom:6px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:8px;display:block;margin:10px auto 0}
</style>
</head>
<body>
<header>
  <div class="logo">Faux <span>Artiste</span></div>
  <button class="iconbtn" id="quitBtn" hidden></button>
  <button class="iconbtn" id="rulesBtn" aria-label="?">?</button>
  <button class="iconbtn" id="langBtn"></button>
</header>
<main id="app"></main>
<dialog id="rules"><div class="in" id="rulesBody"></div></dialog>

<script src="words.js?v=2"></script>
<script>
const KEY = 'faux-artiste-v1';
const COLORS = ['#e63946','#1d6fe0','#22994a','#f08c00','#8e44ad','#e754a8','#0fa3a3','#7a5530','#2b2b2b','#c9a400'];
const MAX_PLAYERS = 10;
const EMOJIS = ['🦊','🐙','🐸','🦉','🐢','🦄','🐝','🦀','🐳','🦩','🐼','🦁','🐧','🐌','🦔','🐨','🐯','🦖','🍄','🌵','🌻','🍉','🍕','🎈','🚀','⭐','🌙','🎩','👾','🤖','🐞','🦋','🍩','🥑','🐠','🦜'];
const freeEmoji = (except) => pick(EMOJIS.filter(e => !S.players.some(p => p.emoji === e) && e !== except));

const T = {
  fr: {
    players: 'Joueurs', add: '+ Ajouter un joueur', player: 'Joueur',
    mode: 'Qui choisit le mot ?', modeAuto: 'Le téléphone', modeGm: 'Un maître du jeu',
    modeAutoHint: 'Tout le monde dessine. Le mot est tiré au hasard.',
    modeGmHint: 'À tour de rôle, un joueur choisit le mot et ne dessine pas. Il gagne avec le faux artiste.',
    category: 'Catégorie', random: 'Au hasard', rounds: 'Tours de dessin', target: 'Points pour gagner',
    start: 'Commencer la manche', resetScores: 'Remettre les scores à zéro',
    needPlayers: n => `Il faut au moins ${n} joueurs.`,
    gmTitle: 'Maître du jeu', gmPass: name => `Passe le téléphone à <b>${name}</b>, le maître du jeu.`,
    gmReady: 'Je suis le maître du jeu', gmCat: 'Catégorie (annoncée à tous)', gmWord: 'Mot secret',
    suggest: 'Suggérer un mot', gmGo: 'Valider et distribuer',
    passTo: 'Passe le téléphone à', passHint: 'Personne d\'autre ne doit regarder.', reveal: name => `Je suis ${name} — voir mon rôle`,
    yourCard: 'Ta carte', fakeName: 'Faux artiste',
    memorize: 'Mémorise, puis cache l\'écran avant de passer le téléphone.',
    catLabel: 'Catégorie', colon: ' : ', hide: 'Compris, cacher',
    turn: (r, R) => `Tour ${r}/${R}`, stroke: (s, S) => `trait ${s}/${S}`,
    drawHint: 'Un seul trait, sans lever le doigt.', undo: 'Effacer mon trait', validate: 'Valider',
    voteTitle: 'Qui est le faux artiste ?',
    voteHint: 'Discutez ! Puis, à trois, tout le monde pointe un suspect du doigt. Sélectionnez la personne la plus désignée.',
    tie: 'Égalité', revealVote: 'Révéler',
    caught: name => `Bien vu, ${name} était le faux artiste !`,
    guessHint: name => `${name}, une dernière chance : devine le mot.`,
    guessPh: 'Ta réponse (ou dis-la à voix haute)', revealWord: 'Révéler le mot',
    yourGuess: 'Réponse', theWord: 'Le mot', autoMatch: 'Ça ressemble à une bonne réponse.', noMatch: 'Ça ne correspond pas… à vous de juger.',
    gotIt: 'Trouvé', missed: 'Raté',
    fakeWins: 'Le faux artiste gagne !', artistsWin: 'Les artistes gagnent !',
    rTie: f => `Égalité au vote : ${f} s'en sort.`,
    rWrong: (a, f) => `Vous avez accusé ${a}, mais c'était ${f}.`,
    rGuessed: f => `${f} a été démasqué, mais a deviné le mot.`,
    rCaught: f => `${f} a été démasqué et n'a pas trouvé le mot.`,
    wordWas: 'Le mot était', scores: 'Scores', replay: 'Rejouer', save: 'Image',
    next: 'Manche suivante', settings: 'Joueurs et réglages', champion: n => `🏆 ${n} remporte la partie !`,
    newGame: 'Nouvelle partie (scores à zéro)', quit: 'Quitter', quitConfirm: 'Abandonner cette manche\u00a0?', quitHint: 'Le dessin et les rôles seront perdus. Les scores sont conservés.', keepPlaying: 'Continuer', quitRound: 'Quitter',
    gm: 'MJ',
    rulesTitle: 'Règles du jeu',
    rules: [
      'Chaque joueur prend le téléphone à tour de rôle et découvre le mot secret… sauf un : le <b>faux artiste</b>, qui ne connaît que la catégorie.',
      'Chacun à son tour ajoute <b>un seul trait</b> au dessin commun, sans lever le doigt. On fait deux tours de table.',
      'Les vrais artistes doivent montrer qu\'ils connaissent le mot sans le rendre trop évident ; le faux artiste doit faire illusion.',
      'Ensuite, on discute, puis tout le monde pointe un suspect. En cas d\'égalité ou d\'erreur, le faux artiste gagne.',
      'S\'il est démasqué, le faux artiste peut encore gagner en devinant le mot.',
      '<b>Points :</b> si le faux artiste gagne, lui (et le maître du jeu) marquent 2 points. Sinon, chaque artiste marque 1 point.',
    ],
    close: 'Fermer',
  },
  en: {
    players: 'Players', add: '+ Add a player', player: 'Player',
    mode: 'Who picks the word?', modeAuto: 'The phone', modeGm: 'A question master',
    modeAutoHint: 'Everyone draws. The word is picked at random.',
    modeGmHint: 'Players take turns choosing the word and sit out the drawing. They win with the fake artist.',
    category: 'Category', random: 'Random', rounds: 'Drawing rounds', target: 'Points to win',
    start: 'Start the round', resetScores: 'Reset scores',
    needPlayers: n => `You need at least ${n} players.`,
    gmTitle: 'Question master', gmPass: name => `Hand the phone to <b>${name}</b>, the question master.`,
    gmReady: 'I\'m the question master', gmCat: 'Category (told to everyone)', gmWord: 'Secret word',
    suggest: 'Suggest a word', gmGo: 'Confirm and hand out',
    passTo: 'Hand the phone to', passHint: 'Nobody else should look.', reveal: name => `I'm ${name}, show my role`,
    yourCard: 'Your card', fakeName: 'Fake artist',
    memorize: 'Memorize it, then hide the screen before passing the phone.',
    catLabel: 'Category', colon: ': ', hide: 'Got it, hide',
    turn: (r, R) => `Round ${r}/${R}`, stroke: (s, S) => `line ${s}/${S}`,
    drawHint: 'One single line, without lifting your finger.', undo: 'Erase my line', validate: 'Confirm',
    voteTitle: 'Who is the fake artist?',
    voteHint: 'Discuss! Then, on three, everyone points at a suspect. Select the person with the most fingers.',
    tie: 'Tie', revealVote: 'Reveal',
    caught: name => `Well spotted, ${name} was the fake artist!`,
    guessHint: name => `${name}, one last chance: guess the word.`,
    guessPh: 'Your answer (or say it out loud)', revealWord: 'Reveal the word',
    yourGuess: 'Answer', theWord: 'The word', autoMatch: 'Looks like a correct answer.', noMatch: 'Doesn\'t match… you be the judge.',
    gotIt: 'Got it', missed: 'Missed',
    fakeWins: 'The fake artist wins!', artistsWin: 'The artists win!',
    rTie: f => `Tied vote: ${f} gets away with it.`,
    rWrong: (a, f) => `You accused ${a}, but it was ${f}.`,
    rGuessed: f => `${f} was caught, but guessed the word.`,
    rCaught: f => `${f} was caught and didn't find the word.`,
    wordWas: 'The word was', scores: 'Scores', replay: 'Replay', save: 'Image',
    next: 'Next round', settings: 'Players & settings', champion: n => `🏆 ${n} wins the game!`,
    newGame: 'New game (reset scores)', quit: 'Quit', quitConfirm: 'Abandon this round?', quitHint: 'The drawing and roles will be lost. Scores are kept.', keepPlaying: 'Keep playing', quitRound: 'Quit',
    gm: 'QM',
    rulesTitle: 'How to play',
    rules: [
      'Everyone takes the phone in turn and sees the secret word… except one: the <b>fake artist</b>, who only knows the category.',
      'In turn, each player adds <b>one single line</b> to the shared drawing, without lifting their finger. Go around the table twice.',
      'Real artists must show they know the word without making it obvious; the fake artist must blend in.',
      'Then discuss, and everyone points at a suspect. On a tie or a wrong guess, the fake artist wins.',
      'If caught, the fake artist can still win by guessing the word.',
      '<b>Points:</b> if the fake artist wins, they (and the question master) score 2 points. Otherwise each artist scores 1 point.',
    ],
    close: 'Close',
  },
};

// ---------- state ----------
const pick = a => a[Math.floor(Math.random() * a.length)];
let S = load() || {
  lang: (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en',
  players: [1, 2, 3, 4].map(i => ({ id: uid(), name: '', color: COLORS[i - 1], emoji: EMOJIS[(i * 7) % EMOJIS.length], score: 0 })),
  mode: 'auto', rounds: 2, cat: 'random', target: 5, used: [], gmPtr: 0, game: null,
};
S.players.forEach(p => { if (!p.emoji) p.emoji = freeEmoji(); });
if (S.game && S.game.phase === 'reveal') S.game.phase = 'pass'; // never reopen on a secret
const t = k => T[S.lang][k];
function uid() { return Math.random().toString(36).slice(2, 9); }
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const P = id => S.players.find(p => p.id === id);
const pname = (p, i) => (p && p.name.trim()) || `${t('player')} ${(i ?? S.players.indexOf(p)) + 1}`;
const nameOf = id => esc(pname(P(id)));
const dotOf = id => `<span class="av" style="background:${P(id).color}"><i>${P(id).emoji}</i></span>`;
const catById = id => CATEGORIES.find(c => c.id === id);
const L = () => S.lang === 'fr' ? 0 : 1;
function wordText(g) { return g.custom ? g.custom.word : catById(g.catId).words[g.wordIdx][L()]; }
function catText(g) { return g.custom ? g.custom.cat : catById(g.catId)[S.lang]; }
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const app = document.getElementById('app');
function go(phase) { if (S.game) S.game.phase = phase; save(); render(); scrollTo(0, 0); }

function render() {
  document.documentElement.lang = S.lang;
  document.getElementById('langBtn').textContent = S.lang === 'fr' ? 'EN' : 'FR';
  const q = document.getElementById('quitBtn');
  q.hidden = !S.game || S.game.phase === 'result';
  q.textContent = '✕'; q.title = q.ariaLabel = t('quit');
  const g = S.game;
  if (!g) return renderSetup();
  ({ gm: renderGm, pass: renderPass, reveal: renderReveal, draw: renderDraw, vote: renderVote, guess: renderGuess, result: renderResult })[g.phase]();
}

// ---------- setup ----------
function renderSetup() {
  const min = S.mode === 'gm' ? 4 : 3;
  const cats = CATEGORIES.map(c => `<option value="${c.id}" ${S.cat === c.id ? 'selected' : ''}>${esc(c[S.lang])}</option>`).join('');
  app.innerHTML = `
    <div class="card">
      <h3>${t('players')}</h3>
      <div class="players">${S.players.map((p, i) => `
        <div class="prow" data-id="${p.id}">
          <button class="swatch" style="background:${p.color}" data-act="color" aria-label="color">${p.emoji}</button>
          <input type="text" value="${esc(p.name)}" placeholder="${t('player')} ${i + 1}" maxlength="18" data-act="name" autocomplete="off">
          <button class="reroll" data-act="emoji" aria-label="emoji">🎲</button>
          <span class="score">${p.score}</span>
          ${S.players.length > 3 ? `<button class="del" data-act="del" aria-label="remove">×</button>` : ''}
        </div>`).join('')}
      </div>
      ${S.players.length < MAX_PLAYERS ? `<button class="add" id="addP">${t('add')}</button>` : ''}
    </div>
    <div class="card">
      <h3>${t('mode')}</h3>
      <div class="seg" id="modeSeg">
        <button data-v="auto" aria-pressed="${S.mode === 'auto'}">${t('modeAuto')}</button>
        <button data-v="gm" aria-pressed="${S.mode === 'gm'}">${t('modeGm')}</button>
      </div>
      <p class="muted" style="font-size:14px;margin:8px 2px 0">${S.mode === 'auto' ? t('modeAutoHint') : t('modeGmHint')}</p>
      ${S.mode === 'auto' ? `<div class="field"><label for="catSel">${t('category')}</label>
        <select id="catSel"><option value="random">${t('random')}</option>${cats}</select></div>` : ''}
      <div class="field"><label>${t('rounds')}</label>
        <div class="seg" id="roundSeg">${[1, 2, 3].map(n => `<button data-v="${n}" aria-pressed="${S.rounds === n}">${n}</button>`).join('')}</div></div>
      <div class="field"><label>${t('target')}</label>
        <div class="seg" id="targetSeg">${[3, 5, 7, 10].map(n => `<button data-v="${n}" aria-pressed="${S.target === n}">${n}</button>`).join('')}</div></div>
    </div>
    <button class="btn primary" id="startBtn" ${S.players.length < min ? 'disabled' : ''}>${t('start')}</button>
    ${S.players.length < min ? `<p class="hint">${t('needPlayers')(min)}</p>` : ''}
    ${S.players.some(p => p.score) ? `<button class="link" id="resetBtn">${t('resetScores')}</button>` : ''}
  `;
  app.querySelectorAll('.prow').forEach(row => {
    const p = P(row.dataset.id);
    row.querySelector('[data-act=name]').addEventListener('input', e => { p.name = e.target.value; save(); });
    row.querySelector('[data-act=color]').addEventListener('click', () => {
      const taken = S.players.map(x => x.color);
      let i = COLORS.indexOf(p.color);
      for (let k = 1; k <= COLORS.length; k++) { const c = COLORS[(i + k) % COLORS.length]; if (!taken.includes(c)) { p.color = c; break; } }
      save(); renderSetup();
    });
    row.querySelector('[data-act=emoji]').addEventListener('click', () => { p.emoji = freeEmoji(p.emoji); save(); renderSetup(); });
    row.querySelector('[data-act=del]')?.addEventListener('click', () => { S.players = S.players.filter(x => x !== p); save(); renderSetup(); });
  });
  document.getElementById('addP')?.addEventListener('click', () => {
    const taken = S.players.map(x => x.color);
    S.players.push({ id: uid(), name: '', color: COLORS.find(c => !taken.includes(c)), emoji: freeEmoji(), score: 0 });
    save(); renderSetup();
    const inputs = app.querySelectorAll('.prow input'); inputs[inputs.length - 1].focus();
  });
  const seg = (id, fn) => document.getElementById(id).querySelectorAll('button').forEach(b => b.addEventListener('click', () => { fn(b.dataset.v); save(); renderSetup(); }));
  seg('modeSeg', v => S.mode = v);
  seg('roundSeg', v => S.rounds = +v);
  seg('targetSeg', v => S.target = +v);
  document.getElementById('catSel')?.addEventListener('change', e => { S.cat = e.target.value; save(); });
  document.getElementById('resetBtn')?.addEventListener('click', () => { S.players.forEach(p => p.score = 0); save(); renderSetup(); });
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function pickWord(catFilter) {
  const pool = [];
  CATEGORIES.forEach(c => { if (catFilter === 'random' || c.id === catFilter) c.words.forEach((_, i) => pool.push(c.id + ':' + i)); });
  let fresh = pool.filter(k => !S.used.includes(k));
  if (!fresh.length) { S.used = S.used.filter(k => !pool.includes(k)); fresh = pool; }
  const k = pick(fresh);
  S.used.push(k);
  const [catId, i] = k.split(':');
  return { catId, wordIdx: +i };
}

function startGame() {
  const ids = S.players.map(p => p.id);
  const gm = S.mode === 'gm' ? ids[S.gmPtr++ % ids.length] : null;
  const drawers = ids.filter(id => id !== gm);
  const start = Math.floor(Math.random() * drawers.length);
  const loop = drawers.slice(start).concat(drawers.slice(0, start));
  const order = [];
  for (let r = 0; r < S.rounds; r++) order.push(...loop);
  S.game = {
    phase: gm ? 'gm' : 'pass', gm, drawers, fake: pick(drawers), order, turn: 0, strokes: [], pending: false,
    revealI: 0, accused: null, guessed: null, outcome: null, scored: false,
    ...(gm ? { custom: null } : pickWord(S.cat)),
  };
  save(); render(); scrollTo(0, 0);
}

// ---------- drawing ----------
function drawStrokes(ctx, W, H, strokes, limit = Infinity) {
  ctx.fillStyle = '#fffdf8'; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, W * 0.011);
  let budget = limit;
  for (const s of strokes) {
    if (budget <= 0) break;
    const pts = s.pts.slice(0, Math.max(1, Math.min(s.pts.length, budget)));
    budget -= s.pts.length;
    ctx.strokeStyle = ctx.fillStyle = P(s.id)?.color || '#222';
    if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0][0] * W, pts[0][1] * H, ctx.lineWidth / 2, 0, 7); ctx.fill(); continue; }
    ctx.beginPath(); ctx.moveTo(pts[0][0] * W, pts[0][1] * H);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0] * W, pts[i][1] * H, mx * W, my * H);
    }
    const l = pts[pts.length - 1]; ctx.lineTo(l[0] * W, l[1] * H); ctx.stroke();
  }
}

// Sizes the canvas to its box at device resolution; returns a redraw function.
function mountCanvas(cv, getStrokes) {
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  const fit = () => {
    const r = cv.getBoundingClientRect(), dpr = Math.min(3, devicePixelRatio || 1);
    W = cv.width = Math.round(r.width * dpr); H = cv.height = Math.round(r.height * dpr); draw();
  };
  const draw = (limit) => drawStrokes(ctx, W, H, getStrokes(), limit);
  new ResizeObserver(fit).observe(cv);
  fit();
  return draw;
}

function renderDraw() {
  const g = S.game, id = g.order[g.turn], R = g.drawers.length;
  app.innerHTML = `
    <div class="drawbar">
      <div class="who">${dotOf(id)}<span>${nameOf(id)}</span></div>
      <div class="meta"><b>${esc(catText(g))}</b><br>${t('turn')(Math.floor(g.turn / R) + 1, S.rounds)} · ${t('stroke')(g.turn + 1, g.order.length)}</div>
    </div>
    <div class="paper"><canvas id="cv"></canvas></div>
    <div class="row">
      <button class="btn" id="undo">${t('undo')}</button>
      <button class="btn primary" id="ok">${t('validate')} →</button>
    </div>
    ${g.turn === 0 ? `<p class="hint">${t('drawHint')}</p>` : ''}`;
  const cv = document.getElementById('cv'), undo = document.getElementById('undo'), ok = document.getElementById('ok');
  const redraw = mountCanvas(cv, () => g.strokes);
  const sync = () => { undo.disabled = ok.disabled = !g.pending; };
  sync();
  let cur = null, pid = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
  cv.addEventListener('pointerdown', e => {
    if (g.pending || cur) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId); pid = e.pointerId;
    cur = { id, pts: [pos(e)] }; g.strokes.push(cur); redraw();
  });
  cv.addEventListener('pointermove', e => {
    if (!cur || e.pointerId !== pid) return;
    const co = e.getCoalescedEvents?.();
    for (const ev of (co && co.length ? co : [e])) {
      const p = pos(ev), l = cur.pts[cur.pts.length - 1];
      if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 0.003) cur.pts.push(p);
    }
    redraw();
  });
  const end = e => { if (!cur || e.pointerId !== pid) return; cur = null; g.pending = true; save(); sync(); redraw(); };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cv.addEventListener(ev, end));
  undo.onclick = () => { if (!g.pending) return; g.strokes.pop(); g.pending = false; save(); sync(); redraw(); };
  ok.onclick = () => {
    if (!g.pending) return;
    g.pending = false; g.turn++;
    if (g.turn >= g.order.length) go('vote'); else { save(); renderDraw(); }
  };
}

function renderVote() {
  const g = S.game;

    <button class="btn accent" id="ok" disabled style="margin-top:14px">${t('revealVote')}</button>`;
  mountCanvas(document.getElementById('cv'), () => g.strokes);
  let sel = null;
  const ok = document.getElementById('ok');
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    sel = b.dataset.id;

    ok.disabled = false;

    go('result');
  };
}

// ---------- fake artist's last guess ----------
const norm = s => s.toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9]+/g, ' ').replace(/\b(le|la|les|l|un|une|des|du|de|d|the|a|an)\b/g, ' ').replace(/\s+/g, '').trim();
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const tmp = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = tmp; }
  }
  return d[b.length];
}
const looksRight = (guess, word) => { const a = norm(guess), b = norm(word); return !!a && (a === b || (b.length >= 4 && lev(a, b) <= Math.floor(b.length / 5) + 1)); };

function renderGuess() {
  const g = S.game;
  app.innerHTML = `
    <div class="verdict art"><h2>🎯</h2><p>${t('caught')(nameOf(g.fake))}</p></div>
    <p class="center">${t('guessHint')(nameOf(g.fake))}</p>
    <div class="center" style="margin-bottom:12px"><span class="catpill">${t('catLabel')}${t('colon')}${esc(catText(g))}</span></div>
    <input type="text" id="gi" placeholder="${t('guessPh')}" autocomplete="off" maxlength="40">
    <div id="out"></div>
    <button class="btn primary" id="ok" style="margin-top:12px">${t('revealWord')}</button>`;
  const gi = document.getElementById('gi');
  document.getElementById('ok').onclick = function () {
    const guess = gi.value.trim(), word = wordText(g), m = guess && looksRight(guess, word);
    gi.disabled = true; this.remove();
    document.getElementById('out').innerHTML = `
      <div class="compare"><div><small>${t('yourGuess')}</small><b>${guess ? esc(guess) : '🗣️'}</b></div><div><small>${t('theWord')}</small><b>${esc(word)}</b></div></div>
      ${guess ? `<p class="match" style="color:${m ? 'var(--ok)' : 'var(--muted)'}">${m ? t('autoMatch') : t('noMatch')}</p>` : ''}
      <div class="row"><button class="btn ${m ? 'accent' : ''}" id="yes">✓ ${t('gotIt')}</button><button class="btn ${m ? '' : 'primary'}" id="no">✗ ${t('missed')}</button></div>`;
    const done = hit => { g.outcome = { fakeWins: hit, reason: hit ? 'guessed' : 'caught' }; go('result'); };
    document.getElementById('yes').onclick = () => done(true);
    document.getElementById('no').onclick = () => done(false);
  };
}

// ---------- result ----------
function applyScore(g) {
  const gains = {};
  if (g.outcome.fakeWins) { gains[g.fake] = 2; if (g.gm) gains[g.gm] = 2; }
  else g.drawers.forEach(id => { if (id !== g.fake) gains[id] = 1; });
  g.gains = gains;
  for (const id in gains) P(id).score += gains[id];
  g.scored = true;
}

function renderResult() {
  const g = S.game;
  if (!g.scored) { applyScore(g); save(); }
  const f = nameOf(g.fake), o = g.outcome;
  const reason = { tie: t('rTie')(f), wrong: t('rWrong')(g.accused !== 'tie' && P(g.accused) ? nameOf(g.accused) : '?', f), guessed: t('rGuessed')(f), caught: t('rCaught')(f) }[o.reason];
  const ranked = [...S.players].sort((a, b) => b.score - a.score);
  const champ = ranked[0].score >= S.target && (ranked.length < 2 || ranked[1].score < ranked[0].score) ? ranked[0] : null;
  app.innerHTML = `
    <div class="verdict ${o.fakeWins ? 'fake' : 'art'}"><h2>${o.fakeWins ? t('fakeWins') : t('artistsWin')}</h2><p>${reason}</p></div>
    <p class="center" style="margin:6px 0">${t('wordWas')}<br><span class="word">${esc(wordText(g))}</span><br><span class="catpill">${esc(catText(g))}</span></p>
    ${champ ? `<div class="trophy">${t('champion')(esc(pname(champ)))}</div>` : ''}
    <div class="card">
      <div class="paper small" style="width:min(80%, 320px)"><canvas id="cv"></canvas></div>
      <div class="legend">${g.drawers.map(id => `<span>${dotOf(id)}${nameOf(id)}${id === g.fake ? ' 🎭' : ''}</span>`).join('')}</div>
      <div class="row"><button class="btn" id="replay">▶ ${t('replay')}</button><button class="btn" id="dl">⬇ ${t('save')}</button></div>
    </div>
    <div class="card"><h3>${t('scores')}</h3><ul class="scores">${ranked.map(p => `<li>${dotOf(p.id)}<span class="n">${esc(pname(p))}${p.id === g.gm ? ` · ${t('gm')}` : ''}${p.id === g.fake ? ' 🎭' : ''}</span>
      <span class="gain">${g.gains[p.id] ? '+' + g.gains[p.id] : ''}</span><span class="pts">${p.score}</span></li>`).join('')}</ul></div>
    ${champ ? `<button class="btn primary" id="newGame">${t('newGame')}</button>` : `<button class="btn primary" id="next">${t('next')}</button>`}
    <button class="btn" id="settings">${t('settings')}</button>`;
  const cv = document.getElementById('cv');
  const redraw = mountCanvas(cv, () => g.strokes);
  let anim = 0;
  document.getElementById('replay').onclick = () => {
    cancelAnimationFrame(anim);
    const total = g.strokes.reduce((n, s) => n + s.pts.length, 0), t0 = performance.now(), dur = Math.min(9000, 700 * g.strokes.length);
    const step = now => { const k = Math.min(1, (now - t0) / dur); redraw(Math.ceil(k * total)); if (k < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  };
  document.getElementById('dl').onclick = () => {
    redraw();
    cv.toBlob(b => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = `faux-artiste-${norm(wordText(g)) || 'dessin'}.png`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
  };
  document.getElementById('next')?.addEventListener('click', startGame);
  document.getElementById('newGame')?.addEventListener('click', () => { S.players.forEach(p => p.score = 0); startGame(); });
  document.getElementById('settings').onclick = () => { S.game = null; save(); render(); scrollTo(0, 0); };
}
