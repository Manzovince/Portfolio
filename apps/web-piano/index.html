<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Web piano · Vincent Manzoni</title>
    <meta name="description" content="Play from a MIDI keyboard, your computer or a touch screen: see the chords named, the notes written on a staff, and light up an LED strip on a real piano.">
    <meta name="author" content="Vincent Manzoni">
    <meta name="theme-color" content="#041e2a">
    <link rel="canonical" href="https://manzovince.com/web-piano/">
    <meta property="og:title" content="Web piano · Vincent Manzoni">
    <meta property="og:description" content="A piano in the browser that names your chords, writes your notes on a staff and lights up an LED strip.">
    <meta property="og:image" content="https://manzovince.com/assets/og-web-piano-app.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://manzovince.com/web-piano/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css?v=20261101l">
</head>

<body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></symbol>
        <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6a1.4 1.4 0 0 1-1 .4H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z" /></symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
        <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
        <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
        <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5" /></symbol>
        <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5" /><circle cx="12" cy="12" r="1" /></symbol>
        <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a.8.8 0 0 0 1.2.7l12-7.5a.8.8 0 0 0 0-1.4l-12-7.5A.8.8 0 0 0 7 4.5z" /></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" /></symbol>
        <symbol id="i-piano" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M8 4v9M12 4v9M16 4v9M8 13v7M12 13v7M16 13v7" /></symbol>
        <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z" /></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 3v12M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 8l5-5 5 5" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6" /></symbol>
        <symbol id="i-clear" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></symbol>
    </svg>

    <header class="topbar">
        <a class="brand" href="../web-piano.html" data-t-title="back" data-t-label="back">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back" /></svg>
            <span data-t="title"></span>
        </a>
        <div class="status">
            <button id="midiStatus" class="pill" type="button" hidden><i class="led"></i><span></span></button>
            <span id="ledPill" class="pill" hidden><i class="led"></i><span></span></span>
            <span id="pedal" class="pill pedal" data-t="pedal" hidden></span>
        </div>
        <div class="actions">
            <div class="pill-group">
                <button id="practiceBtn" class="pill practice-toggle" type="button" aria-pressed="false">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-target" /></svg>
                    <span data-t="practice"></span>
                </button>
                <button id="openLibrary" class="pill" type="button" aria-haspopup="dialog">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-music" /></svg>
                    <span data-t="songs"></span>
                </button>
            </div>
            <button id="soundBtn" class="icon-button" type="button" aria-pressed="true">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-speaker" /><path class="on" d="M16 9a5 5 0 0 1 0 6M19.4 18.4a9 9 0 0 0 0-12.8" /><path class="off" d="m22 9-6 6M16 9l6 6" /></svg>
            </button>
            <button id="settingsBtn" class="icon-button" type="button" aria-controls="settings" aria-expanded="false" data-t-label="settings" data-t-title="settings">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sliders" /></svg>
            </button>
        </div>
    </header>

    <section class="staff">
        <div id="score"></div>
        <div class="staff-actions">
            <input id="songFile" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
            <div class="staff-tools">
                <button id="openScore" class="icon-button small" type="button" data-t-label="openScore" data-t-title="openScore">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-expand" /></svg>
                </button>
                <button id="clearStaff" class="icon-button small" type="button" data-t-label="clearStaff" data-t-title="clearStaff">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-clear" /></svg>
                </button>
            </div>
        </div>
    </section>

    <dialog id="scoreDialog" class="score-dialog" aria-labelledby="scoreTitle">
        <div class="score-head">
            <h2 id="scoreTitle" data-t="scoreTitle"></h2>
            <div class="score-export" role="group" data-t-label="download">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-download" /></svg>
                <button id="exportPng" class="chip" type="button" data-t-title="exportPngHelp">PNG</button>
                <button id="exportSvg" class="chip" type="button" data-t-title="exportSvgHelp">SVG</button>
                <button id="exportMidi" class="chip" type="button" data-t-title="exportMidiHelp">MIDI</button>
            </div>
            <button id="closeScore" class="icon-button" type="button" data-t-label="close" data-t-title="close">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close" /></svg>
            </button>
        </div>
        <div id="fullScore" class="full-score"></div>
        <p id="scoreEmpty" class="score-empty" data-t="scoreEmpty" hidden></p>
    </dialog>

    <dialog id="libraryDialog" class="score-dialog library-dialog" aria-labelledby="libraryTitle">
        <div class="score-head">
            <h2 id="libraryTitle" data-t="libraryTitle"></h2>
            <button id="importSong" class="chip import-chip" type="button">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-upload" /></svg>
                <span data-t="importMidi"></span>
            </button>
            <button id="closeLibrary" class="icon-button" type="button" data-t-label="close" data-t-title="close">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close" /></svg>
            </button>
        </div>
        <div class="library-body">
            <div class="library-part">
                <span data-t="libraryPart"></span>
                <div class="segmented" data-setting="songStartPart">
                    <button type="button" data-value="listen" data-t="partShortListen"></button>
                    <button type="button" data-value="right" data-t="partShortRight"></button>
                    <button type="button" data-value="left" data-t="partShortLeft"></button>
                    <button type="button" data-value="both" data-t="partShortBoth"></button>
                </div>
            </div>
            <section>
                <h3 data-t="libraryExamples"></h3>
                <ul id="exampleList" class="song-list"></ul>
            </section>
            <section>
                <h3 data-t="libraryImported"></h3>
                <ul id="importedList" class="song-list"></ul>
                <p id="libraryEmpty" class="library-empty" data-t="libraryEmpty"></p>
            </section>
        </div>
    </dialog>

    <main class="stage">
        <canvas id="wave" aria-hidden="true"></canvas>
        <canvas id="roll" aria-hidden="true"></canvas>
        <div id="readout" class="readout idle" aria-live="polite">
            <div id="chordSymbol" class="chord-symbol"></div>
            <div id="chordName" class="chord-name"></div>
            <div id="noteNames" class="note-names"></div>
            <div id="hint" class="hint">
                <p id="hintMain"></p>
                <p id="hintKeys" class="hint-keys"></p>
                <p><button class="chip example-song" type="button" data-t="hintExample"></button></p>
            </div>
        </div>
        <section id="songBar" class="song-bar" hidden>
            <button id="songPlay" class="icon-button play-button" type="button">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-play" /></svg>
            </button>
            <div class="song-main">
                <div class="song-info">
                    <span id="songTitle" class="song-title"></span>
                    <span id="songWait" class="song-wait" data-t="songYourTurn" hidden></span>
                    <span id="songTime" class="song-time"></span>
                </div>
                <input id="songSeek" type="range" min="0" max="1000" step="1" value="0" data-t-label="songPosition">
            </div>
            <select id="songPart" data-t-label="songPart">
                <option value="listen" data-t="partListen"></option>
                <option value="both" data-t="partBoth"></option>
                <option value="right" data-t="partRight"></option>
                <option value="left" data-t="partLeft"></option>
            </select>
            <div id="songSpeed" class="segmented" role="group" data-t-label="songSpeed">
                <button type="button" data-speed="0.5">50%</button>
                <button type="button" data-speed="0.75">75%</button>
                <button type="button" data-speed="1">100%</button>
            </div>
            <button id="songClose" class="icon-button small" type="button" data-t-label="songClose" data-t-title="songClose">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close" /></svg>
            </button>
        </section>
        <div id="songError" class="toast error" hidden></div>
        <section id="practice" class="practice" hidden>
            <div class="practice-bar">
                <div class="segmented" data-setting="practiceKind">
                    <button type="button" data-value="chords" data-t="practiceChords"></button>
                    <button type="button" data-value="scales" data-t="practiceScales"></button>
                </div>
                <select id="practiceLevel" data-t-label="practiceLevel"></select>
                <select data-setting="practiceRoots" data-t-label="practiceRootsLabel">
                    <option value="naturals" data-t="rootsNaturals"></option>
                    <option value="all" data-t="rootsAll"></option>
                </select>
                <label class="inline-switch"><input type="checkbox" class="switch" data-setting="practiceHints"><span data-t="practiceHints"></span></label>
                <span id="practiceStats" class="practice-stats"></span>
                <button id="practiceSkip" class="chip" type="button" data-t="practiceSkip"></button>
                <button id="practiceClose" class="icon-button small" type="button" data-t-label="close" data-t-title="close">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close" /></svg>
                </button>
            </div>
            <div class="practice-target" aria-live="polite">
                <p id="practicePrompt" class="practice-prompt"></p>
                <div id="practiceSymbol" class="chord-symbol"></div>
                <div id="practiceName" class="chord-name"></div>
                <div id="practiceNotes" class="note-names practice-notes"></div>
                <p id="practiceFeedback" class="practice-feedback"></p>
            </div>
        </section>
        <canvas id="usage" aria-hidden="true" hidden></canvas>
        <div id="unlock" class="toast" data-t="unlock" hidden></div>
    </main>

    <div class="keys">
        <button id="octDown" class="shift" type="button" data-t-label="octaveDown"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-left" /></svg></button>
        <div id="keyboard" class="keyboard" role="group" data-t-label="keyboardLabel"></div>
        <button id="octUp" class="shift" type="button" data-t-label="octaveUp"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-right" /></svg></button>
    </div>

    <div id="scrim" class="scrim"></div>
    <aside id="settings" class="drawer" aria-hidden="true" aria-labelledby="settingsTitle">
        <div class="drawer-head">
            <h2 id="settingsTitle" data-t="settings"></h2>
            <button id="closeSettings" class="icon-button" type="button" data-t-label="close">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close" /></svg>
            </button>
        </div>

        <div class="tabs" role="tablist" data-t-label="settings">
            <button type="button" role="tab" id="tab-sound" aria-controls="panel-sound" data-tab="sound">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-speaker" /></svg><span data-t="tabSound"></span>
            </button>
            <button type="button" role="tab" id="tab-display" aria-controls="panel-display" data-tab="display">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-eye" /></svg><span data-t="tabDisplay"></span>
            </button>
            <button type="button" role="tab" id="tab-keyboard" aria-controls="panel-keyboard" data-tab="keyboard">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-piano" /></svg><span data-t="tabKeyboard"></span>
            </button>
            <button type="button" role="tab" id="tab-lights" aria-controls="panel-lights" data-tab="lights">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bulb" /></svg><span data-t="tabLights"></span>
            </button>
        </div>

        <div class="panels">
            <!-- Sound -->
            <div class="panel" role="tabpanel" id="panel-sound" aria-labelledby="tab-sound" data-panel="sound">
                <div class="card">
                    <label class="row"><span data-t="sound"></span><input type="checkbox" class="switch" data-setting="sound"></label>
                    <label class="row"><span data-t="instrument"></span>
                        <select id="instrument" data-setting="instrument">
                            <option value="piano" data-t="instPiano"></option>
                            <option value="sine" data-t="instSine"></option>
                            <option value="triangle" data-t="instTriangle"></option>
                            <option value="square" data-t="instSquare"></option>
                            <option value="sawtooth" data-t="instSawtooth"></option>
                        </select>
                    </label>
                    <label class="row slider"><span data-t="volume"></span><output id="volumeValue"></output>
                        <input type="range" min="0" max="1" step="0.01" data-setting="volume">
                    </label>
                </div>
                <div id="synthOptions" class="group">
                    <div class="group-head">
                        <h3 data-t="envelope"></h3>
                        <button id="resetSynth" class="text-button" type="button" data-t="reset"></button>
                    </div>
                    <div class="card">
                        <label class="row slider"><span data-t="attack"></span><output data-out="synthAttack"></output>
                            <input type="range" min="0" max="1.5" step="0.005" data-setting="synthAttack">
                        </label>
                        <label class="row slider"><span data-t="decay"></span><output data-out="synthDecay"></output>
                            <input type="range" min="0.02" max="2" step="0.01" data-setting="synthDecay">
                        </label>
                        <label class="row slider"><span data-t="sustain"></span><output data-out="synthSustain"></output>
                            <input type="range" min="0" max="1" step="0.01" data-setting="synthSustain">
                        </label>
                        <label class="row slider"><span data-t="release"></span><output data-out="synthRelease"></output>
                            <input type="range" min="0.02" max="3" step="0.01" data-setting="synthRelease">
                        </label>
                    </div>
                    <h3 data-t="delay"></h3>
                    <div class="card">
                        <label class="row slider"><span data-t="delayMix"></span><output data-out="delayMix"></output>
                            <input type="range" min="0" max="0.8" step="0.01" data-setting="delayMix">
                        </label>
                        <label class="row slider"><span data-t="delayTime"></span><output data-out="delayTime"></output>
                            <input type="range" min="0.05" max="1" step="0.01" data-setting="delayTime">
                        </label>
                        <label class="row slider"><span data-t="delayFeedback"></span><output data-out="delayFeedback"></output>
                            <input type="range" min="0" max="0.85" step="0.01" data-setting="delayFeedback">
                        </label>
                    </div>
                </div>
            </div>

            <!-- Display -->
            <div class="panel" role="tabpanel" id="panel-display" aria-labelledby="tab-display" data-panel="display" hidden>
                <div class="card">
                    <div class="row">
                        <span data-t="notation"></span>
                        <div class="segmented" data-setting="notation">
                            <button type="button" data-value="english">C D E</button>
                            <button type="button" data-value="solfege">Do Ré Mi</button>
                        </div>
                    </div>
                    <label class="row"><span data-t="colors"></span>
                        <select data-setting="colorMode">
                            <option value="rainbow" data-t="colorRainbow"></option>
                            <option value="octave" data-t="colorOctave"></option>
                            <option value="mono" data-t="colorMono"></option>
                        </select>
                    </label>
                </div>
                <div class="group">
                    <h3 data-t="groupScreen"></h3>
                    <div class="card">
                        <label class="row"><span data-t="staff"></span><input type="checkbox" class="switch" data-setting="showStaff"></label>
                        <label id="tempoRow" class="row slider nested"><span data-t="tempo"></span><output id="tempoValue"></output>
                            <input type="range" min="40" max="180" step="1" data-setting="tempo">
                        </label>
                        <label class="row"><span data-t="wave"></span><input type="checkbox" class="switch" data-setting="showWave"></label>
                        <label class="row"><span data-t="roll"></span><input type="checkbox" class="switch" data-setting="showRoll"></label>
                        <div class="row">
                            <label for="showUsage" data-t="usage"></label>
                            <div class="inline">
                                <button id="resetUsage" class="text-button" type="button" data-t="reset"></button>
                                <input id="showUsage" type="checkbox" class="switch" data-setting="showUsage">
                            </div>
                        </div>
                    </div>
                    <p id="tempoHelp" class="help" data-t="tempoHelp"></p>
                </div>
            </div>

            <!-- Keyboard -->
            <div class="panel" role="tabpanel" id="panel-keyboard" aria-labelledby="tab-keyboard" data-panel="keyboard" hidden>
                <div class="card">
                    <label class="row"><span data-t="showKeyboard"></span><input type="checkbox" class="switch" data-setting="showKeyboard"></label>
                    <label class="row"><span data-t="keyboardSize"></span>
                        <select data-setting="keyboardSize">
                            <option value="auto" data-t="sizeAuto"></option>
                            <option value="lumi">LUMI</option>
                            <option value="88">88</option>
                            <option value="61">61</option>
                            <option value="49">49</option>
                            <option value="37">37</option>
                            <option value="25">25</option>
                        </select>
                    </label>
                    <label class="row"><span data-t="labels"></span><input type="checkbox" class="switch" data-setting="showLabels"></label>
                </div>
                <div class="group">
                    <h3 data-t="sectionLearn"></h3>
                    <div class="card">
                        <label class="row"><span data-t="scaleType"></span><select id="scaleType" data-setting="scaleType"></select></label>
                        <label class="row"><span data-t="scaleKey"></span><select id="scaleRoot" data-setting="scaleRoot" data-type="number"></select></label>
                        <p id="scaleNotes" class="row scale-notes" hidden></p>
                    </div>
                    <p class="help" data-t="scaleHelp"></p>
                </div>
                <div class="group">
                    <h3 data-t="songs"></h3>
                    <div class="card">
                        <div class="row"><span data-t="libraryTitle"></span><button id="openLibrarySettings" class="chip" type="button" data-t="libraryOpen"></button></div>
                    </div>
                    <p class="help" data-t="songsHelp"></p>
                </div>
                <div class="group shortcuts">
                    <h3 data-t="sectionShortcuts"></h3>
                    <dl class="card">
                        <div class="row"><dt id="shortKeys"></dt><dd data-t="shortPlay"></dd></div>
                        <div class="row"><dt>← →</dt><dd data-t="shortOctave"></dd></div>
                        <div class="row"><dt data-t="spaceKey"></dt><dd data-t="shortSustain"></dd></div>
                    </dl>
                </div>
            </div>

            <!-- Lights -->
            <div class="panel" role="tabpanel" id="panel-lights" aria-labelledby="tab-lights" data-panel="lights" hidden>
                <div class="group">
                    <div class="card">
                        <label class="row"><span data-t="ledEffect"></span>
                            <select data-setting="ledEffect">
                                <option value="key" data-t="effectKey"></option>
                                <option value="ripple" data-t="effectRipple"></option>
                            </select>
                        </label>
                    </div>
                    <p class="help" data-t="lightsHelp"></p>
                </div>

                <div class="group">
                    <h3>ROLI LUMI</h3>
                    <div class="card">
                        <label class="row"><span data-t="lumiEnabled"></span><input type="checkbox" class="switch" data-setting="lumiEnabled"></label>
                        <div id="lumiStatusRow" class="row">
                            <span id="lumiStatus" class="conn-status"></span>
                            <button id="lumiRetry" class="text-button" type="button" data-t="retry" hidden></button>
                        </div>
                    </div>
                    <div id="lumiOptions" class="group">
                        <div class="card">
                            <label class="row"><span data-t="lumiKeyLights"></span><input type="checkbox" class="switch" data-setting="lumiKeyLights"></label>
                            <label id="lumiGuideColorRow" class="row nested"><span data-t="lumiGuideColor"></span><input type="color" class="color-input" data-setting="lumiGuideColor"></label>
                            <label class="row"><span data-t="lumiScaleSync"></span><input type="checkbox" class="switch" data-setting="lumiScaleSync"></label>
                            <label class="row slider"><span data-t="ledIntensity"></span><output id="lumiBrightnessValue"></output>
                                <input type="range" min="0" max="1" step="0.01" data-setting="lumiBrightness">
                            </label>
                        </div>
                        <div class="card">
                            <label class="row"><span data-t="lumiMode"></span>
                                <select data-setting="lumiMode">
                                    <option value="rainbow" data-t="lumiRainbow"></option>
                                    <option value="single" data-t="lumiSingle"></option>
                                    <option value="piano" data-t="lumiPiano"></option>
                                    <option value="night" data-t="lumiNight"></option>
                                </select>
                            </label>
                            <label class="row"><span data-t="lumiColor"></span><input type="color" class="color-input" data-setting="lumiColor"></label>
                            <label class="row"><span data-t="lumiRootColor"></span><input type="color" class="color-input" data-setting="lumiRootColor"></label>
                        </div>
                        <p id="lumiModeHelp" class="help" data-t="lumiModeHelp"></p>
                        <div class="card">
                            <label class="row"><span data-t="lumiOctave"></span>
                                <select data-setting="lumiOctave" data-type="number">
                                    <option value="-4">−4</option><option value="-3">−3</option><option value="-2">−2</option><option value="-1">−1</option>
                                    <option value="0">0</option><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option>
                                    <option value="4">+4</option><option value="5">+5</option>
                                </select>
                            </label>
                            <label class="row"><span data-t="lumiBlocks"></span>
                                <select data-setting="lumiBlocks">
                                    <option value="auto" data-t="sizeAuto"></option>
                                    <option value="1" data-t="lumiOne"></option>
                                    <option value="2" data-t="lumiTwo"></option>
                                </select>
                            </label>
                        </div>
                    </div>
                    <p class="help" data-t="lumiHelp"></p>
                </div>

                <div class="group">
                    <h3 data-t="sectionLed"></h3>
                    <div class="card">
                        <label class="row"><span data-t="ledEnabled"></span><input type="checkbox" class="switch" data-setting="ledEnabled"></label>
                        <div id="ledStatusRow" class="row">
                            <span id="ledStatus" class="conn-status"></span>
                            <button id="ledRetry" class="text-button" type="button" data-t="retry" hidden></button>
                        </div>
                    </div>
                    <div id="ledOptions" class="card">
                        <label class="row"><span data-t="ledHost"></span><input type="text" class="text-input" data-setting="ledHost" spellcheck="false" autocomplete="off"></label>
                        <label class="row slider"><span data-t="ledIntensity"></span><output id="intensityValue"></output>
                            <input type="range" min="0" max="1" step="0.01" data-setting="ledIntensity">
                        </label>
                    </div>
                    <p id="ledHint" class="help" data-t="ledHttpsHint" hidden></p>
                </div>
            </div>
        </div>

        <div class="drawer-foot">
            <div class="segmented" role="group" data-t-label="language">
                <button type="button" data-lang="en">EN</button>
                <button type="button" data-lang="fr">FR</button>
            </div>
            <a class="about" href="../web-piano.html" data-t="about"></a>
