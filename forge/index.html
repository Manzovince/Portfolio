  <style>
    /* splash: inline so it paints before style.css; same geometry as the iOS launch images */
    #splash { position: fixed; inset: 0; z-index: 200; background: #0e0f11; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .35s ease, transform .35s ease; }
    #splash svg { width: 112px; height: 112px; overflow: visible; }
    #splash path { fill: none; stroke: #ff7a3d; stroke-width: 44; stroke-linecap: round; }
    #splash b { font: 800 22px/1 system-ui, -apple-system, sans-serif; letter-spacing: .32em; margin-right: -.32em; color: #eceef1; }
    #splash .bar { stroke-dasharray: 1; animation: sp-draw .45s .05s cubic-bezier(.3, .7, .2, 1) both; }
    #splash .p1 { transform-origin: 256px 256px; animation: sp-pop .4s .3s cubic-bezier(.3, 1.6, .5, 1) both; }
    #splash .p2 { transform-origin: 256px 256px; animation: sp-pop .4s .42s cubic-bezier(.3, 1.6, .5, 1) both; }
    #splash b { animation: sp-up .45s .5s ease both; }
    #splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
    @keyframes sp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes sp-pop { from { transform: scaleY(0); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes sp-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    /* installed app: iOS already showed the static launch image, so continue from it instead of redrawing */
    @media (display-mode: standalone) { #splash *, #splash b { animation: none !important; } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: opacity .2s !important; } }
  </style>
</head>
