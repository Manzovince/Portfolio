<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coulisses</title>
<link rel="icon" href="/assets/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bg: rgb(4, 30, 42); --text: rgb(231, 215, 192); --muted: rgba(231, 215, 192, .55); --accent: hsl(175, 43%, 47%); --link: hsl(22, 100%, 58%); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 17px/1.5 'IBM Plex Serif', serif; min-height: 100dvh; display: flex; justify-content: center; padding: 15vh 16px 48px; }
  main { width: 100%; max-width: 520px; }
  h1 { font: 600 1.6rem 'Unbounded', sans-serif; margin-bottom: 1.5rem; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: transparent; border: 1px solid var(--muted); border-radius: 6px; padding: 10px 12px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { font: 600 .85rem 'Unbounded', sans-serif; color: var(--bg); background: var(--accent); border: 0; border-radius: 6px; padding: 0 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #err { color: var(--link); min-height: 1.5em; margin-top: .5rem; font-style: italic; }
  ul { list-style: none; }
  li { border-top: 1px solid rgba(231, 215, 192, .15); }
  li:last-child { border-bottom: 1px solid rgba(231, 215, 192, .15); }
  li a { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding: 12px 0; color: inherit; text-decoration: none; }
  li a:hover b { color: var(--link); }
  b { font: 400 .95rem 'Unbounded', sans-serif; }
  li span { color: var(--muted); font-style: italic; text-align: right; font-size: .9rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Coulisses</h1>
  <section id="lock">
    <form>
      <input type="password" placeholder="Mot de passe" autocomplete="current-password" autofocus required>
      <button>Entrer</button>
    </form>
    <p id="err"></p>
  </section>
  <ul id="list" hidden></ul>
</main>
<script>
const DATA = {"iter":600000,"salt":"gwoe4twzeI+vtngFO7lZWQ==","iv":"IU7mV36s5s/eDXRm","ct":"QgKSG6MNKc3e8ll+GrHIkNxBsRjafIuI7R346Mou6UtTEJWLEWlL3DPK+IlwPhSOavepYTgyIolAUBohpMMw3lX0U1W9BMSmnb25xmgKqCYpZHRyWhjLmnUtkp4F+wvAiLUsCpJasTr+hYah/ud6TRKpuqEMK2AzWCs5/TajHcIJJetwsie/hovQ38DdMCNog0H7TL1UsiEdiGX2APPE9iZb1nR3x0iWmPXXBqhOVreS8i6En/vzeCkAFNmAkO1cg8tIUZBClSOjgWpxft0LyeIRd1lWXaCaXKyT05lTeQRk1uDihxGztsRdjlakC4HWiyYkSM8AAYjru40aZceZH7EZRUO8QCF5AFPxlebRIN3EU5KtPjOE2/5epJRJ3jbRTJWTDHE/LaMQN8x6oyDCH19ZY4yB3eUBuRosUz4IBb2KEBFjrchW3fEywwC/G79yvx6kduFX4h4iWEDMK6SRJqKe5BR7HyGZr7S40+HlCS1DQuVYRnmqf2nm7KE/bxiUt4e0opntLON7Fn/5l3yHprO7LyjaRWI9yHiKPNc0mzG37dulVqUsXB7sFWJIXQolrrKGX/JBc4Nmy7L55UQ3wfQA7183TxjNHeZmJNaQ+qXzhq25+qLZa2JSaBtgOu1FfXaEL8P0tBNLYuUgiP9W92v5taz5XOGCA+h5PderrAEMSNBpgg+YvERSZac6NAXTg74SKuRAt9w+nh6EOJ1AJoeEEe6JKUGgxMo4WuBDgZvcIj33uvXoFepimYDu7/SNP1DDlF/ns/Lpd2BVopluv6QrYCFofM1DwY6gxcvnVq0QKz4LoDjSKMYzwCAbiRk5rZVmQAj8aFY2T0c0Qv1FFRyr40QpP7yFqK39SBYrR0Da9Mo7J3p8mX+hqVseCEF4D86rSWaVWOIpY5mlVeN14M8NFvTNqvLBT7D9PldHqOvZAP5t4tWCtlRI9FkIsiKhkVZskxzYuNC7OY+pDNeRo+53IF+OYBhl0/o5iD6IycgydO9QXuwJKywncFPjAGeP9sBnb/bRUtQWeajGl3i4pbNd/+KYAxqE4Tmg9qfofmq0s9mJIX7KwM93cDOroZR//YlCjoUDDtkBhWVmOoBlg5wNaT0sda08+5uS0ctUfJpUUrrgUrJ2f44wCl1TOOJORy7pHrXx53veUBYKDwpofRLntr7CD4eGM2xWe9WjnaHL5FPrcEbV1TxYJtD3gDndquptMnI0j2SX60ZpT+cHfnNJxZ/ufwJCzo+xv1aopwgQMza3Lb34OFWLPRFB++C5PAIqaX8FE+6iT/s+X0OJTz55HAAW5Df57B7as9BG8Wb8IuVlmguuEy34YTCzyqfnmInkDhU89ssjy1QGV4wNvYDH2Gm8WRJm1fKjj5X+bt9fnScoMviXxUJxWMTPgW+/Rs2lYCFvPdvdjzx1x25HHx5TZ+3dVko8E40h9mspXpvNaQ9rj/7PTC7yY8ty90aC9yf45JNdJe5VtlUdKj/rMCg9dG/iw7+R/rxett8YbEGuhdN0CiIrJxjiNABsaH0oYDJHHUuQIeGv8101IodptcZ4iJiqx6gnbS1Ar0Jmdk4lkX61tbReIBQ+Kyd9BVth/IFCSvExXvAnKg7lT2e122uAgY4UXPe8h2mb6cld97SVH55YtyMgLEmP/qcCYIExU3SwQwdMiplrmUP/QZjYHE6w0R0mGTcGhKri3IkPm2wLsCRowfpgnUKNC/KzeyIDj/lXGflp9kEE0A=="};
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decrypt(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: unb64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(DATA.iv) }, key, unb64(DATA.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function show(projects) {
  const list = document.getElementById('list');
  for (const p of projects) {
    const a = document.createElement('a');
    a.href = p.path;
    const b = document.createElement('b'); b.textContent = p.name;
    const s = document.createElement('span'); s.textContent = p.desc;
    a.append(b, s);
    const li = document.createElement('li'); li.append(a);
    list.append(li);
  }
  document.getElementById('lock').hidden = true;
  list.hidden = false;
}

const form = document.querySelector('form');
const input = form.querySelector('input');
const btn = form.querySelector('button');
const err = document.getElementById('err');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; err.textContent = '';
  try {
    show(await decrypt(input.value));
  } catch {
    err.textContent = 'Mauvais mot de passe.';
    input.select();
  }
  btn.disabled = false;
});
</script>
</body>
</html>
