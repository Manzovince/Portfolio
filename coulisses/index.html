<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coulisses</title>
<link rel="icon" href="/assets/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bg: rgb(4, 30, 42); --text: rgb(231, 215, 192); --muted: rgba(231, 215, 192, .55); --accent: hsl(175, 43%, 47%); --link: hsl(22, 100%, 58%); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 17px/1.5 'IBM Plex Serif', serif; min-height: 100dvh; display: flex; justify-content: center; padding: 15vh 16px 48px; }
  main { width: 100%; max-width: 520px; }
  h1 { font: 600 1.6rem 'Unbounded', sans-serif; margin-bottom: 1.5rem; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: transparent; border: 1px solid var(--muted); border-radius: 6px; padding: 10px 12px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { font: 600 .85rem 'Unbounded', sans-serif; color: var(--bg); background: var(--accent); border: 0; border-radius: 6px; padding: 0 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #err { color: var(--link); min-height: 1.5em; margin-top: .5rem; font-style: italic; }
  ul { list-style: none; }
  li { border-top: 1px solid rgba(231, 215, 192, .15); }
  li:last-child { border-bottom: 1px solid rgba(231, 215, 192, .15); }
  li a { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding: 12px 0; color: inherit; text-decoration: none; }
  li a:hover b { color: var(--link); }
  b { font: 400 .95rem 'Unbounded', sans-serif; }
  li span { color: var(--muted); font-style: italic; text-align: right; font-size: .9rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Coulisses</h1>
  <section id="lock">
    <form>
      <input type="password" placeholder="Mot de passe" autocomplete="current-password" autofocus required>
      <button>Entrer</button>
    </form>
    <p id="err"></p>
  </section>
  <ul id="list" hidden></ul>
</main>
<script>
const DATA = {"iter":600000,"salt":"wED2N+E3IKxpxgwkJ534Jg==","iv":"QUgNrSqsmPFNpMSX","ct":"O76GNtmHV127ylNpTN+tN+BjaPXDsMgW+VX1ZLK7lk/Mrpa7l6/8Dn6rDHS+lvJQZoLavnYa8Twe9cyKn26QnS1iiW96QZcBefhZsew6IoiqlFczoXOc/lptThBsqzMry94LOHh0MbgA+cTwWGSqgA1PlrgxzJzqP9CDqsfAVFbBPzZJpx+QSSjWs/DWWWi8LOd8BWsvagku/uird58OkjYj6yGUfM8TFraAFEuZrRGFh8RVRTVghQK+0Zq1S38vOyOv9O78036nUq6b2qw75toXFSmv1auXgNtX/zU5gzzw6TNk2MOzwClGhKvaQSRxy8F1EYu054ub0Rd5kigUTXMd3RZn4HYfryZlShj7RuJm7Xnmg0r0p60CgNsVS+dGY9kTQEVLLg9Xhao3732PMIsliv+cf8o/dRCOkp/rxy7CvIa1meO03nJAazE6knVe4nO+aMwNxjgjNP4AZD0wyv4ZI3zGovTlixmHDwgow7dgjYlrnlzzvvDf4WXIVnVpj4+MDUGbSjndPwgIzH2iy2MB5ofqIihEFMREbUt5XfuNo/FwlwbC/W4WeAuKJu9OlTE1pPkmn71vrohx2a8RzNOZolNYrYXUwiMJL1Bpgf1s3roFDvO0D2zndADdb0+a/1G38xyEXZhs7HJZkqSwjEhMYaAtSir70qmBMrNSQppmqt26YjZe5V45HuTLx4LkCbhqXxj58RbGra1XLcDBZIj8qrBmn+2ztGxerhAObqpdDY9NSznHRUPJG4/SkAbNDYKWdhrAMmpg+zcCWW/EnXRZGMPWfAXzv39qHVjZnWW7OSWqqswmaHyWOoQ1tUYEEKSN43AEhPCS+M1c2H1wMlSmmxsMLZ2Ac5caIfFVCGmFuPsCfjCXGK0lNMh6ov1AfRFyNYFqGP5rnIK2e9IZ2voMcg9eCGviRqKd0oGiiMBoy/vjBCIEMD7VaT8dIgHLn9LN48957AIMg0tVrUKiFKfKoEXZtYeOj307juB9+ofsa8wLVcZRb7xcH8mMRKKrpunvSnciOwbzX/N1DD8BK7+eboEtPMT//o0ehhag05AstqTCJURo3tbk9jip9y0YI1o9Y0B+IEXLxAIRrIQtPhB63VjxUFhQRj2D+E6eDsPeziMz50gO/EtvL+FLb0MXOvSv5DmVcLh9jsLMx+wdsvb92ZUjZpGzgkyQnt48fOlngAqnJ7mgb8iE3WvWdNmnkURigy2sk+EDrPqoqJrw+zwpmLZe5ypU8xEUK7Yx/UdLwhW3qhIjtrJC9FJxb/uiQyAnA8jntKEbm4FBHwlyZa/cE/ElpYbGLwCe8q1CL3A5Wny+tyRJM/Aatyq8CkBGzqJ2ycFF5YKAJK6HTKFO6p0lujiso3f1ETQBcZOVK6R04id2+M1rNgnGydLFPLNFKfjqHIQzvOo1R8NxCR/nyCoi8++pwZVzPxoCeWJHY46xuOTwR9k2H/Iy5Q38eJbu6K0/so7nXP4EjsxggGQLRE+csBd24A4tVqqLHsyHeRbv3FRipmCLzy7MtuBtLEli8F7aiTL7WEln0GESN4wjrtFff7HX6G1oXYsYscslV1ZQnt+IUW9CLoobtR7IzM5BPpn09XzROEP6Llg3yKBCe2aOrUcJg4o+xlqUg+qMNuyifuhMLNRUHB1D6jV7JOXFDmqXybH04ShFEEG7C/B047n12o4shEzMItAcfT4zqV2ByNtFa54X0zZwpMg6mf1VtmjPymx70PldbCX6P+9fGzH+Mo9hivWQbytDVBwJTPRW7smEyqM="};
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decrypt(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: unb64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(DATA.iv) }, key, unb64(DATA.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function show(projects) {
  const list = document.getElementById('list');
  for (const p of projects) {
    const a = document.createElement('a');
    a.href = p.path;
    const b = document.createElement('b'); b.textContent = p.name;
    const s = document.createElement('span'); s.textContent = p.desc;
    a.append(b, s);
    const li = document.createElement('li'); li.append(a);
    list.append(li);
  }
  document.getElementById('lock').hidden = true;
  list.hidden = false;
}

const form = document.querySelector('form');
const input = form.querySelector('input');
const btn = form.querySelector('button');
const err = document.getElementById('err');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; err.textContent = '';
  try {
    show(await decrypt(input.value));
  } catch {
    err.textContent = 'Mauvais mot de passe.';
    input.select();
  }
  btn.disabled = false;
});
</script>
</body>
</html>
