<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f5d46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="THP40">
<title>Plan THP40</title>
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" href="icon.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main id="view" aria-live="polite"></main>

<nav class="tabs" id="tabs" aria-label="Navigation">
  <div class="tabs-in">
    <button data-t="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd’hui</button>
    <button data-t="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
    <button data-t="course"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20l6-10 4 6 3-4 7 8z"/><path d="M15 12V4l4 2-4 2"/></svg>Ma course</button>
  </div>
</nav>

<section class="racemode" id="rm" hidden aria-label="Mode Course"><div class="rm-in" id="rmIn"></div></section>
<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-close="1"></div><div class="sheet-in" role="dialog" aria-modal="true" aria-label="Détail"><div class="grab"></div><button class="sheet-x" data-close="1" aria-label="Fermer">×</button><div id="sheetBody"></div></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fileGpxRace" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden>
<input type="file" id="fileGpx" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script src="data.js?v=4"></script>
<script src="app.js?v=4"></script>
<script>if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
