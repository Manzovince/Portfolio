<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#8fb2d8">
<title>Nouvel onglet</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17263a;--ink2:#46576c;--accent:#e8603a;--accent2:#cf4f2c;--field:rgba(250,251,252,.72);--field-b:#17263a;--chip:rgba(250,251,252,.6);
  --panel:#f4f1ea;--panel-ink:#1d2430;--line:#2c3446;--glow:0 0 0 transparent;--hud:rgba(16,22,34,.62);--hud-ink:#eef2f6}
html.nuit{--ink:#eef2f6;--ink2:#b8c2d0;--field:rgba(14,20,36,.6);--field-b:#c9d4e0;--chip:rgba(14,20,36,.5);--glow:0 2px 14px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#8fb2d8;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;color:var(--ink);transition:color .8s}
#scene{position:fixed;left:0;top:0;width:100vw;height:100vh;image-rendering:pixelated}
#scene.cible{cursor:crosshair}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}
#ui a,#ui button,#ui input,#ui form,.toast,.hud{pointer-events:auto}
header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;gap:12px}
.brand{display:flex;gap:10px;align-items:center;font:600 13px 'JetBrains Mono',monospace;color:var(--ink);background:var(--chip);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:0;padding:7px 16px 7px 12px;border-radius:16px;cursor:pointer;text-align:left;transition:background .15s;min-width:0}
.brand:hover{background:var(--field)}
.bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.bt b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{font-size:10px;font-weight:400;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:2px;background:var(--chip);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:4px;flex:none}
.nb{position:relative;display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink);font:600 13px/1 'JetBrains Mono',monospace;padding:8px 13px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.nb:hover{background:rgba(127,127,127,.18)}
.nb:focus-visible,.brand:focus-visible,.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nb.on{background:var(--accent);color:#fff}
.nb.coin{font-weight:800;font-variant-numeric:tabular-nums;padding-left:10px}
.nb.coin.bump{animation:bump .45s}
@keyframes bump{35%{transform:scale(1.16)}}
.nb.ico{padding:7px 10px}
.sep{width:1px;height:18px;background:currentColor;opacity:.18;margin:0 3px}
.dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--chip)}
.badge{position:absolute;top:-4px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;font:800 10px/17px 'JetBrains Mono',monospace;font-style:normal;text-align:center;padding:0 4px}
.zrow{display:flex;justify-content:space-between;align-items:center;font-size:10px;opacity:.9}
.zrow>span{opacity:.6;text-transform:uppercase;letter-spacing:.06em;font-size:9px}
.zoom{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.1);border-radius:999px;padding:2px}
.zoom button{border:0;background:transparent;color:inherit;font:800 12px/1 'JetBrains Mono',monospace;width:18px;height:16px;border-radius:999px;cursor:pointer}
.zoom button:hover{background:rgba(255,255,255,.18)}
.zoom span{min-width:56px;text-align:center}
main{display:flex;flex-direction:column;align-items:center;width:100%;padding:0 16px}
#clock{font-weight:800;font-size:clamp(36px,5vw,64px);letter-spacing:-.03em;line-height:1;text-shadow:var(--glow);font-variant-numeric:tabular-nums}
#date{font-size:13px;color:var(--ink2);margin-top:9px;text-align:center;text-shadow:var(--glow);display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#date b{font-weight:600;color:var(--ink)}
#search{margin-top:16px;width:min(560px,100%);display:flex;align-items:center;gap:10px;background:var(--field);border:2px solid var(--field-b);border-radius:999px;padding:0 8px 0 18px;box-shadow:3px 3px 0 var(--field-b);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#search svg{flex:none;opacity:.7}
#q{flex:1;min-width:0;border:0;background:transparent;font:400 15px 'JetBrains Mono',monospace;color:var(--ink);padding:13px 0;outline:none}
#q::placeholder{color:var(--ink2)}
#eng{flex:none;border:0;background:transparent;font:600 11px 'JetBrains Mono',monospace;color:var(--ink2);cursor:pointer;padding:6px 8px;border-radius:999px}
#eng:hover{background:var(--chip)}
#links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px;max-width:min(760px,100%)}
.lk{position:relative;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:var(--chip);border-radius:999px;padding:6px 14px 6px 6px;font-size:13px;font-weight:600;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .12s}
.lk:hover{transform:translateY(-1px)}
.lk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.lk .x{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;border:0;background:var(--line);color:#fff;font-size:11px;line-height:18px;padding:0;cursor:pointer;display:none}
#links.edit .lk .x{display:block}
.lk.add,.lk.pen{padding:6px 14px;cursor:pointer;border:0;font-family:inherit}
.lk.pen{padding:0;width:33px;height:34px;justify-content:center}
#addf{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#addf input{border:2px solid var(--field-b);background:var(--field);color:var(--ink);border-radius:999px;padding:7px 12px;font:13px 'JetBrains Mono',monospace;width:160px;outline:none}
#addf input[name=u]{width:220px}

/* montre et sac */
#hudw{position:fixed;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.hud{background:var(--hud);color:var(--hud-ink);border-radius:13px;padding:8px 10px;font-size:11px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 0 rgba(0,0,0,.15);transition:opacity .3s}
#face{display:none}
html.wface #face{display:block}html.wface #watch{display:none}
.face{order:2;position:relative;width:162px;height:162px;transform:scale(.84);transform-origin:100% 100%;margin-top:-26px;margin-left:-26px;border-radius:50%;padding:0;background:radial-gradient(circle at 50% 45%,#14171c,#07080a 70%);border:5px solid #2b2f37;box-shadow:0 0 0 2px #50555f,0 4px 0 rgba(0,0,0,.25),inset 0 0 0 2px #000;color:#f2f4f6;overflow:hidden;font-variant-numeric:tabular-nums}
.face .ring{position:absolute;inset:0;width:100%;height:100%}
.face .zr{fill:none;stroke-width:4.5;opacity:.95}
.face .fk{display:block;font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#8a919c}
.face b{font-weight:800}
.f-top{position:absolute;top:21px;left:0;right:0;text-align:center;font-size:15px;line-height:1;display:flex;justify-content:center;align-items:baseline;gap:4px}
.f-top .h{color:#ff5a5a;font-size:10px;display:inline-block;animation:beat 1s infinite}
.f-top i{font-style:normal;font-size:8px;font-weight:800;padding:1px 4px;border-radius:4px;background:#3ab86a;color:#08100a;align-self:center}
.f-mid{position:absolute;top:45px;left:9px;right:9px;height:54px;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #2c3038;border-bottom:1px solid #2c3038}
.f-mid>div{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.f-mid>div+div{border-left:1px solid #2c3038}
.f-mid b{font-size:14px;letter-spacing:-.02em}
.f-mid .fu{font-size:8px;color:#8a919c}
.f-bot{position:absolute;top:104px;left:0;right:0;text-align:center;line-height:1.1}
.f-bot b{font-size:12px}
.f-bot small{display:block;font-size:7px;color:#9aa0aa;margin:2px auto 0;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#watch{display:flex;align-items:flex-end;gap:13px;order:2;padding:7px 12px}
#watch>div{display:flex;flex-direction:column;gap:1px}
#watch .k{opacity:.55;font-size:8px;text-transform:uppercase;letter-spacing:.06em}
#watch .v{font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
#watch .v small{font-weight:400;font-size:10px;opacity:.7;margin-left:2px}
#watch .row{flex-direction:row!important;align-items:center;gap:9px!important;opacity:.75;font-size:10px;border-left:1px solid rgba(255,255,255,.15);padding-left:12px;align-self:stretch;white-space:nowrap}
#hr .h{display:inline-block;color:#ff6a6a;animation:beat 1s infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}20%{transform:scale(1.3)}}
#bag{width:200px;display:flex;flex-direction:column;gap:3px;order:1;padding:7px 9px}
.hcol{display:flex;flex-direction:column;align-items:flex-start;gap:6px;order:1}
.zpill{pointer-events:auto;background:var(--hud);color:var(--hud-ink);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:10px;padding:3px}
.zpill span{min-width:54px}
.bar{display:grid;grid-template-columns:14px 1fr 44px;align-items:center;gap:6px;white-space:nowrap;font-size:10px}
.bar .t{height:6px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:4px;transition:width .5s}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;opacity:.85}
#food{display:flex;flex-wrap:wrap;gap:3px;min-height:16px}
#food button{border:0;background:rgba(255,255,255,.12);color:inherit;border-radius:7px;padding:1px 5px;font:11px 'JetBrains Mono',monospace;cursor:pointer}
#food button:hover{background:rgba(255,255,255,.24)}
#next{opacity:.75;font-size:10px;display:flex;justify-content:space-between;gap:8px}
#why{color:#ffc27a;font-size:10px;min-height:0}
#prof{width:100%;height:30px;image-rendering:pixelated;display:block;border-radius:6px}
html.zen .hud,html.zen header,html.zen #search,html.zen #links{display:none!important}

.toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,12px);display:flex;align-items:center;gap:12px;background:var(--panel);color:var(--panel-ink);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line);border-radius:14px;padding:9px 16px 9px 12px;opacity:0;transition:opacity .3s,transform .3s;max-width:min(460px,46vw);z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast:not(.on){pointer-events:none!important}
.toast .ic{font-size:22px}
.toast .t1{font-weight:800;font-size:14px}
.toast .t2{font-size:12px;opacity:.75;margin-top:2px}
.cheer{position:fixed;z-index:6;pointer-events:none;font:800 14px 'JetBrains Mono',monospace;color:#fff;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.5);white-space:nowrap}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:4}

#modal{position:fixed;inset:0;background:rgba(20,30,34,0);display:flex;justify-content:flex-end;z-index:10;visibility:hidden;transition:background .25s,visibility 0s .25s}
#modal.on{background:rgba(20,30,34,.18);visibility:visible;transition:background .25s}
.panel{background:var(--panel);color:var(--panel-ink);border-left:2px solid var(--line);width:min(500px,100%);height:100%;display:flex;flex-direction:column;overflow:hidden;transform:translateX(105%);transition:transform .28s cubic-bezier(.3,.7,.3,1)}
#modal.on .panel{transform:none}
.ph{display:flex;align-items:center;gap:4px;padding:12px 12px 10px;border-bottom:2px solid var(--line)}
.ph .tab{border:0;background:transparent;font:800 13px 'JetBrains Mono',monospace;color:var(--panel-ink);opacity:.45;cursor:pointer;padding:6px 10px;border-radius:999px}
.ph .tab.on{opacity:1;background:rgba(44,52,70,.09)}
.ph .sp{flex:1}
.ph .close{border:0;background:var(--line);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
.pb{overflow:auto;padding:14px 16px 30px;flex:1;font-size:13px}
.pb h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px;opacity:.6}
.pb h3:first-child{margin-top:4px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:9px 10px;border:2px solid rgba(44,52,70,.12);border-radius:12px;margin-bottom:6px}
.it.on{border-color:var(--line);background:rgba(44,52,70,.05)}
.it b{font-weight:800}
.it .d{grid-column:1;font-size:11px;opacity:.7}
.it button,.btn{grid-row:1/3;grid-column:2;border:2px solid var(--line);background:#fff;color:var(--panel-ink);border-radius:999px;padding:6px 12px;font:700 12px 'JetBrains Mono',monospace;cursor:pointer;white-space:nowrap}
.it button.buy{background:var(--accent);border-color:var(--accent);color:#fff}
.it button:disabled{opacity:.4;cursor:default}
.shead{position:sticky;top:-14px;margin:-14px -16px 10px;padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid rgba(44,52,70,.12);z-index:2}
.sbal{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.sbal b{font-size:16px;font-weight:800;color:#b07a10}.sbal span{font-size:11px;opacity:.65}
.scats{display:flex;gap:4px;flex-wrap:wrap}.scats::-webkit-scrollbar{display:none}
.scats button{flex:none;border:2px solid rgba(44,52,70,.15);background:#fff;border-radius:999px;padding:5px 10px;font:700 12px 'JetBrains Mono',monospace;color:var(--panel-ink);cursor:pointer}
.scats button.on{background:var(--line);border-color:var(--line);color:#fff}
.sslots{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.sslots button{border:2px solid rgba(44,52,70,.12);background:transparent;border-radius:10px;padding:5px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:inherit;color:var(--panel-ink);min-width:0}
.sslots button span{font-size:16px}.sslots button b{font-size:10px;font-weight:800}.sslots button small{font-size:9px;opacity:.6;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sslots button.on{border-color:var(--line);background:rgba(44,52,70,.06)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}.sgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.scard{position:relative;display:flex;flex-direction:column;gap:3px;border:2px solid rgba(44,52,70,.12);border-radius:12px;padding:8px;min-width:0}
.scard.on{border-color:var(--line);background:rgba(44,52,70,.05)}.scard.lock{opacity:.6}
.scard .si{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:16px;background:rgba(44,52,70,.06)}
.scard .sn{font-weight:800;font-size:12px;line-height:1.25}
.scard .sd{font-size:10px;opacity:.7;line-height:1.35;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scard button{margin-top:4px;border:2px solid var(--line);background:#fff;color:var(--panel-ink);border-radius:999px;padding:4px 8px;font:700 11px 'JetBrains Mono',monospace;cursor:pointer;white-space:nowrap}
.scard button.buy{background:var(--accent);border-color:var(--accent);color:#fff}.scard button:disabled{opacity:.4;cursor:default}
.scard .sb{position:absolute;top:6px;right:6px;font-style:normal;font-size:10px;font-weight:800;background:var(--line);color:#fff;border-radius:999px;padding:1px 6px}
.snote{font-size:11px;opacity:.65;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(44,52,70,.06);border-radius:10px;padding:8px}
.stats span{display:block;font-size:10px;opacity:.6;text-transform:uppercase}
.stats b{font-size:15px}
.sp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sp-g div{background:rgba(44,52,70,.06);border-radius:10px;padding:8px 4px;text-align:center;font-size:10px}
.sp-g canvas{width:42px;height:42px;image-rendering:pixelated;display:block;margin:0 auto 4px;object-fit:contain}
.sp-g .no{opacity:.35}
.qrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(44,52,70,.1)}
.qrow.ok{opacity:.55}
.qtop{background:rgba(44,52,70,.06);border-radius:12px;padding:10px 12px;font-size:13px}
.qtop b{font-size:18px;font-weight:800}
.qbar{height:6px;background:rgba(44,52,70,.12);border-radius:3px;overflow:hidden;flex:1}
.qtop .qbar{margin-top:8px;height:8px}
.qbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.qc{border:2px solid rgba(44,52,70,.12);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.qc.ok{opacity:.5;border-style:dashed}
.qh{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.qr{white-space:nowrap;color:#b07a10}
.qt{font-size:11px;opacity:.7;margin-top:2px}
.qp{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(44,52,70,.1)}
.set input[type=number]{width:60px;font:13px 'JetBrains Mono',monospace;padding:4px 6px;border:2px solid rgba(44,52,70,.25);border-radius:8px}
.set select{font:13px 'JetBrains Mono',monospace;padding:4px}
.adg{display:flex;flex-wrap:wrap;gap:5px}
.adg .btn{grid-row:auto;grid-column:auto;padding:5px 10px;font-size:11px}
.adg .btn.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.adl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(44,52,70,.08);font-size:12px}
.adl .btn{padding:3px 9px;font-size:11px}
#adInfo{font-size:11px;line-height:1.6;background:rgba(44,52,70,.06);border-radius:10px;padding:8px 10px;white-space:pre-wrap}
.adr{display:flex;align-items:center;gap:8px;margin:6px 0}.adr input[type=range]{flex:1}
@media (max-width:900px){#watch{min-width:0}#bag{width:220px}.toast{max-width:90vw;bottom:auto;top:16px}}
/* téléphone : en-tête en icônes, tableau de bord compact en bas, sur toute la largeur */
@media (max-width:700px),(max-height:500px){
  header{padding:10px 10px;gap:6px}
  .brand{padding:6px 10px;font-size:11px;flex:1 1 auto;gap:7px;border-radius:14px}
  .bt small{font-size:9px}
  .nav{padding:3px}.nb{padding:8px 9px}.nb .lbl{display:none}.nb.coin{font-size:12px;padding-left:8px}.sep{margin:0 1px}
  main{padding:0 12px}
  #clock{font-size:46px;margin-top:4px}
  #date{font-size:11px;gap:4px 10px;margin-top:6px}
  #search{margin-top:12px;box-shadow:2px 2px 0 var(--field-b)}
  #q{font-size:16px;padding:11px 0}
  #hudw{left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));flex-direction:column;align-items:stretch;gap:6px}
  .hcol{align-items:stretch}.zpill{align-self:flex-start}
  .hud{border-radius:14px;padding:8px 10px}
  html.wface #watch,#watch{display:flex!important;justify-content:space-between;gap:8px}html.wface #face{display:none}
  #watch>div:nth-child(5),#watch>div:nth-child(6),#watch .row{display:none!important}
  #watch .v{font-size:13px}#watch .k{font-size:9px}
  #watch .row{font-size:10px;padding-top:4px}
  #bag{width:auto;gap:5px}
  #prof{height:30px}
  .bar{grid-template-columns:16px 1fr 50px;font-size:11px;white-space:nowrap}
  #prof{height:26px}
  .toast{top:58px;bottom:auto;max-width:94vw;padding:8px 12px}
  .panel{width:100%;border-left:0}
  .ph{overflow-x:auto}
  .sp-g{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-height:500px){
  header{padding:6px 10px}#clock{font-size:28px;margin-top:0}#date{display:none}#search{margin-top:6px;width:min(420px,100%)}#q{padding:7px 0}
  #hudw{flex-direction:row;align-items:flex-end;justify-content:space-between}#hudw .hud{flex:0 1 300px}#prof,#next,#why,#watch .row,#food{display:none}
  #watch{gap:10px}.bar{grid-template-columns:14px 1fr 44px}#bag{gap:3px}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="flash" id="flash"></div>
<div id="ui">
  <header>
    <button class="brand" id="bBiome" title="Ouvrir le carnet de course"><svg width="16" height="16" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 0h1v1h1v1h1v1h1v4H0V4h1V3h1V1h1z"/></svg><span class="bt"><b id="bName">Sentier</b><small id="bSub"></small></span></button>
    <nav class="nav" aria-label="Menu">
      <button class="nb coin" id="bCoins" data-tab="boutique" title="Boutique" aria-label="Boutique, pièces"><svg width="14" height="14" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><path fill="#c8901c" d="M2 0h3v1H2zM1 1h1v1H1zM5 1h1v1H5zM0 2h1v3H0zM6 2h1v3H6zM1 5h1v1H1zM5 5h1v1H5zM2 6h3v1H2z"/><path fill="#f2c64a" d="M2 1h3v1H2zM1 2h5v3H1zM2 5h3v1H2z"/><path fill="#fff0a0" d="M2 2h1v2H2z"/></svg><span id="nCoin">0</span><i class="dot" id="dShop" hidden></i></button>
      <span class="sep"></span>
      <button class="nb" id="bCarnet" data-tab="carnet" title="Carnet"><svg width="15" height="15" viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M1 1h7v7H1zM2 2v5h1V2zM4 2v5h3V2z"/></svg><span class="lbl">Carnet</span><i class="dot" id="dCarnet" hidden></i></button>
      <button class="nb" id="bDefis" data-tab="defis" title="Défis"><svg width="15" height="15" viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M2 0h2v3H2zM5 0h2v3H5zM3 3h3v1H3zM2 4h5v1H2zM1 5h7v2H1zM2 7h5v1H2zM3 8h3v1H3z"/></svg><span class="lbl">Défis</span><i class="badge" id="nDef" hidden></i></button>
      <span class="sep"></span>
      <button class="nb ico" id="bSet" data-tab="reglages" title="Réglages" aria-label="Réglages"><svg width="16" height="16" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M4 0h3v1H4zM1 1h2v1H1zM4 1h3v1H4zM8 1h2v1H8zM1 2h9v1H1zM2 3h7v1H2zM0 4h4v1H0zM7 4h4v1H7zM0 5h4v1H0zM7 5h4v1H7zM0 6h4v1H0zM7 6h4v1H7zM2 7h7v1H2zM1 8h9v1H1zM1 9h2v1H1zM4 9h3v1H4zM8 9h2v1H8zM4 10h3v1H4z"/></svg></button>
    </nav>
  </header>
  <main>
    <div id="clock">--:--</div>
    <div id="date"></div>
    <form id="search" autocomplete="off">
      <svg width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h3v1H2zM1 1h1v1H1zM5 1h1v1H5zM0 2h1v3H0zM6 2h1v3H6zM1 5h1v1H1zM5 5h1v1H5zM2 6h3v1H2zM6 6h1v1H6zM7 7h1v1H7z"/></svg>
      <input id="q" name="q" autofocus placeholder="Rechercher">
      <button type="button" id="eng" title="Changer de moteur"></button>
    </form>
  </main>
</div>
<div id="hudw">
<div class="hud face" id="face" title="Montre (Réglages → style de la montre)">
  <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46.5" class="zr" stroke="#8a8f99" pathLength="360" stroke-dasharray="46 314" transform="rotate(150 50 50)"/>
    <circle cx="50" cy="50" r="46.5" class="zr" stroke="#3a8ae0" pathLength="360" stroke-dasharray="46 314" transform="rotate(198 50 50)"/>
    <circle cx="50" cy="50" r="46.5" class="zr" stroke="#3ab86a" pathLength="360" stroke-dasharray="46 314" transform="rotate(246 50 50)"/>
    <circle cx="50" cy="50" r="46.5" class="zr" stroke="#f0a030" pathLength="360" stroke-dasharray="46 314" transform="rotate(294 50 50)"/>
    <circle cx="50" cy="50" r="46.5" class="zr" stroke="#e8483a" pathLength="360" stroke-dasharray="46 314" transform="rotate(342 50 50)"/>
    <circle id="fMark" r="3.2" cx="50" cy="3.5" fill="#fff" stroke="#0b0d10" stroke-width="1.2"/>
  </svg>
  <div class="f-top"><span class="h">♥</span><b id="fHr">60</b></div>
  <div class="f-mid"><div><span class="fk">Distance</span><b id="fDist">0,00</b><span class="fu">km</span></div><div><span class="fk">Allure</span><b id="fPace">-</b><span class="fu">/km</span></div></div>
  <div class="f-bot"><span class="fk">Temps</span><b id="fTime">0:00:00</b><small id="fSub"></small></div>
</div>
<div class="hud" id="watch">
  <div><div class="k">Distance</div><div class="v" id="wDist">0<small>km</small></div></div>
  <div><div class="k">D+</div><div class="v" id="wDp">0<small>m</small></div></div>
  <div><div class="k">Allure</div><div class="v" id="wPace">-<small>/km</small></div></div>
  <div><div class="k">Fréq. card.</div><div class="v" id="hr"><span class="h">♥</span> <span id="wHr">60</span><small>bpm</small></div></div>
  <div><div class="k">Altitude</div><div class="v" id="wAlt">0<small>m</small></div></div>
  <div><div class="k">Pente</div><div class="v" id="wGr">0<small>%</small></div></div>
  <div class="row"><span id="wTime">0:00:00</span><span id="wCad">0 spm</span><span id="wMode">course</span></div>
</div>
<div class="hcol">
<div class="zoom zpill" title="Vue (ou molette sur le paysage)"><button id="zOut" aria-label="Dézoomer">−</button><span id="zLbl"></span><button id="zIn" aria-label="Zoomer">+</button></div>
<div class="hud" id="bag">
  <canvas id="prof"></canvas>
  <div id="next"></div>
  <div class="bar"><span title="Eau">💧</span><div class="t"><i id="bW" style="background:#5ab0e8"></i></div><span id="tW"></span></div>
  <div class="bar"><span title="Énergie">⚡</span><div class="t"><i id="bE" style="background:#f2b43a"></i></div><span id="tE"></span></div>
  <div class="bar"><span title="Usure des chaussures">👟</span><div class="t"><i id="bS" style="background:#9ad06a"></i></div><span id="tS"></span></div>
  <div id="food"></div>
  <div id="why"></div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<div id="modal"><div class="panel">
  <div class="ph">
    <button class="tab on" data-tab="boutique">Boutique</button>
    <button class="tab" data-tab="carnet">Carnet</button>
    <button class="tab" data-tab="defis">Défis</button>
    <button class="tab" data-tab="reglages">Réglages</button>
    <button class="tab" data-tab="admin" id="tAdmin" hidden>Admin</button>
    <span class="sp"></span><button class="close" id="mClose" aria-label="Fermer">✕</button>
  </div>
  <div class="pb" id="pb"></div>
</div></div>
<script src="js/core.js?v=5"></script>
<script src="js/world.js?v=5"></script>
<script src="js/layers.js?v=5"></script>
<script src="js/sprites.js?v=5"></script>
<script src="js/game.js?v=5"></script>
<script src="js/main.js?v=5"></script>
</body>
</html>
