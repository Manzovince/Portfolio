<title>Appartement 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9edf0; font: 14px/1.3 -apple-system, system-ui, sans-serif; color: #222; }
  canvas { display: block; touch-action: none; }
  :root { --panneau: rgba(255,255,255,.88); --encre: #222; --doux: #6a6f76; --accent: #2f7d5b; --ombre: 0 1px 2px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.10); }
  #barre { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; z-index: 2; }
  #ui, #vues { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #ui { flex: 1 1 auto; min-width: 0; }
  #vues { flex: none; }
  #ui > *, #vues > * { pointer-events: auto; }
  button { font: inherit; color: var(--encre); border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Version : contrôle segmenté */
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--panneau); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--ombre); }
  .seg button { padding: 7px 13px; border-radius: 8px; background: transparent; transition: background .15s, color .15s; }
  .seg button:hover:not(.on) { background: rgba(0,0,0,.06); }
  .seg button.on { background: var(--encre); color: #fff; }
  /* Options : interrupteurs */
  .tog { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--panneau); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--ombre); color: var(--doux); transition: color .15s; }
  .tog:hover { color: var(--encre); }
  .tog i { position: relative; flex: none; width: 28px; height: 16px; border-radius: 999px; background: #c8ccd1; transition: background .18s; }
  .tog i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .18s; }
  .tog.on { color: var(--encre); }
  .tog.on i { background: var(--accent); }
  .tog.on i::after { transform: translateX(12px); }
  /* Vues et actions */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; background: var(--panneau); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--ombre); transition: background .15s, transform .1s; }
  .btn:hover { background: #fff; }
  .btn:active, .seg button:active, .tog:active { transform: scale(.97); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .groupe { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--panneau); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--ombre); }
  .groupe .btn { box-shadow: none; background: transparent; padding: 6px 10px; border-radius: 8px; }
  .groupe .btn:hover { background: rgba(0,0,0,.06); }
  #bVisite { background: var(--accent); color: #fff; font-weight: 600; }
  #bVisite:hover { background: #276b4d; }
  #bVisite.on { background: var(--encre); }
  @media (max-width: 760px) {
    #vues { position: fixed; right: 12px; bottom: 12px; }
    #aide { display: none; }
    .seg button { padding: 7px 10px; }
    .tog { padding: 5px 10px 5px 7px; font-size: 13px; }
  }
  #tip { position: fixed; pointer-events: none; background: rgba(20,20,20,.85); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; display: none; white-space: nowrap; }
  #joy { position: fixed; left: 24px; bottom: 44px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 1px 6px rgba(0,0,0,.25); display: none; touch-action: none; }
  #joy i { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: #222; opacity: .8; pointer-events: none; }
  #aide { position: fixed; bottom: 10px; left: 12px; font-size: 12px; color: #667; }
</style>
<script type="importmap">

<body>
<div id="barre">
<div id="ui">
  <div class="seg" role="group" aria-label="Version de l'appartement">
    <button id="bVide" aria-pressed="false" title="L'appartement actuel, sans meubles · touche 1 (&)" aria-keyshortcuts="1">Vide avant</button>
    <button id="bActuel" aria-pressed="false" title="L'appartement aujourd'hui, meublé · touche 2 (é)" aria-keyshortcuts="2">Actuel</button>
    <button id="bProjet" class="on" aria-pressed="true" title="Après les travaux, meublé · touche 3 (&quot;)" aria-keyshortcuts="3">Projet travaux</button>

  <div id="gVues" class="groupe" role="group" aria-label="Point de vue">
    <button id="bDessus" class="btn" title="Vue de dessus · touche D" aria-keyshortcuts="D"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M2.5 8h6V2.5M8.5 8v5.5"/></svg>Dessus</button>
    <button id="b3d" class="btn" title="Vue 3D · touche R" aria-keyshortcuts="R"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8 13.5 5v6L8 14.2 2.5 11V5z"/><path d="M2.5 5 8 8.2 13.5 5M8 8.2v6"/></svg>3D</button>
  </div>
  <button id="bVisite" class="btn" title="Se promener à hauteur d'yeux · touche V, Échap pour sortir" aria-keyshortcuts="V"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="2.8" r="1.4"/><path d="M8.5 5.5 6.8 9l2.4 1.6.6 3.6M6.8 9l-1.4 4.8M8.5 5.5l2.3 2.2 2 .3M8.5 5.5 6 6.6 5 8.6"/></svg><span>Visite</span></button>
  <button id="bGlb" class="btn" title="Exporter le modèle en .glb"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.8 7 8 10.2 11.2 7M3 13.5h10"/></svg>.glb</button>

</div>
<div id="tip"></div>
<div id="joy"><i></i></div>
<div id="aide" data-orbite="Glisser : tourner · molette / pincer : zoom · clic droit / 2 doigts : déplacer · touches : 1–4 (&amp; é &quot; ') versions · D dessus · R 3D · V visite · M murs" data-visite="Flèches ou ZQSD : avancer / tourner · glisser : regarder · rond en bas à gauche : se déplacer au doigt · Échap : quitter la visite"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Repère ----------
   Les coordonnées viennent du plan 2D : 2 px = 1 cm.
   x, y en pixels du plan ; hauteurs z en cm. */
const S = 1 / 200;                 // px -> m
const CX = 710.5, CY = 996;        // centre du plan
const X = px => (px - CX) * S;
const Z = py => (py - CY) * S;
const H = 250;                     // hauteur sous plafond (hypothèse)
const CUT = 130;                   // hauteur des murs en mode "coupé"

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.AgXToneMapping;      // hautes lumières adoucies, blancs moins brûlés
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9edf0);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.target.set(0, 0.5, 0);

// Reflets doux d'une pièce neutre (bois verni, inox, écran)
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xfff8ee, 0xa89c88, 0.75));
const sun = new THREE.DirectionalLight(0xffeedb, 1.7);
sun.position.set(-4, 9, -7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...o });
// Petit générateur pseudo-aléatoire stable (mêmes lattes à chaque rechargement)
let graine = 7;
const alea = () => (graine = (graine * 16807) % 2147483647) / 2147483647;
// Texture dessinée sur canevas, répétée tous les `metres` mètres
function texture(px, dessin, py = px) {
  const c = document.createElement('canvas'); c.width = px; c.height = py;
  dessin(c.getContext('2d'), px, py);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
// Parquet : lames de 14 cm, longueurs variées, joints décalés (1 m de côté)
const parquet = texture(1024, (g, n) => {
  const lame = n / 7;
  for (let i = 0; i < 7; i++) {
    for (let y = -alea() * n; y < n; ) {
      const l = n * (0.55 + alea() * 0.6), ton = 0.9 + alea() * 0.16;
      const coul = `rgb(${217 * ton | 0},${185 * ton | 0},${140 * ton | 0})`;
      g.fillStyle = coul;                  // dessiné aussi décalé d'un tour pour boucler
      g.fillRect(i * lame, y, lame, l); g.fillRect(i * lame, y + n, lame, l); g.fillRect(i * lame, y - n, lame, l);
      g.strokeStyle = 'rgba(90,60,30,.10)'; g.lineWidth = 1;
      for (let k = 0; k < 5; k++) { const x = i * lame + 8 + alea() * (lame - 16); g.beginPath(); g.moveTo(x, y); g.lineTo(x + (alea() - .5) * 6, y + l); g.stroke(); }
      g.fillStyle = 'rgba(70,45,20,.45)'; g.fillRect(i * lame, (y + l) % n, lame, 2);
      y += l;
    }
    g.fillStyle = 'rgba(70,45,20,.4)'; g.fillRect(i * lame, 0, 2, n);
  }
});
// Carrelage 30 × 30 cm, joints gris clair (texture = 60 cm)
const carreaux = texture(512, (g, n) => {
  g.fillStyle = '#c3cbd0'; g.fillRect(0, 0, n, n);
  for (const x of [0, n / 2]) for (const y of [0, n / 2]) {
    const t = 0.97 + alea() * 0.05;
    g.fillStyle = `rgb(${211 * t | 0},${218 * t | 0},${222 * t | 0})`; g.fillRect(x + 3, y + 3, n / 2 - 6, n / 2 - 6);
  }
});
// Panneau OSB : copeaux de bois orientés, tons miel et brun (1 motif = 60 cm)
const osbTex = texture(512, (g, n) => {
  g.fillStyle = '#c8a467'; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 900; i++) {
    const x = alea() * n, y = alea() * n, w = 12 + alea() * 40, h = 5 + alea() * 14, a = (alea() - .5) * 1.2, t = alea();
    g.fillStyle = t < .45 ? 'rgba(225,190,125,.55)' : t < .8 ? 'rgba(150,108,55,.45)' : 'rgba(110,75,35,.5)';
    for (const [dx, dy] of [[0, 0], [-n, 0], [n, 0], [0, -n], [0, n]]) {   // copies décalées pour raccorder les bords
      g.save(); g.translate(x + dx, y + dy); g.rotate(a); g.fillRect(-w / 2, -h / 2, w, h); g.restore();
    }
  }
});
osbTex.repeat.set(1.6, 1.6);
// Canisse en roseaux (brise-vue du garde-corps) : tiges verticales de tons variés, 1 motif = 30 cm
const canisseTex = texture(256, (g, n) => {
  g.fillStyle = '#7a5a36'; g.fillRect(0, 0, n, n);
  for (let x = 0; x < n; ) {
    const w = 4 + alea() * 4, t = 0.75 + alea() * 0.45;
    g.fillStyle = `rgb(${190 * t | 0},${150 * t | 0},${98 * t | 0})`; g.fillRect(x, 0, w - 1, n);
    g.fillStyle = 'rgba(255,240,210,.18)'; g.fillRect(x + 1, 0, 1, n);                     // reflet
    for (let k = 0; k < 2; k++) { g.fillStyle = 'rgba(70,45,20,.35)'; g.fillRect(x, alea() * n, w - 1, 2); }   // nœuds
    x += w;
  }
  g.fillStyle = 'rgba(60,40,20,.55)'; for (const y of [n * 0.2, n * 0.8]) g.fillRect(0, y, n, 2);   // fils de liage
});
canisseTex.repeat.set(925 * S / 0.3, 1);
// Faux gazon du balcon : brins serrés de verts variés (1 motif = 50 cm)
const gazonTex = texture(512, (g, n) => {
  g.fillStyle = '#4f8a3a'; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 26000; i++) {
    const x = alea() * n, y = alea() * n, t = alea();
    g.strokeStyle = t < .3 ? 'rgba(120,175,80,.8)' : t < .6 ? 'rgba(70,130,50,.8)' : t < .85 ? 'rgba(95,155,60,.8)' : 'rgba(160,190,90,.7)';
    g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (alea() - .5) * 5, y + (alea() - .5) * 5); g.stroke();
  }
});
gazonTex.repeat.set(949 * S / 0.5, 300 * S / 0.5);
// Dalles de bois clipsables 30 × 30 (4 lattes, sens alterné en damier) ; 1 motif = 60 cm
const dallesTex = texture(512, (g, n) => {
  g.fillStyle = '#2a2018'; g.fillRect(0, 0, n, n);                       // fond sombre entre les lattes
  const d = n / 2, l = d / 4;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) for (let k = 0; k < 4; k++) {
    const vert = (i + j) % 2 === 0, t = 0.82 + alea() * 0.3;
    const [x, y, w, h] = vert ? [i * d + k * l + 2, j * d + 3, l - 4, d - 6] : [i * d + 3, j * d + k * l + 2, d - 6, l - 4];
    g.fillStyle = `rgb(${150 * t | 0},${104 * t | 0},${58 * t | 0})`; g.fillRect(x, y, w, h);
    g.strokeStyle = 'rgba(70,40,15,.25)'; g.lineWidth = 1;
    for (let f = 0; f < 5; f++) {                                         // veinage dans le sens de la latte
      const o = alea(); g.beginPath();
      if (vert) { g.moveTo(x + o * w, y); g.lineTo(x + o * w + (alea() - .5) * 4, y + h); } else { g.moveTo(x, y + o * h); g.lineTo(x + w, y + o * h + (alea() - .5) * 4); }
      g.stroke();
    }
  }
});
dallesTex.repeat.set(420 * S / 0.6, 276 * S / 0.6);
// Crépi légèrement orangé des murs du balcon (grain fin, servant aussi de relief)
const crepiImg = (rep) => { const t = texture(256, (g, n) => {
  g.fillStyle = '#efbf73'; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 9000; i++) { const v = alea(); g.fillStyle = v < .5 ? 'rgba(255,240,225,.35)' : 'rgba(150,95,55,.18)'; g.fillRect(alea() * n, alea() * n, 1 + alea() * 2, 1 + alea() * 2); }
}); t.repeat.set(rep, rep); return t; };
const crepiBoite = crepiImg(4), crepiArche = crepiImg(2.5);
// Tissu chiné du canapé : bleu marine tirant vers le vert (pétrole), fils clairs et sombres mêlés
const tissuCanapeTex = texture(256, (g, n) => {
  g.fillStyle = '#233c4f'; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 14000; i++) {
    const v = alea(); g.fillStyle = v < .35 ? 'rgba(150,200,165,.32)' : v < .7 ? 'rgba(12,25,45,.45)' : 'rgba(80,135,120,.35)';
    g.fillRect(alea() * n, alea() * n, 1 + alea() * 2, 1);
  }
});
tissuCanapeTex.repeat.set(3, 3);
// Carrelage gris des WC (30 × 30, joints plus clairs)
const carreauxGris = texture(512, (g, n) => {
  g.fillStyle = '#a3a3a0'; g.fillRect(0, 0, n, n);
  for (const x of [0, n / 2]) for (const y of [0, n / 2]) {
    const t = 0.96 + alea() * 0.06;
    g.fillStyle = `rgb(${128 * t | 0},${128 * t | 0},${126 * t | 0})`; g.fillRect(x + 3, y + 3, n / 2 - 6, n / 2 - 6);
  }
});
carreauxGris.repeat.set(315 * S / 0.6, 168 * S / 0.6);
// Tomettes hexagonales rouge foncé (sol actuel) : 16 cm entre côtés, 8 colonnes × 4 rangs par motif
const HEX = 16 / Math.sqrt(3), PXCM = 8;                // rayon (cm), pixels par cm
const TW = 12 * HEX, TH = 4 * Math.sqrt(3) * HEX;       // motif : ≈ 111 × 64 cm
const tomettes = texture(Math.round(TW * PXCM), (g, w, h) => {
  g.fillStyle = '#6e5244'; g.fillRect(0, 0, w, h);      // joints
  const s = HEX * PXCM, dy = Math.sqrt(3) * s;
  for (let c = 0; c < 8; c++) for (let r = 0; r < 4; r++) {
    const t = 0.8 + alea() * 0.3, cx = c * 1.5 * s, cy = r * dy + (c % 2) * dy / 2;
    const coul = `rgb(${128 * t | 0},${44 * t | 0},${30 * t | 0})`;
    const taches = Array.from({ length: 14 }, () => [(alea() - .5) * 1.4 * s, (alea() - .5) * 1.4 * s, 6 + alea() * s * .5, alea() < .5 ? 'rgba(40,10,5,.06)' : 'rgba(180,85,55,.06)']);
    for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {   // copies décalées pour boucler
      const x = cx + ox, y = cy + oy;
      if (x < -s || x > w + s || y < -s || y > h + s) continue;
      g.save(); g.beginPath();
      for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3, rr = s - 3; g[k ? 'lineTo' : 'moveTo'](x + rr * Math.cos(a), y + rr * Math.sin(a)); }
      g.closePath(); g.fillStyle = coul; g.fill(); g.clip();
      for (const [tx, ty, tr, tc] of taches) { g.fillStyle = tc; g.beginPath(); g.arc(x + tx, y + ty, tr, 0, 7); g.fill(); }
      g.restore();
    }
  }
}, Math.round(TH * PXCM));
tomettes.repeat.set(949 * S * 100 / TW, 1492 * S * 100 / TH);
parquet.repeat.set(949 * S, 1492 * S);                // 1 motif = 1 m sur le sol du séjour
carreaux.repeat.set(315 * S / 0.6, 384 * S / 0.6);     // 1 motif = 60 cm
// Tapis blanc en laine, feuillages en relief (une seule image pour tout le tapis)
const tapisTex = texture(1024, (g, n) => {
  g.fillStyle = '#e6dfd3'; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 26000; i++) {                       // grain de la laine
    g.fillStyle = alea() < .5 ? 'rgba(255,255,255,.35)' : 'rgba(150,130,100,.10)';
    g.fillRect(alea() * n, alea() * n, 2, 2);
  }
  g.lineCap = 'round';
  for (let f = 0; f < 20; f++) {                          // grandes feuilles de palmier, ton sur ton
    const x0 = alea() * n, y0 = alea() * n, a = alea() * Math.PI * 2, L = n * (0.4 + alea() * 0.35), courbe = (alea() - .5) * 0.9;
    const pt = t => { const b = a + courbe * t; return [x0 + Math.cos(b) * L * t, y0 + Math.sin(b) * L * t, b]; };
    g.strokeStyle = 'rgba(175,155,120,.38)'; g.lineWidth = 7;
    g.beginPath(); for (let t = 0; t <= 1; t += .02) g[t ? 'lineTo' : 'moveTo'](...pt(t)); g.stroke();
    for (let t = 0.04; t < 0.98; t += 0.03) for (const s of [-1, 1]) {   // nervures latérales
      const [x, y, b] = pt(t), l = L * 0.36 * Math.sin(Math.PI * Math.min(1, t * 1.15)) * (0.8 + alea() * .4), c = b + s * 0.75;
      g.lineWidth = 4 + alea() * 4;
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(c) * l * .5, y + Math.sin(c) * l * .5, x + Math.cos(c + s * .35 - .2 * s) * l + Math.cos(b) * l * .35, y + Math.sin(c + s * .15) * l + Math.sin(b) * l * .35);
      g.stroke();
    }
  }
});

  // Meuble imprimante 45 × 90

  B(290, 1488, 770, 1788, 0, 1.5, tapis, 'Grand tapis entrée 240 × 150');   // même tapis à feuillages que le salon ; passe sous le bureau et le meuble imprimante

  }
  if (projet) {
    // Meubles bas 200 × 40 devant la verrière
    B(762, 404, 841, 744, 0, 45, mat.blanc, 'Meubles bas 170 × 40');
    for (const y of [489, 574, 659]) B(761, y - 1, 762, y + 1, 4, 43, mat.gris);
    // Déco sur le meuble bas (dessus à 45 cm) : plantes et lapins
    { // Sansevieria dans un pot blanc
      const g = deco(800, 432, 45, 'Sansevieria'); pot(g, 9, 18, deco_m.ceramique);
      for (let k = 0; k < 8; k++) {
        const h = 32 + hasard(k + 1) * 22, a = k * 2.4;
        const f = mesh(new THREE.BoxGeometry(0.035, h / 100, 0.006), deco_m.sanse);
        f.position.set(Math.cos(a) * 0.035, (15 + h / 2) / 100, Math.sin(a) * 0.035);
        f.rotation.set(Math.sin(a) * 0.12, a, -Math.cos(a) * 0.12); g.add(f);
      }
    }
    lapin(796, 498, 45, 0.85, deco_m.ceramique, 'Lapin en céramique gris et blanc', 0.25, deco_m.gris);
    { // Pile de livres
      const pile = [[781, 821, 3, 0x9c4a3c], [784, 818, 3.5, 0xd9d2c4], [779, 823, 2.5, 0x3f6a8a]];
      let z = 45;
      for (const [x0, x1, ep, c] of pile) { B(x0, 545, x1, 592, z, z + ep, M(c), 'Livres'); z += ep; }
    }
    if (ecran) { // Écran de projection minimaliste : simple panneau 135 × 76 (16:9), fin liseré noir
      const e = new THREE.Group(); e.userData.nom = 'Écran de projection 135 × 76'; e.name = 'Écran'; cur.add(e);
      B(837, 466, 840, 744, 79.5, 156.5, mat.noir, null, e);                // liseré noir de 5 mm
      B(836, 467, 837, 743, 80, 156, mat.toile ??= M(0xf4f3f0, { roughness: 1 }), null, e);   // toile
    }
    { // Petite succulente
      const g = deco(806, 706, 45, 'Succulente'); pot(g, 6, 8, deco_m.sauge);
      for (const [n, r, y, s] of [[9, 3, 8.5, 1], [6, 1.6, 9.8, 0.75]]) for (let k = 0; k < n; k++) {
        const a = k / n * Math.PI * 2 + y;
        const f = boule(g, 1.8 * s, Math.cos(a) * r, y, Math.sin(a) * r, deco_m.succulente, 1.6, 0.6, 0.8);
        f.rotation.set(0, -a, 0.35);
      }    }
    // Coin dressing : deux positions à comparer (bouton « Dressing au fond »)
    const miroirM = M(0xd6e6ee, { roughness: 0.1, metalness: 0.2 });
    if (inverse) {   // dressing contre le mur du fond
      B(853, 463, 1173, 583, 0, 240, mat.chene, 'Dressing 160 × 60');
      for (const x of [933, 1013, 1093]) B(x - 1, 583, x + 1, 584, 0, 240, mat.boisF);
      B(1169, 715, 1173, 835, 30, hm(190), miroirM, 'Miroir 60 × 160');
    } else {         // dressing le long du mur de droite
      B(900, 462, 1020, 466, 30, hm(190), miroirM, 'Miroir 60 × 160');
      B(1051, 583, 1171, 925, 0, 240, mat.chene, 'Dressing 60 × 170');
      for (const y of [697, 811]) B(1050, y - 1, 1051, y + 1, 0, 240, mat.boisF);
    }
    // Bureau côté séjour, adossé à l'allège le long du lit
    bureauAssisDebout(776, 1090, -Math.PI / 2);                            // même bureau qu'aujourd'hui, dos à l'allège
    bureauArtiste(776, 1090, -Math.PI / 2, 120, 69, 'Bureau : écran, PC, dessin');
    chaise(660, 1090, -Math.PI / 2 + 0.15, 'Chaise de bureau', mat.tissuF);
    // Lit 140 × 190 sur l'estrade, tête contre le mur de la salle de bain
    const lit2 = new THREE.Group(); lit2.userData.nom = 'Lit 140 × 190'; lit2.name = 'Lit'; cur.add(lit2);
    lit2.position.x = -15 * S;                                     // centré dans l'ouverture de la niche
    B(887, 938, 1168, 1314, 40, 60, mat.drap, null, lit2);
    B(885, 938, 1170, 1200, 56, 64, mat.bleu, null, lit2);
    B(900, 1222, 1014, 1304, 60, 74, mat.oreiller, null, lit2);
    B(1040, 1222, 1154, 1304, 60, 74, mat.oreiller, null, lit2);
    if (!coupe) { // Petite guirlande lumineuse : le long de l'arche puis en festons sur le mur de gauche
      const W = (1173 - 852) * S, r = 0.725 + 0.035, cx = X(852) + W / 2, zf = Z(1264) - 0.012;
      const arc = [new THREE.Vector3(cx - r, 1.0, zf)];
      for (let k = 0; k <= 24; k++) { const t = Math.PI - k / 24 * Math.PI; arc.push(new THREE.Vector3(cx + r * Math.cos(t), 1.35 + r * Math.sin(t), zf)); }
      arc.push(new THREE.Vector3(cx + r, 1.0, zf));
      const xm = X(1173) - 0.012, mur = [new THREE.Vector3(cx + r, 1.35, zf), new THREE.Vector3(xm, 1.95, Z(1258))];
      for (const [y, h] of [[1205, 1.8], [1150, 1.95], [1095, 1.8], [1040, 1.95], [985, 1.8], [930, 1.95]]) mur.push(new THREE.Vector3(xm, h, Z(y)));
      guirlande([arc, mur], 'Guirlande lumineuse');
    }
    const livres = [0x9c4a3c, 0x3f6a8a, 0xe0c36a, 0x5d8a6a, 0xd9d2c4, 0x7a5a8c];
    // Entrée : commode, étagères, chaises hautes, penderie avec banc
    B(248, 1503, 345, 1703, 0, 90, mat.chene, 'Commode 100 × 50');
    for (const z of [125, 155]) B(248, 1478, 370, 1518, z, z + 3, mat.chene, 'Étagères 61 × 20');
    tabouret(430, 1628, 'Chaise haute'); tabouret(570, 1628, 'Chaise haute');
    const pen = new THREE.Group(); pen.userData.nom = 'Banc et penderie 40 × 150'; pen.name = 'Banc et penderie'; cur.add(pen);
    B(440, 1800, 560, 1880, 0, H, mat.blanc, null, pen);          // colonne penderie
    B(560, 1800, 740, 1880, 200, H, mat.blanc, null, pen);        // caisson haut
    B(560, 1800, 740, 1880, 0, 45, mat.chene, null, pen);           // banc
    B(560, 1876, 740, 1880, 45, 200, mat.blanc, null, pen);
    for (let x = 566; x < 736; x += 12) B(x, 1871, x + 6, 1876, 45, 200, mat.chene, null, pen);   // tasseaux
    B(590, 1866, 706, 1870, 160, 162, mat.noir, null, pen);         // patère
    // Prolongement au-dessus de la porte d'entrée : étagère à livres
    B(248, 1800, 440, 1880, 208, 212, mat.blanc, null, pen);
    B(248, 1800, 440, 1880, 246, H, mat.blanc, null, pen);
    B(248, 1800, 252, 1880, 212, 246, mat.blanc, null, pen);
    for (let k = 0, x = 256; x < 428; k++) {
      const ep = 7 + (k * 5) % 6;
      B(x, 1835, x + ep, 1876, 212, 234 + (k * 3) % 9, M(livres[(k * 2 + 1) % 6]), 'Étagère à livres', pen);
      x += ep + 1;
    }
  }
  if (visite) obstacles();
}
construire();

/* ---------- Caméra & interface ---------- */
function vue(dessus) {
  if (dessus) camera.position.set(0, 15.5, 0.01);
  else camera.position.set(-6.5, 8, 9.5);
  controls.target.set(0, 0.4, 0);
  controls.update();
}
vue(false);

const $ = id => document.getElementById(id);
$('aide').textContent = $('aide').dataset.orbite;

/* ---------- Mode visite : marche à hauteur d'yeux ---------- */
const YEUX = 1.6, RAYON = 0.2;
let yaw = Math.PI, pitch = 0, coupeAvant = true;
const pos = new THREE.Vector3(), touches = new Set(), joy = { x: 0, y: 0 };
function obstacles() {
  obst = [];
  root.updateMatrixWorld(true);
  root.traverse(o => {
    if (!o.isMesh || o.userData.nom === 'Baie vitrée') return;
    for (let p = o; p; p = p.parent) if (!p.visible) return;
    const b = new THREE.Box3().setFromObject(o);
    if (b.max.y < 0.25 || b.min.y > 1.7) return;      // sol, seuils, linteaux
    obst.push(b);
  });
}
const libre = (x, z) => !obst.some(b => x > b.min.x - RAYON && x < b.max.x + RAYON && z > b.min.z - RAYON && z < b.max.z + RAYON);
function marche(dt) {
  const k = c => touches.has(c) ? 1 : 0;
  const av = k('KeyW') + k('ArrowUp') - k('KeyS') - k('ArrowDown') - joy.y;
  const lat = k('KeyD') - k('KeyA');
  yaw -= (k('ArrowRight') - k('ArrowLeft') + joy.x) * 1.8 * dt;
  const dx = (-Math.sin(yaw) * av + Math.cos(yaw) * lat) * 1.6 * dt;
  const dz = (-Math.cos(yaw) * av - Math.sin(yaw) * lat) * 1.6 * dt;
  if (libre(pos.x + dx, pos.z)) pos.x += dx;
  if (libre(pos.x, pos.z + dz)) pos.z += dz;
  camera.position.set(pos.x, YEUX, pos.z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
}
function basculeVisite() {
  visite = !visite;
  $('bVisite').classList.toggle('on', visite);
  $('bVisite').querySelector('span').textContent = visite ? 'Quitter la visite' : 'Visite';
  for (const id of ['bMurs', 'gVues']) $(id).style.display = visite ? 'none' : '';
  $('joy').style.display = visite ? 'block' : 'none';
  $('aide').textContent = $('aide').dataset[visite ? 'visite' : 'orbite'];
  controls.enabled = !visite;
  if (visite) { coupeAvant = coupe; coupe = false; pos.set(X(700), 0, Z(480)); yaw = Math.PI; pitch = -0.08; }
  else { coupe = coupeAvant; touches.clear(); }
  camera.fov = visite ? 70 : 40; camera.near = visite ? 0.05 : 0.1; camera.updateProjectionMatrix();
  construire();
  if (!visite) vue(false);
}
$('bVisite').onclick = e => { basculeVisite(); e.currentTarget.blur(); };
addEventListener('keydown', e => { if (visite) { touches.add(e.code); if (e.code.startsWith('Arrow')) e.preventDefault(); } });
// Raccourcis clavier (AZERTY comme QWERTY) : la rangée des chiffres est lue par position physique (& é " ' = 1 2 3 4),
// les lettres par leur caractère ; en visite, Z Q S D restent pour la marche.
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const versions = { Digit1: 'bVide', Digit2: 'bActuel', Digit3: 'bProjet', Digit4: 'bVideP', Numpad1: 'bVide', Numpad2: 'bActuel', Numpad3: 'bProjet', Numpad4: 'bVideP' };
  if (versions[e.code]) { $(versions[e.code]).click(); e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  if (k === 'v' || (k === 'escape' && visite)) { basculeVisite(); return; }
  if (visite) return;
  if (k === 'd') vue(true);
  else if (k === 'r') vue(false);
  else if (k === 'm') $('bMurs').click();
});
addEventListener('keyup', e => touches.delete(e.code));
addEventListener('blur', () => touches.clear());
{ // regarder autour de soi en glissant
  let glisse = null;
  const c = renderer.domElement;
  c.addEventListener('pointerdown', e => { if (visite) { glisse = [e.clientX, e.clientY]; c.setPointerCapture(e.pointerId); } });
  c.addEventListener('pointermove', e => {
    if (!visite || !glisse) return;
    yaw -= (e.clientX - glisse[0]) * 0.005;
    pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - glisse[1]) * 0.005));
    glisse = [e.clientX, e.clientY];
  });
  const fin = () => glisse = null;
  c.addEventListener('pointerup', fin); c.addEventListener('pointercancel', fin);
  // manette tactile : haut/bas = avancer/reculer, gauche/droite = tourner
  const j = $('joy'), bouton = j.firstElementChild;
  const bouge = e => {
    const r = j.getBoundingClientRect();
    let x = (e.clientX - r.left) / r.width * 2 - 1, y = (e.clientY - r.top) / r.height * 2 - 1;
    const n = Math.hypot(x, y); if (n > 1) { x /= n; y /= n; }
    joy.x = x; joy.y = y; bouton.style.transform = `translate(${x * 35}px, ${y * 35}px)`;
  };
  const lache = () => { joy.x = joy.y = 0; bouton.style.transform = ''; };
  j.addEventListener('pointerdown', e => { j.setPointerCapture(e.pointerId); bouge(e); });
  j.addEventListener('pointermove', e => { if (j.hasPointerCapture(e.pointerId)) bouge(e); });
  j.addEventListener('pointerup', lache); j.addEventListener('pointercancel', lache);
}
for (const [id, m] of [['bVide', 'vide'], ['bActuel', 'actuel'], ['bProjet', 'projet'], ['bVideP', 'videProjet']])
  $(id).onclick = () => {
    mode = m; construire();
    for (const b of ['bVide', 'bActuel', 'bProjet', 'bVideP']) { $(b).classList.toggle('on', b === id); $(b).setAttribute('aria-pressed', b === id); }
    for (const b of ['bInv', 'bEcran']) $(b).style.display = m === 'projet' ? '' : 'none';
  };
const bascule = (id, val) => { $(id).classList.toggle('on', val); $(id).setAttribute('aria-checked', val); };
$('bInv').onclick = () => { inverse = !inverse; bascule('bInv', inverse); construire(); };
$('bEcran').onclick = () => { ecran = !ecran; bascule('bEcran', ecran); construire(); };
$('bMurs').onclick = () => { coupe = !coupe; bascule('bMurs', !coupe); construire(); };
$('bDessus').onclick = () => vue(true);
$('b3d').onclick = () => vue(false);
$('bGlb').onclick = () => {
  new GLTFExporter().parse(root, buf => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' }));
    a.download = `appartement-${mode}.glb`;
    a.click();
  }, err => alert('Export impossible : ' + err), { binary: true, onlyVisible: true });
};

// Infobulle : nom de l'élément survolé
const ray = new THREE.Raycaster(), souris = new THREE.Vector2(), tip = $('tip');
renderer.domElement.addEventListener('pointermove', e => {
  souris.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(souris, camera);
  let nom = null;
  for (const hit of ray.intersectObject(root, true)) {
    let o = hit.object, vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) vis = false;
    if (!vis) continue;
    for (; o && !nom; o = o.parent) nom = o.userData.nom;
    break;
  }
  if (nom && nom !== 'Sol' && nom !== 'Mur') {
    tip.textContent = nom; tip.style.display = 'block';
    tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px';
  } else tip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => tip.style.display = 'none');

function taille() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', taille); taille();
const horloge = new THREE.Clock();
window.__app = { scene, camera, root, vue, controls, pos, basculeVisite, get obst() { return obst; } };
renderer.setAnimationLoop(() => {
  const dt = Math.min(horloge.getDelta(), 0.05);
  if (visite) marche(dt); else controls.update();
  renderer.render(scene, camera);
});
</script>
