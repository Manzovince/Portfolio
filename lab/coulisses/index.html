<style>
  :root {
    color-scheme: dark;
    --bg: #041e2a; --panel: #072a39; --panel-hi: #0a3447;
    --line: rgba(231, 215, 192, .12); --line-hi: rgba(231, 215, 192, .28);
    --text: #e7d7c0; --muted: rgba(231, 215, 192, .58); --faint: rgba(231, 215, 192, .36);
    --accent: hsl(175, 43%, 47%); --accent-soft: hsla(175, 43%, 47%, .14);
    --warn: hsl(22, 100%, 58%);
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --display: 'Unbounded', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font: 16px/1.5 'IBM Plex Serif', serif;
    min-height: 100dvh; -webkit-font-smoothing: antialiased;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px; background-position: -1px -1px;
  }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 0%, transparent 0%, var(--bg) 70%); }
  .wrap { position: relative; max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  [hidden] { display: none !important; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Top bar */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0; font: 500 .72rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .bar a { text-decoration: none; }
  .bar a:hover { color: var(--text); }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-hi); border-radius: 999px; padding: 4px 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px hsla(22, 100%, 58%, .18); }
  .unlocked .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* Lock screen */
  #lock { min-height: calc(100dvh - 140px); display: grid; place-items: center; padding: 24px 0 48px; }
  .card { width: 100%; max-width: 440px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line-hi); border-radius: 14px; padding: 32px 28px 24px; backdrop-filter: blur(6px); }
  .glyph { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 20px; }
  .eyebrow { font: 500 .72rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  h1 { font: 600 clamp(1.7rem, 5vw, 2.2rem)/1.15 var(--display); letter-spacing: -.01em; margin: 6px 0 10px; }
  .lede { color: var(--muted); margin-bottom: 24px; }
  label { display: block; font: 500 .72rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .field { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: 1rem var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line-hi); border-radius: 8px; padding: 11px 12px; }
  input::placeholder { color: var(--faint); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn { font: 600 .8rem var(--display); color: var(--bg); background: var(--accent); border: 0; border-radius: 8px; padding: 0 18px; cursor: pointer; white-space: nowrap; }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .status { min-height: 1.5em; margin-top: 10px; font: .8rem var(--mono); color: var(--muted); }
  .status.err { color: var(--warn); }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .fine { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line-hi); font: .7rem/1.6 var(--mono); color: var(--faint); }

  /* Lab */
  #lab { padding: 16px 0 64px; }
  .head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; margin-bottom: 28px; }
  .stats { display: flex; gap: 28px; }
  .stat b { display: block; font: 600 1.5rem var(--display); }
  .stat span { font: 500 .68rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line-hi); border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter { font: 500 .75rem var(--mono); color: var(--muted); background: transparent; border: 1px solid var(--line-hi); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .filter:hover { color: var(--text); }
  .filter[aria-pressed="true"] { color: var(--bg); background: var(--text); border-color: var(--text); }
  .filter small { opacity: .6; margin-left: 4px; }
  .search { position: relative; flex: 0 1 260px; }
  .search input { width: 100%; padding: 7px 34px 7px 12px; font-size: .85rem; }
  .search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: .7rem var(--mono); color: var(--faint); border: 1px solid var(--line-hi); border-radius: 4px; padding: 0 5px; }
  .ghost { font: 500 .72rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: none; border: 0; cursor: pointer; }
  .ghost:hover { color: var(--warn); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .exp { display: flex; flex-direction: column; gap: 10px; min-height: 172px; padding: 18px 18px 14px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; transition: border-color .15s, background .15s, transform .15s; }
  .exp:hover { border-color: var(--accent); background: var(--panel-hi); transform: translateY(-2px); }
  .exp-top { display: flex; justify-content: space-between; gap: 8px; font: 500 .7rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .exp-top .cat { color: var(--accent); }
  .exp h2 { font: 600 1.15rem/1.25 var(--display); }
  .exp:hover h2 { color: var(--warn); }
  .exp p { color: var(--muted); font-style: italic; flex: 1; }
  .exp-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding-top: 10px; border-top: 1px dashed var(--line); font: .72rem var(--mono); color: var(--faint); }
  .exp-meta .path { color: var(--muted); margin-right: auto; }
  .tag { border: 1px solid var(--line-hi); border-radius: 4px; padding: 0 5px; }
  .tag.new { color: var(--accent); border-color: var(--accent); }
  .empty { padding: 48px 0; text-align: center; font: .85rem var(--mono); color: var(--muted); }

  @media (max-width: 560px) {
    .card { padding: 24px 18px 18px; }
    .stats { gap: 20px; }
    .search { flex-basis: 100%; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: unb64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(DATA.iv) }, key, unb64(DATA.ct));
  return new TextDecoder().decode(plain);
}

const fmt = (d) => new Date(d + 'T12:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
const daysAgo = (d) => (Date.now() - new Date(d + 'T12:00')) / 864e5;
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

let projects = [];
let cat = 'Tous';

function render() {
  const q = $('q').value.trim().toLowerCase();
  const grid = $('grid');
  grid.replaceChildren();
  const shown = projects.filter((p) => (cat === 'Tous' || p.cat === cat) &&
    (!q || `${p.name} ${p.desc} ${p.path} ${p.cat || ''}`.toLowerCase().includes(q)));
  for (const p of shown) {
    const a = el('a', 'exp'); a.href = p.path;
    const top = el('div', 'exp-top');
    top.append(el('span', null, p.id), el('span', 'cat', p.cat || ''));
    const meta = el('div', 'exp-meta');
    meta.append(el('span', 'path', p.path));
    if (p.updated && daysAgo(p.updated) < 7) meta.append(el('span', 'tag new', 'récent'));
    if (p.pwa) meta.append(el('span', 'tag', 'PWA'));
    if (p.updated) meta.append(el('span', null, 'màj ' + fmt(p.updated)));
    a.append(top, el('h2', null, p.name), el('p', null, p.desc), meta);
    grid.append(a);
  }
  $('empty').hidden = shown.length > 0;
}

function show(json) {
  projects = JSON.parse(json);
  // EXP numbers follow creation order; the grid lists the latest work first
  [...projects].sort((a, b) => (a.created || '').localeCompare(b.created || ''))
    .forEach((p, i) => { p.id = 'EXP-' + String(i + 1).padStart(3, '0'); });
  projects.sort((a, b) => (b.updated || '').localeCompare(a.updated || '') || a.name.localeCompare(b.name, 'fr'));

  const stats = [[projects.length, 'expériences']];
  const pwa = projects.filter((p) => p.pwa).length;
  if (pwa) stats.push([pwa, 'installables']);
  const last = projects.map((p) => p.updated).filter(Boolean).sort().pop();
  if (last) stats.push([fmt(last).replace(/ \d{4}$/, ''), 'dernière màj']);
  $('stats').replaceChildren(...stats.map(([v, l]) => { const s = el('div', 'stat'); s.append(el('b', null, v), el('span', null, l)); return s; }));

  const counts = {};
  for (const p of projects) if (p.cat) counts[p.cat] = (counts[p.cat] || 0) + 1;
  const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  $('filters').replaceChildren(...(cats.length > 1 ? ['Tous', ...cats] : []).map((c) => {
    const b = el('button', 'filter', c);
    b.append(el('small', null, c === 'Tous' ? projects.length : counts[c]));
    b.setAttribute('aria-pressed', c === cat);
    b.onclick = () => { cat = c; document.querySelectorAll('.filter').forEach((f) => f.setAttribute('aria-pressed', f === b)); render(); };
    return b;
  }));

  render();
  $('lock').hidden = true;
  $('lab').hidden = false;
  $('state').textContent = 'Session ouverte';
  document.body.classList.add('unlocked');
}

const form = document.querySelector('form');
const input = $('pw');
const btn = form.querySelector('.btn');
const status = $('status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  status.className = 'status';
  status.textContent = 'Dérivation de la clé…';
  try {
    const json = await decrypt(input.value);
    try { sessionStorage.setItem(CACHE, json); } catch {}
    status.textContent = '';
    show(json);
  } catch {
    status.className = 'status err';
    status.textContent = 'Mot de passe incorrect.';
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    input.select();
  }
  btn.disabled = false;
});

$('q').addEventListener('input', render);
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !$('lab').hidden && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
});
$('lockBtn').onclick = () => {
  try { sessionStorage.removeItem(CACHE); } catch {}
  location.reload();
};

// Coming back from an app in the same tab should not ask for the password again
try { const cached = sessionStorage.getItem(CACHE); if (cached) show(cached); } catch {}
</script>
</body>
</html>
