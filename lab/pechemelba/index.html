<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#cfe0d8">
<title>Nouvel onglet</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12302b;--ink2:#4a6a63;--accent:#e8605a;--accent2:#d24f4a;
  --field:rgba(250,252,248,.78);--field-b:#12302b;--chip:rgba(250,252,248,.66);
  --panel:#f5f2e8;--panel-ink:#1d2a28;--line:#3b2a35;--glow:0 0 0 transparent;
}
html.nuit{
  --ink:#eef2ea;--ink2:#b3c0c6;--field:rgba(14,22,42,.62);--field-b:#c9d4dc;--chip:rgba(14,22,42,.5);
  --glow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#cfe0d8;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--ink);transition:color .8s}
#scene{position:fixed;left:0;top:0;image-rendering:pixelated;cursor:default}
#scene.cible{cursor:crosshair}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}
#ui a,#ui button,#ui input,#ui form,#ui select,.toast,#hint.clic{pointer-events:auto}
header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;gap:12px}
.brand{display:flex;gap:9px;align-items:center;font:600 14px 'JetBrains Mono',monospace;color:var(--ink);text-shadow:var(--glow);background:none;border:0;padding:8px 12px;margin:-8px -12px;border-radius:999px;cursor:pointer;transition:background .2s}
.brand:hover{background:var(--chip)}
.brand svg{width:16px;height:18px}
.hd-r{display:flex;gap:8px}
.pill{border:0;border-radius:999px;padding:10px 16px;font:600 13px/1 'JetBrains Mono',monospace;cursor:pointer;color:var(--ink);background:var(--chip);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .12s,background .2s}
.pill:hover{transform:translateY(-1px)}
.pill.coin{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pill.acc{background:var(--accent);color:#fff}
.pill.acc:hover{background:var(--accent2)}
.pill.ico{padding:0;width:34px;height:33px;display:grid;place-items:center}
main{display:flex;flex-direction:column;align-items:center;margin-top:0;width:100%;padding:0 16px}
#clock{font-weight:800;font-size:clamp(40px,6vw,76px);letter-spacing:-.03em;line-height:1;text-shadow:var(--glow);font-variant-numeric:tabular-nums}
#date{font-size:14px;color:var(--ink2);margin-top:10px;text-align:center;text-shadow:var(--glow)}
#date b{font-weight:600;color:var(--ink)}
#search{margin-top:18px;width:min(560px,100%);display:flex;align-items:center;gap:10px;background:var(--field);border:2px solid var(--field-b);border-radius:999px;padding:0 8px 0 18px;box-shadow:3px 3px 0 var(--field-b);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#search svg{flex:none;opacity:.7}
#q{flex:1;min-width:0;border:0;background:transparent;font:400 15px 'JetBrains Mono',monospace;color:var(--ink);padding:14px 0;outline:none}
#q::placeholder{color:var(--ink2)}
#eng{flex:none;border:0;background:transparent;font:600 11px 'JetBrains Mono',monospace;color:var(--ink2);cursor:pointer;padding:6px 8px;border-radius:999px}
#eng:hover{background:var(--chip)}
#links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;max-width:min(760px,100%)}
.lk{position:relative;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:var(--chip);border-radius:999px;padding:6px 14px 6px 6px;font-size:13px;font-weight:600;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .12s}
.lk:hover{transform:translateY(-1px)}
.lk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.lk .x{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;border:0;background:var(--line);color:#fff;font-size:11px;line-height:18px;padding:0;cursor:pointer;display:none}
.lk:hover .x{display:block}
.lk.add{padding:6px 14px;cursor:pointer;border:0;font-family:inherit}
#addf{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#addf input{border:2px solid var(--field-b);background:var(--field);color:var(--ink);border-radius:999px;padding:7px 12px;font:13px 'JetBrains Mono',monospace;width:150px;outline:none}
#addf input[name=u]{width:220px}
#hint{position:fixed;left:50%;bottom:3.2vh;transform:translateX(-50%);font-size:12px;font-weight:600;color:#fff;background:rgba(30,40,46,.55);padding:7px 14px;border-radius:999px;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none}
#hint.on{opacity:1}
#hint.fort{background:var(--accent);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.06)}}
.toast{position:fixed;left:50%;bottom:calc(var(--wh,18vh) + 22px);transform:translate(-50%,12px);display:flex;align-items:center;gap:14px;background:var(--panel);color:var(--panel-ink);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line);border-radius:14px;padding:10px 16px 10px 12px;opacity:0;transition:opacity .3s,transform .3s;max-width:min(560px,92vw);cursor:pointer;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast canvas{image-rendering:pixelated;flex:none}
.toast .t1{font-weight:800;font-size:15px}
.toast .t2{font-size:12px;opacity:.75;margin-top:3px}
.tag{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:999px;color:#fff;margin-left:6px;vertical-align:2px}
.new{background:var(--accent)}
/* carnet */
#modal{position:fixed;inset:0;background:rgba(20,30,34,.4);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.on{display:flex}
.panel{background:var(--panel);color:var(--panel-ink);border:2px solid var(--line);box-shadow:6px 6px 0 var(--line);border-radius:16px;width:min(720px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:2px solid var(--line)}
.ph .tab{border:0;background:transparent;font:800 14px 'JetBrains Mono',monospace;color:var(--panel-ink);opacity:.45;cursor:pointer;padding:6px 10px;border-radius:999px}
.ph .tab.on{opacity:1;background:rgba(59,42,53,.08)}
.ph .sp{flex:1}
.ph .close{border:0;background:var(--line);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
.pb{overflow:auto;padding:16px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px}
.stat b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:12px;position:relative}
.card canvas{image-rendering:pixelated;height:48px;width:auto;margin:4px 0 6px}
.card .nm{font-weight:800;font-size:13px}
.card .rr{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.card.inc{background:#ece8dc;color:#8b8478}
.card .ms{font-style:italic;font-size:11px;opacity:.8}
.set{display:grid;gap:14px;font-size:13px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.set select,.set button{font:600 13px 'JetBrains Mono',monospace;border:2px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;color:var(--panel-ink);cursor:pointer}
.set .danger{background:var(--accent);color:#fff}
.set p{margin:0;font-size:12px;opacity:.75;line-height:1.5}
.wh{font-size:13px;margin:18px 0 8px}
.wh:first-of-type{margin-top:4px}
.lockl{font-size:12px;opacity:.65;margin:10px 0 0}
.wl{display:grid;gap:10px}
.card.shop{cursor:pointer;transition:transform .12s}
.card.shop:hover{transform:translateY(-2px)}
.card.shop.worn{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent)}
.card.shop.poor{opacity:.5;cursor:default}
.card.shop canvas{height:96px}
.price{display:inline-flex;align-items:center;gap:4px;font-weight:800}
.poems{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.poem{white-space:pre-line;font-style:italic;font-size:12px;line-height:1.6;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.haiku{display:block;font-style:italic;line-height:1.5;color:var(--panel-ink)}
.wcard{display:flex;gap:14px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;cursor:pointer;font:13px 'JetBrains Mono',monospace;color:var(--panel-ink)}
.wcard small{opacity:.7;font-size:11px;line-height:1.5}
.wcard.lock{opacity:.55;cursor:default}
.wcard.cur{box-shadow:3px 3px 0 var(--accent);border-color:var(--accent)}
.wcard .sw{width:64px;height:44px;border-radius:8px;border:2px solid var(--line);flex:none}
.sun{display:inline-flex;align-items:center;gap:4px;margin-left:10px}
.sun svg{width:14px;height:14px}
@media (max-width:560px){header{padding:14px 16px}.brand span{display:none}main{margin-top:0}#search{margin-top:16px}}
@media (max-height:620px){#clock{font-size:clamp(36px,5vw,56px)}#search{margin-top:14px}#links{margin-top:12px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">
  <header>
    <button class="brand" id="bWorld" title="Changer de monde"><svg viewBox="0 0 8 9" shape-rendering="crispEdges"><path fill="currentColor" d="M3 0h2v1h1v2H5v1h2v2H6v1h2v1H5v2H3V7H0V6h2V5H1V3h2V1h0z"/></svg><span id="wName">Pêche Melba</span></button>
    <div class="hd-r">
      <button class="pill coin" id="bShop" title="Boutique"><svg width="14" height="14" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><path fill="#c8901c" d="M2 0h3v1H2zM1 1h1v1H1zM5 1h1v1H5zM0 2h1v3H0zM6 2h1v3H6zM1 5h1v1H1zM5 5h1v1H5zM2 6h3v1H2z"/><path fill="#f2c64a" d="M2 1h3v1H2zM1 2h5v3H1zM2 5h3v1H2z"/><path fill="#fff0a0" d="M2 2h1v2H2z"/></svg><span id="nCoin">0</span></button>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, R=Math.random, rnd=(a,b)=>a+R()*(b-a);
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
const store={
  get(k,d){try{const v=localStorage.getItem('ponton.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('ponton.'+k,JSON.stringify(v))}catch(e){}}
};

/* ---------- temps & soleil (debug : ?h=21.5 fige l'heure de départ, ?speed=600 accélère) ---------- */
const Q=new URLSearchParams(location.search);
const T0=Date.now(), FH=Q.has('h')?parseFloat(Q.get('h')):null, SPEED=parseFloat(Q.get('speed')||'1');
function now(){
  if(FH==null&&SPEED===1)return new Date();
  const b=new Date(T0);if(FH!=null){b.setHours(0,0,0,0);b.setTime(b.getTime()+FH*36e5)}
  return new Date(b.getTime()+(Date.now()-T0)*SPEED);
}
const GEO=(()=>{
  const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'';
  if(/Paris|Brussels|Luxembourg|Monaco|Andorra/.test(tz))return{lat:46.5,lon:2.4};
  const j=new Date(2026,0,1).getTimezoneOffset(),u=new Date(2026,6,1).getTimezoneOffset();
  return{lat:j<u?-34:46,lon:-Math.max(j,u)/4};
})();
function sunElev(d){
  const doy=(d-Date.UTC(d.getUTCFullYear(),0,0))/864e5;
  const dec=23.44*Math.sin(2*Math.PI*(284+doy)/365)*Math.PI/180;
  const B=2*Math.PI*(doy-81)/364, eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
  const h=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600+GEO.lon/15+eot/60;
  const H=(h-12)*15*Math.PI/180, la=GEO.lat*Math.PI/180;
  return Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H))*180/Math.PI;
}
let sunCache={k:'',rise:null,set:null};
function sunTimes(d){
  const k=d.toDateString();if(sunCache.k===k)return sunCache;
  const day=new Date(d);day.setHours(0,0,0,0);
  let prev=sunElev(day),rise=null,set=null;
  for(let m=10;m<=1440;m+=10){
    const t=new Date(day.getTime()+m*6e4),e=sunElev(t),f=(e+.83)/(e-prev||1e-6);
    if(prev<-.83&&e>=-.83&&!rise)rise=new Date(t-6e5*f);
    if(prev>=-.83&&e<-.83&&!set)set=new Date(t-6e5*f);
    prev=e;
  }
  return sunCache={k,rise,set};
}
// palettes par élévation du soleil : ciel haut, ciel bas, teinte, force, eau, reflet, nuit
const SKY=[
  [-18,'#0b1230','#1d2a4e','#121a3a',.6,'#16233a','#3a4e70',1],
  [-9,'#1c2756','#4c4f80','#262858',.48,'#25304e','#56688c',.9],
  [-3,'#4f5f94','#d99288','#5a4676',.3,'#5c6080','#c79a9c',.5],
  [2,'#8fb0c6','#f5c29a','#f2a070',.17,'#87a0a6','#f0d2b4',.12],
  [9,'#b6d3d0','#eedcc2','#f6d2a8',.07,'#8db1aa','#dbe6d4',0],
  [22,'#c4ddd6','#dbe9e0','#ffffff',0,'#8fb6ae','#d4e6dc',0]
].map(r=>({e:r[0],top:hex(r[1]),bot:hex(r[2]),tint:hex(r[3]),ta:r[4],water:hex(r[5]),hi:hex(r[6]),dark:r[7]}));
function skyAt(e){
  if(e<=SKY[0].e)return SKY[0];if(e>=SKY[SKY.length-1].e)return SKY[SKY.length-1];
  let i=0;while(SKY[i+1].e<e)i++;
  const a=SKY[i],b=SKY[i+1],t=(e-a.e)/(b.e-a.e);
  return{top:mix(a.top,b.top,t),bot:mix(a.bot,b.bot,t),tint:mix(a.tint,b.tint,t),ta:lerp(a.ta,b.ta,t),water:mix(a.water,b.water,t),hi:mix(a.hi,b.hi,t),dark:lerp(a.dark,b.dark,t)};
}

/* ---------- sprites ---------- */
const OUT='#3b2a35';
function canvasOf(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g]}
// carte de caractères -> sprite, avec contour automatique autour des pixels pleins
function mapSprite(map,pal,outline=true){
  const h=map.length,w=Math.max(...map.map(r=>r.length)),o=outline?1:0;
  const [c,g]=canvasOf(w+2*o,h+2*o),full=(x,y)=>y>=0&&y<h&&x>=0&&map[y][x]&&map[y][x]!=='.';
  for(let y=-o;y<h+o;y++)for(let x=-o;x<w+o;x++){
    if(full(x,y)){g.fillStyle=pal[map[y][x]];g.fillRect(x+o,y+o,1,1)}
    else if(outline&&(full(x+1,y)||full(x-1,y)||full(x,y+1)||full(x,y-1))){g.fillStyle=OUT;g.fillRect(x+o,y+o,1,1)}
  }
  return c;
}
function gridSprite(w,h,col){ // col(x,y) -> couleur ou null ; contour auto
  const cells=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)cells.push(col(x,y));
  const full=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&cells[y*w+x];
  const [c,g]=canvasOf(w+2,h+2);
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){
    if(full(x,y)){g.fillStyle=cells[y*w+x];g.fillRect(x+1,y+1,1,1)}
    else if(full(x+1,y)||full(x-1,y)||full(x,y+1)||full(x,y-1)){g.fillStyle=OUT;g.fillRect(x+1,y+1,1,1)}
  }
  return c;
}
const TREE_PAL=['#4c7473','#6a978f','#98b9a3','#cbdcb4'];
function makePine(h,seed,back,base=TREE_PAL,snow=false){
  const r=rng(seed),w=Math.round(h*.52)|1,cx=w>>1,trunkH=Math.max(4,Math.round(h*.13)),fh=h-trunkH+2;
  const tiers=Math.max(3,Math.round(fh/10)),tw=Math.max(2,Math.round(w*.11));
  const pal=base.map(c=>back?rgb(mix(hex(c),[214,230,222],.32)):c);
  const deep=rgb(mix(hex(pal[0]),[40,52,60],back?.15:.4));
  const T=[];for(let i=0;i<tiers;i++)T.push({ph:(r()*12)|0,mx:(w/2)*(.3+.7*(i+1)/tiers)*(.93+r()*.1)});
  const halves=[];
  for(let y=0;y<fh;y++){
    const tp=y/fh*tiers,ti=Math.min(tiers-1,Math.floor(tp)),t=tp-ti,mx=T[ti].mx;
    halves.push({half:(ti===0?mx*Math.pow(t,.85):mx*(.4+.6*t))+(r()-.5)*.8,t,ti});
  }
  // bout des branches qui retombe sous chaque étage
  const tips=new Map();
  for(let i=0;i<tiers-1;i++){
    const yb=Math.round((i+1)*fh/tiers),mx=T[i].mx;
    for(let dx=Math.ceil(mx*.45);dx<=mx+.5;dx++)for(const sg of[-1,1]){
      if((dx+T[i].ph+(sg>0?1:0))%3)continue;
      const len=1+(dx>mx*.7?1:0)+(r()<.3?1:0);
      for(let k=0;k<len;k++)tips.set((yb+k)*w+cx+sg*dx,k);
    }
  }

function fishSprite(sp){
  if(sp.map)return mapSprite(sp.map,sp.pal);
  const L=sp.look,len=L.len,h=L.h,r=rng(len*97+h*13+sp.id.length*7);
  const cat=L.shape==='cat',eel=L.shape==='eel',sw=L.shape==='sword',W=len+4+(sw?6:0),Hh=h+4+(cat?2:0),cy=Math.floor((h+3)/2)+1;
  const prof=u=>eel?(u<.08?u/.08:u>.92?(1-u)/.08*.6+.4:1):Math.pow(Math.sin(Math.PI*clamp(.1+.9*u,0,1)),L.shape==='long'?.35:.6);
  const spots=new Set();for(let i=0;i<len*h*.18;i++)spots.add((r()*W|0)+','+(r()*Hh|0));
  const koi=new Set();for(let i=0;i<3;i++){const kx=4+r()*(len-4)|0;for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=1;dy++)if(r()<.8)koi.add((kx+dx)+','+(cy+dy))}
  return gridSprite(W,Hh,(x,y)=>{
    // queue
    if(!eel&&x<3){const hh=[2.6,1.8,1][x];if(Math.abs(y-cy)<=hh&&!(x===0&&y===cy))return L.fin;return null}
    const u=(x-3)/(len),half=h/2*prof(u);
    if(u<=1&&Math.abs(y-cy)<=half){
      const v=(y-(cy-half))/(2*half+.01);
      if(x===len+2-(eel?1:2)&&y===Math.round(cy-half*.35))return OUT;
      let c=v<.3?L.back:v<.72?L.body:L.belly;
      if(L.pat==='stripes'&&x%3===0&&v<.72&&u>.15&&u<.82)c=L.back;
      if(L.pat==='spots'&&spots.has(x+','+y)&&v<.75)c=(x+y)%3?'#3e3a30':'#d0503e';
      if(L.pat==='light'&&spots.has(x+','+y)&&v>.2&&v<.75)c='#dfe6b0';
      if(L.pat==='scales'&&(x+y)%2===0&&v>.25&&v<.7)c=rgb(mix(hex(L.body),hex(L.back),.35));
      if(L.pat==='koi'&&koi.has(x+','+y))c=L.back;
      if(L.pat==='shine'&&v<.45&&(x+y*2)%5===0)c='#fff6c8';
      if(L.pat==='plates'&&v<.3&&x%3===1&&u>.1&&u<.9)c='#c8c4b4';
      if(L.pat==='clown'&&(Math.abs(x-(len*.75+3))<1||Math.abs(x-(len*.4+3))<1)&&u<1)c='#ffffff';
      if(L.pat==='rainbow'&&v>.42&&v<.62&&u>.1&&u<.9)c=(x%2?'#e87a8a':'#d86a9a');
      if(L.pat==='stars'&&spots.has(x+','+y))c=(x+y)%2?'#fff6c0':'#a8b8f0';
      return c;
    }
    // nageoires
    if(!eel&&u>.35&&u<.6&&y===Math.round(cy-half)-1)return L.fin;
    if(!eel&&u>.45&&u<.6&&y===Math.round(cy+half)+1)return L.fin;
    if(eel&&u>.1&&u<.85&&y===Math.round(cy-half)-1)return L.fin;
    if(sw&&x>=len+3&&y===cy)return '#4a5a6a';
    if(L.shape==='wing'&&u>.25&&u<.7&&y<cy-half&&y>=cy-half-1-Math.round((.7-u)*6))return L.fin;
    if(cat&&((x===len+1&&y===cy+2)||(x===len+2&&y===cy+3)||(x===len&&y===cy+3)))return '#2a2a26';
    return null;
  });
}

function makePalm(h,seed,back){
  const r=rng(seed),w=Math.round(h*1.6)|1,px=new Map(),base=w>>1,th=h*.66;
  const set=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<w&&y<h)px.set(x+','+y,back?rgb(mix(hex(c),[214,236,230],.3)):c)};
  const lean=(r()<.5?-1:1)*(.08+r()*.14)*h,trunk=[];let tx=base,ty=h-1;
  for(let i=0;i<th;i++){const x=base+lean*Math.pow(i/th,1.6),y=h-1-i;trunk.push([x,y]);tx=x;ty=y}
  // palettes : arrière (ombre), milieu, avant (au soleil, lumière d'en haut à gauche)
  const PAL={
    back:{rib:'#244428',up:['#3e6e3c','#2f5a32','#244628'],dn:['#2a4c2c','#203e24','#1a3420']},
    mid:{rib:'#3a6430',up:['#7ab452','#5a9a44','#3e7a38'],dn:['#4a8a3e','#3a7034','#2c5a2c']},
    front:{rib:'#4e7a34',up:['#c4e884','#8cc65c','#5a9e46'],dn:['#6aa84c','#4e8a3e','#3a6e34']},
    dead:{rib:'#8a6a38',up:['#d8b868','#b89448','#8a6a34'],dn:['#a88444','#8a6a34','#6a5028']}
  };
  const frond=(a,L,droop,P)=>{
    const dx=Math.cos(a),dy=Math.sin(a);
    for(let st=1;st<L;st++){
      const k=st/L,x=tx+dx*st,y=ty+dy*st*.7+k*k*L*droop;
      let gx=dx,gy=dy*.7+2*k*droop;const gl=Math.hypot(gx,gy)||1;gx/=gl;gy/=gl;
      if(st%2===0)for(const side of[-1,1]){
        let nx=-gy*side,ny=gx*side;
        let lx=nx*.8+gx*.55,ly=ny*.8+gy*.55+.55;const l2=Math.hypot(lx,ly);lx/=l2;ly/=l2;
        const ll=Math.max(1,Math.round(Math.sin(Math.PI*Math.min(1,k*1.05+.05))*L*.2)),upSide=ny<0,pal=upSide?P.up:P.dn;
        for(let j=1;j<=ll;j++){const t=j/ll;set(x+lx*j,y+ly*j,pal[t<.34?0:t<.7?1:2])}
      }
      set(x,y,P.rib);
    }
  };
  const N=13,list=[];
  for(let f=0;f<N;f++){const a=Math.PI-.5+f/(N-1)*(Math.PI+1)+(r()-.5)*.18;list.push({a,L:h*(.3+r()*.13),droop:.55+r()*.5,layer:f%3===1?'back':f%3===2?'mid':'front'})}
  list.push({a:Math.PI/2+(r()-.5)*.6,L:h*.24,droop:.2,layer:'dead'});
  for(const f of list.filter(f=>f.layer==='back'||f.layer==='dead'))frond(f.a,f.L,f.droop,PAL[f.layer]);
  trunk.forEach(([x,y],i)=>{
    const shade=th-i<6,ring=i%3===0,thin=i>th*.65;
    set(x-1,y,shade?'#7a5a3e':ring?'#a07e54':'#dcc08e');
    set(x,y,shade?'#5e4430':ring?'#7e6040':'#b08e60');
    if(!thin)set(x+1,y,shade?'#4a3424':ring?'#5e4430':'#7e5e3e');
  });
  for(const[cx,cy,c]of[[-1,2,'#6a4a30'],[1,2,'#5a3a24'],[0,3,'#6a4a30'],[-1,1,'#a07e54'],[0,2,'#7a5a3a']])set(tx+cx,ty+cy,c);
  for(const f of list.filter(f=>f.layer==='mid'))frond(f.a,f.L,f.droop,PAL.mid);
  for(const f of list.filter(f=>f.layer==='front').sort((a,b)=>Math.sin(b.a)-Math.sin(a.a)))frond(f.a,f.L,f.droop,PAL.front);
  return gridSprite(w,h,(x,y)=>px.get(x+','+y)||null);
}

function makeSail(d,seed){
  const r=rng(seed),hw=Math.round(7+d*12),sh=Math.round(6+d*14),mast=Math.round(hw*.42);
  const hull=['#e8605a','#3a5a8a','#f4f0e6','#2a7a6a','#c8a060'][r()*5|0],sail=r()<.75?'#fbf8f0':'#f2d888',stripe=r()<.4;
  const spr=gridSprite(hw,sh+3,(x,y)=>{
    if(y<sh){
      if(x===mast)return '#6a4a34';
      const k=(y+1)/sh;
      if(x>mast&&x<=mast+Math.round(k*(hw-mast-2)))return stripe&&y%4===2?'#e8605a':sail;
      if(x<mast&&x>=mast-Math.round(k*mast*.8)&&y>sh*.3)return sail;
      return null;
    }
    const row=y-sh;if(x<row||x>=hw-row*1.5)return null;
    return row?rgb(mix(hex(hull),[30,30,40],.25)):hull;
  });
  return{spr,mast};
}

function drawIslands(g,r,L){

function makeWillow(h,seed,back){
  const r=rng(seed),w=Math.round(h*.85)|1,cx=w>>1,cy=Math.round(h*.32),rx=w/2-1,ry=h*.28,tw=Math.max(2,Math.round(w*.08));
  const pal=['#3c4a30','#4b5b3a','#677846','#8a9a5c','#b2bc7e'].map(c=>back?rgb(mix(hex(c),[214,222,206],.32)):c);
  // feuillage en grosses touffes qui se chevauchent (celles du bas devant)
  const lobes=[{x:cx,y:cy,rx:rx*.62,ry:ry*.75}];
  for(let i=0;i<7;i++){const a=-Math.PI*(.05+.9*i/6),d=.55+r()*.2;lobes.push({x:cx+Math.cos(a)*rx*d*.75,y:cy+Math.sin(a)*ry*d*.7+ry*.15,rx:rx*(.32+r()*.12),ry:ry*(.38+r()*.12)})}
  for(let i=0;i<3;i++)lobes.push({x:cx+(i-1)*rx*.55+(r()-.5)*3,y:cy+ry*.45,rx:rx*(.3+r()*.1),ry:ry*.38});
  lobes.sort((a,b)=>a.y-b.y);
  const inLobe=(x,y)=>{let best=null;for(const L of lobes){const dx=(x-L.x)/L.rx,dy=(y-L.y)/L.ry,d=dx*dx+dy*dy;if(d<1)best={dx,dy,d}}return best};
  let bottom=0;for(const L of lobes)bottom=Math.max(bottom,L.y+L.ry);
  // rideaux de branches qui pendent
  const strands=new Map();
  for(let x=1;x<w-1;x++){
    if(r()<.4)continue;let top=-1;
    for(let y=Math.round(bottom);y>0;y--)if(inLobe(x,y)){top=y;break}
    if(top<0)continue;
    strands.set(x,{top,end:Math.min(h-3,Math.round(top+3+r()*h*.4)),ph:(r()*4)|0});
  }
  // branches visibles sous le feuillage
  const forks=[[-1,.5],[1,.45],[-1,.2],[1,.25]].map(([sg,k])=>({sg,k:k+r()*.1,len:Math.round(rx*(.35+r()*.2))}));
  return gridSprite(w,h,(x,y)=>{
    const L=inLobe(x,y);
    if(L){
      const n=(r()-.5)*.25;
      let v=-L.dx*.55-L.dy*.6+n;
      if(L.d>.72&&L.dy>0)v-=.5; // creux entre deux touffes
      if((x*3+y*5)%7===0)v-=.3;else if((x+y*2)%6===0&&v>0)v+=.25;
      return pal[v>.55?4:v>.15?3:v>-.25?2:v>-.65?1:0];
    }
    const st=strands.get(x);
    if(st&&y>st.top&&y<=st.end){
      if(y===st.end)return pal[(x%2)?1:0];
      const leaf=(y+st.ph)%3;
      return leaf===0?pal[3]:leaf===1?pal[2]:pal[1];
    }
    if(y>cy){
      const dy=h-1-y,tx=x-cx+.5;
      if(Math.abs(tx)<=tw/2+(y>h-3?1:0)+(y===h-1?1:0))return tx<0?((x+y)%4?'#7a5a46':'#8e6a52'):'#5a4036';
      for(const f of forks){const fy=Math.round(cy+(h-cy)*f.k),d=fy-y;if(d>=0&&d<=f.len&&Math.round(tx*f.sg)===Math.round(tw/2+d*.9))return '#5a4036'}
    }
    return null;
  });
}
function drawMountains(g,r,snowy){

const F={st:'idle',t:0,wait0:1.2,tx:0,wd:0,nib:0,fish:null,gauge:null,hold:null,first:true,ang:-1,bend:0,ear:0,blink:0,earT:3,blinkT:2,hop:0};

function setSt(s){F.st=s;F.t=0}
function isDark(){return skyAt(sunElev(now())).dark>.5}
function pickFish(){
  const dark=isDark(),pool=SP.filter(s=>(!s.noel||NOEL)&&inWorld(s,WORLD.id)&&(!s.when||(s.when==='nuit')===dark));
  let tot=pool.reduce((a,s)=>a+s.w,0),x=R()*tot;
  for(const s of pool){x-=s.w;if(x<=0)return s}
  return pool[0];
}
function sizeOf(sp,perfect){if(!sp.cm)return 0;const u=Math.pow(R(),perfect?.7:1.7);return Math.round(lerp(sp.cm[0],sp.cm[1],u))}
function cast(x){
  F.tx=Math.round(x??rnd(castMin(),castMax()));setSt('cast');F.fish=null;F.gauge=null;F.hold=null;hint('');
}
function bite(){F.fish=pickFish();setSt('bite');ripple(F.tx,WY+1,7);splash(F.tx,WY,4);
  hint('Ça mord ! Maintiens Espace ou le clic',true)}
function strike(){
  const rr=RAR[F.fish.rar];
  F.gauge={c:rnd(.25,.75),w:rr.zw,v:rr.v,ph:R()};setSt('reel');
  hint('Relâche quand l’aiguille est dans le vert',true);
}
function needle(){const g=F.gauge,p=(F.t*g.v+g.ph)%2;return p<1?p:2-p}
function tryHook(){
  const d=Math.abs(needle()-F.gauge.c);
  if(d<=F.gauge.w/2)landFish(F.fish,true,d<.035);
  else escape(F.fish.rar==='l'||F.fish.rar==='e'?'Quelque chose d’énorme s’est décroché…':'Il s’est décroché…');
}
function autoHook(){
  if(R()<RAR[F.fish.rar].auto)landFish(F.fish,false,false);
  else escape(F.fish.rar==='l'||F.fish.rar==='e'?'Quelque chose d’énorme s’est échappé…':null);
}
function landFish(sp,active,perfect){
  const cm=sizeOf(sp,perfect),res=addCatch(sp.id,cm,perfect);
  F.hold={sp,cm};setSt('catch');F.hop=.3;hint('');
  splash(F.tx,WY,8);ripple(F.tx,WY+1,9);
  if('relj'.includes(sp.rar)&&sp.rar!=='j'||perfect)for(let i=0;i<18;i++)parts.push({x:rodTip()[0],y:rodTip()[1]+6,vx:rnd(-14,14),vy:rnd(-22,-4),l:rnd(.6,1.2),c:sp.rar==='l'?'#ffd84a':'#fff6c8',g:10});
  let t2=RAR[sp.rar].n;
  if(cm)t2=(sp.id==='ecrevisse'?cm+' cm':cm+' cm')+' · '+t2;
  if(perfect)t2+=' · ferrage parfait';
  if(!active)t2+=' · ferré par le lapin';
  if(sp.quip)t2=sp.quip+' · '+t2;

function update(dt){

    case'cast':{const k=F.t;ang=k<.3?lerp(-1.05,-2.3,k/.3):lerp(-2.3,-.5,clamp((k-.3)/.25,0,1));

  if(balloon){balloon.x+=balloon.d*dt*5;if(balloon.x<-16||balloon.x>W+16)balloon=null}

    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;

    ctx.fillStyle=OUT;ctx.fillRect(bx0-1,by0-1,bw+2,9);ctx.fillStyle='#fffaf0';ctx.fillRect(bx0,by0,bw,7);ctx.fillRect(bx0+2,by0+7,2,1);ctx.fillStyle=OUT;ctx.fillRect(bx0+1,by0+8,2,1);
    ctx.fillStyle=n===3?'#d9792e':'#e8605a';for(let i=0;i<n;i++){ctx.fillRect(bx0+2+i*3,by0+1,1,3);ctx.fillRect(bx0+2+i*3,by0+5,1,1)}
  }
  if(F.st==='reel'&&F.gauge){
    const gw=48,gx=clamp(rab.x+7-24,2,W-gw-2),gy=rab.y-12,g=F.gauge;
    ctx.fillStyle=OUT;ctx.fillRect(gx-1,gy-1,gw+2,8);ctx.fillStyle='#f4efe4';ctx.fillRect(gx,gy,gw,6);
    const z0=Math.round(gx+(g.c-g.w/2)*gw),z1=Math.round(gx+(g.c+g.w/2)*gw);
    ctx.fillStyle='#7fbf8a';ctx.fillRect(z0,gy,z1-z0,6);ctx.fillStyle='#f2c64a';ctx.fillRect(Math.round(gx+g.c*gw)-1,gy,3,6);
    const nx=Math.round(gx+needle()*(gw-1));ctx.fillStyle=OUT;ctx.fillRect(nx,gy-2,1,10);ctx.fillRect(nx-1,gy-3,3,1);
  }
}

function drawSunMoon(d,e,sk){
  const day=new Date(d);day.setHours(0,0,0,0);const frac=(d-day)/864e5;
  if(e>-6){ // soleil
    const x=Math.round(W*(.08+.84*((frac-.25)/.5))),y=Math.round(WY-6-clamp(e,-6,60)/60*WY*.95);
    ctx.globalAlpha=clamp((e+6)/8,0,1)*.9;
    ctx.fillStyle=e<8?'#ffd9a0':'#fff7dc';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.globalAlpha*=.25;ctx.fill();
    ctx.globalAlpha=clamp((e+6)/8,0,1);ctx.fillStyle=e<8?'#ffc98a':'#fffaea';
    for(let dy=-4;dy<=4;dy++){const w=Math.round(Math.sqrt(20.5-dy*dy));ctx.fillRect(x-w,y+dy,w*2+1,1)}
    ctx.globalAlpha=1;
  }
  if(sk.dark>.2){ // lune avec phase
    const ph=(((d-Date.UTC(2000,0,6,18,14))/864e5)%29.53+29.53)%29.53/29.53;
    const mf=(frac+.5-ph+1)%1,x=Math.round(W*(.08+.84*mf)),y=Math.round(WY*.12+Math.abs(mf-.5)*WY*.5);
    ctx.globalAlpha=clamp((sk.dark-.2)/.4,0,1);
    const k=Math.cos(ph*2*Math.PI);
    for(let dy=-4;dy<=4;dy++){const w=Math.sqrt(20.5-dy*dy);for(let dx=-Math.round(w);dx<=Math.round(w);dx++){
      const u=dx/(w+.01),litPx=ph<.5?u>k:u<-k;
      ctx.fillStyle=litPx?((dx*7+dy*3)%5===0?'#ddd8c0':'#f6f2dc'):'rgba(40,50,80,.35)';ctx.fillRect(x+dx,y+dy,1,1)}}
    ctx.globalAlpha=1;
  }
}

/* ---------- pêche pendant l'absence ---------- */
function awayCatch(ms){
  const n=Math.min(14,Math.floor(ms/150e3));if(n<1)return;
  const got={};let k=0,coins=0;
  for(let i=0;i<n;i++){const s=pickFish();if(R()<RAR[s.rar].auto){coins+=addCatch(s.id,sizeOf(s,false),false).coins;got[s.id]=(got[s.id]||0)+1;k++}}
  if(!k)return;
  const h=ms>=36e5?Math.round(ms/36e5)+' h':Math.round(ms/6e4)+' min';
  const list=Object.entries(got).sort((a,b)=>b[1]-a[1]).map(([id,c])=>c+' '+SPI[id].n.toLowerCase()).join(', ');
  const best=Object.keys(got).map(id=>SPI[id]).sort((a,b)=>'jcuerl'.indexOf(b.rar)-'jcuerl'.indexOf(a.rar))[0];
  setTimeout(()=>toast(best.spr,`+${k} prise${k>1?'s':''} pendant ton absence`,`${h} : ${list} · +${coins} pièces`,null,6000),700);
}

let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(hiddenAt&&Date.now()-hiddenAt>90e3){awayCatch(Math.min(Date.now()-hiddenAt,12*36e5));if(F.st!=='catch'){setSt('idle');F.wait0=1;hint('')}}
  store.set('seen',Date.now());
});

}
