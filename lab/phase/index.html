<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0c10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phase">
  <meta name="description" content="Synthé FM six opérateurs pour clavier MIDI, dans le téléphone.">
  <title>Phase</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css?v=202611091446">
</head>
<body>
  <div id="app"></div>

  <div id="start" role="button" tabindex="0" aria-label="Démarrer le son">
    <svg class="start-wave" viewBox="0 0 240 60" aria-hidden="true"><path d="M0 30 C20 0 40 0 60 30 S100 60 120 30 S160 0 180 30 S220 60 240 30"/></svg>
    <h1>PHASE</h1>
    <p>Touche pour démarrer le son</p>
    <small id="start-hint"></small>
  </div>

  <div id="rotate" aria-hidden="true">
    <svg viewBox="0 0 48 48"><rect x="14" y="6" width="20" height="36" rx="4"/><path d="M8 30a16 16 0 0 0 16 12M40 18A16 16 0 0 0 24 6"/></svg>
    <p>Tourne le téléphone en paysage</p>
  </div>

  <script>
    if (!navigator.requestMIDIAccess) document.getElementById('start-hint').textContent =
      'Ce navigateur n’a pas le MIDI : sur iPhone, ouvre cette page dans Web MIDI Browser pour jouer avec un clavier. Le clavier à l’écran marche partout.';
  </script>
  <script type="module" src="js/main.js?v=202611091446"></script>
</body>
</html>
