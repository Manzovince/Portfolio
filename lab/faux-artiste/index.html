<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Faux Artiste">
<meta name="theme-color" id="tcLight" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" id="tcDark" content="#16140f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Un faux artiste s'est glissé parmi vous. Dessinez un trait chacun, puis démasquez-le.">
<title>Faux Artiste</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Caveat:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe6; --card:#fffdf8; --ink:#1f1d1a; --muted:#6f675d; --line:rgba(31,29,26,.14);
  --primary:#1f1d1a; --primary-ink:#fffdf8; --accent:#ff5a36; --accent-ink:#fff;
  --ok:#1f8a4c; --ok-ink:#fff; --ok-bg:#dcf1e3; --bad:#c9372c; --bad-bg:#fbe2de;
  --paper:#fffdf8; --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 22px -10px rgba(40,30,10,.3); --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140f; --card:#221f19; --ink:#f3ede2; --muted:#a59d90; --line:rgba(255,255,255,.12);
    --primary:#f3ede2; --primary-ink:#16140f; --ok:#57cf8a; --ok-ink:#0c2416; --ok-bg:#173524; --bad:#ff6d5e; --bad-bg:#3b1d19;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#16140f; --card:#221f19; --ink:#f3ede2; --muted:#a59d90; --line:rgba(255,255,255,.12);
  --primary:#f3ede2; --primary-ink:#16140f; --ok:#57cf8a; --ok-ink:#0c2416; --ok-bg:#173524; --bad:#ff6d5e; --bad-bg:#3b1d19;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;font-size:17px}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
header{max-width:600px;margin:0 auto;padding:12px 16px 6px;display:flex;align-items:center;gap:8px}
.logo{font-family:Caveat,cursive;font-size:clamp(28px, 9vw, 36px);font-weight:700;letter-spacing:.5px;flex:1;min-width:0;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo span{color:var(--accent)}
.iconbtn{flex:none;border:1px solid var(--line);background:transparent;border-radius:var(--r);height:48px;min-width:48px;padding:0 12px;cursor:pointer;font-weight:600;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
main{max-width:600px;margin:0 auto;padding:8px 16px 28px}
h1,h2{margin:.3em 0 .4em;line-height:1.15}
h2{font-size:27px}
p{line-height:1.45}
.muted{color:var(--muted)}
.card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:18px 0;margin:4px 0}
main>.card:first-child{border-top:0}
.card h3,.sub{margin:0 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);min-height:62px;padding:12px 18px;font-size:19px;font-weight:600;cursor:pointer;transition:transform .08s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.35;cursor:default}
.btn+.btn{margin-top:10px}
.row{display:flex;gap:10px}
.row>.btn{margin-top:0}
.row+.row,.btn+.row,.row+.btn{margin-top:10px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:50px;padding:10px 6px;font-weight:600;font-size:17px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 2px 6px -2px rgba(0,0,0,.2)}
.field{margin-top:18px}
.field label{display:block;font-size:16px;font-weight:600;margin-bottom:8px}
.rlabel{display:flex!important;gap:10px;align-items:baseline;justify-content:space-between}
.rlabel b{flex:none;color:var(--accent);font-size:17px}
.rrow{display:flex;align-items:center;gap:10px}
.step{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:24px;font-weight:600;cursor:pointer;padding:0;line-height:1}
input[type=range]{flex:1;min-width:0;width:100%;height:44px;margin:0;accent-color:var(--accent);cursor:pointer}
input[type=range]::-webkit-slider-thumb{width:30px;height:30px}
select,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);min-height:56px;padding:12px 14px;font-size:18px}
select{-webkit-appearance:none;appearance:none;cursor:pointer;padding-right:52px;
  background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%),linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:calc(100% - 26px) 52%,calc(100% - 19px) 52%;background-size:7px 7px;background-repeat:no-repeat}
.players{display:flex;flex-direction:column;gap:10px}
.flabel{display:block;font-size:16px;font-weight:600;margin-bottom:8px}
.games{display:flex;flex-direction:column;gap:10px}
.game{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);min-height:78px;padding:12px 14px;cursor:pointer;transition:transform .08s,opacity .15s}
.game:active{transform:scale(.98)}
.game .ico{font-size:32px;line-height:1;flex:none}
.game .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.game b{font-size:19px}
.game small{font-size:15px;color:var(--muted);line-height:1.3}
.game .pl{align-self:flex-start;margin-top:3px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.game[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.game.off{opacity:.45;cursor:default}
.game .go{flex:none;font-size:30px;color:var(--muted);line-height:1}
.seg.big button{min-height:72px;font-size:26px}
.titles{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.titles .chip{justify-content:center;text-align:center;white-space:normal}
.inkbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 8px;flex:none}
.inkbar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px;transition:width .08s linear}
.inkbar.dry{animation:dry .4s ease-out}
@keyframes dry{0%,100%{transform:none}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
[data-skin="enquete"] .game{background:#fff;border:1.5px solid var(--ink);box-shadow:var(--shadow)}
[data-skin="enquete"] .game[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.prow{display:flex;align-items:center;gap:10px}
.swatch{width:56px;height:56px;border-radius:50%;border:0;flex:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3);position:relative}
.prow input{flex:1;min-width:0}
.prow .score{font-weight:700;min-width:36px;text-align:center;color:var(--muted);font-size:18px}
.sticky{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to bottom, transparent, var(--bg) 30%);z-index:3}
.center{text-align:center}
.big-name{font-size:38px;font-weight:700;margin:.2em 0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.av{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;margin-right:.4em;flex:none;vertical-align:middle;line-height:1}
.av i{font-style:normal;font-size:.68em}
.role{border-radius:14px;padding:30px 18px;text-align:center;margin:18px 0;background:var(--card);border:1px solid var(--line)}
.role .k{font-size:15px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;font-weight:600}
.role .v{font-family:Caveat,cursive;font-size:60px;line-height:1.05;font-weight:700;margin:.15em 0 .3em;overflow-wrap:anywhere}
.pass{min-height:62dvh;display:flex;flex-direction:column;justify-content:center}
.pass .btn{margin-top:18px}
.drawbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.drawbar .who{font-size:22px;font-weight:700;display:flex;align-items:center;min-width:0;animation:pop .35s ease-out}
.drawbar .who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawbar .meta{font-size:14px;color:var(--muted);text-align:right;min-width:0;max-width:50%}
.drawbar .meta b{color:var(--ink);font-size:16px}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.06)}100%{transform:none}}
.catpill{display:inline-block;background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 14px;font-size:16px;font-weight:600}
.paper{position:relative;width:min(100%, calc((100dvh - 300px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 3 / 5));min-width:220px;aspect-ratio:3/5;margin:0 auto 12px;background:var(--paper);border-radius:3px;box-shadow:0 0 0 1px var(--line),var(--shadow);overflow:hidden}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.stage{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;margin:0 0 10px}
.stage .paper{width:min(100cqw, 100cqh * 3 / 5);min-width:0;margin:0}
body.drawing{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.drawing header{width:100%}
body.drawing main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;padding-bottom:10px}
.paperhint{position:absolute;left:10px;right:10px;top:10px;z-index:2;text-align:center;font-size:14px;color:#6f675d;pointer-events:none}
.paper.view{width:min(86%, 360px);min-width:0}
.paper.view.small{width:min(62%, 240px);margin-top:8px}
.chain .chs,.chain .chw{text-align:center;padding:12px 0;border-bottom:1px solid var(--line)}
.chain .chs:last-child{border-bottom:0}
.chain .chn{display:flex;align-items:center;justify-content:center;gap:2px;font-size:16px}
.chain .chn .muted{margin-left:6px}
.chain small{display:block;color:var(--muted);font-size:14px}
.zoomctl{position:absolute;right:8px;bottom:8px;display:flex;gap:8px;z-index:2}
.zoomctl button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(31,29,26,.15);background:rgba(255,253,248,.92);color:#1f1d1a;font-size:24px;font-weight:600;line-height:1;cursor:pointer;padding:0;box-shadow:0 4px 12px -6px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.zoomctl button:disabled{opacity:.35}
.zoomctl button[hidden]{display:none}
.zoomlvl{position:absolute;left:8px;top:8px;z-index:2;background:rgba(31,29,26,.75);color:#fff;font-size:13px;font-weight:600;border-radius:6px;padding:3px 8px;pointer-events:none;transition:opacity .3s}
.hint{text-align:center;font-size:15px;color:var(--muted);margin:12px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:var(--r);min-height:64px;padding:12px;font-weight:600;font-size:18px;cursor:pointer;text-align:left;min-width:0}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);box-shadow:inset 0 0 0 1px var(--ink)}
.verdict{border-radius:14px;padding:22px 16px;text-align:center;margin:8px 0 12px}
.verdict.fake{background:var(--accent);color:var(--accent-ink)}
.verdict.art{background:var(--ok);color:var(--ok-ink)}
.verdict h2{font-size:30px;margin:.1em 0 .2em}
.verdict p{margin:0;opacity:.95;font-size:18px}
.word{font-family:Caveat,cursive;font-size:44px;font-weight:700;line-height:1.05}
.scores{list-style:none;padding:0;margin:0}
.scores li{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:18px}
.scores li:last-child{border-bottom:0}
.scores .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scores .gain{font-weight:700;color:var(--ok);min-width:30px;text-align:right}
.scores .pts{font-weight:700;min-width:30px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:16px;margin-bottom:14px}
.legend span{display:inline-flex;align-items:center}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.compare div{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.compare small{display:block;color:var(--muted);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.compare b{font-family:Caveat,cursive;font-size:32px;overflow-wrap:anywhere}
.match{font-size:16px;text-align:center;font-weight:600}
.trophy{background:#ffd447;color:#1f1d1a;border-radius:var(--r);padding:16px;text-align:center;font-weight:700;font-size:20px;margin:12px 0}
.note{text-align:center;font-size:14px;color:var(--muted);margin:-4px 0 12px}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;width:min(520px, calc(100vw - 24px));max-width:none;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .in{padding:22px 20px 18px;max-height:84dvh;overflow:auto}
dialog ol{padding-left:22px;line-height:1.5;font-size:17px}
dialog li{margin-bottom:8px}
dialog h2{margin:0 0 14px}
.menu{display:flex;flex-direction:column;gap:10px}
.menu .btn+.btn{margin-top:0}
.menu .btn{justify-content:flex-start}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:16px;padding:12px;min-height:48px;display:block;margin:10px auto 0}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.pal button{aspect-ratio:1;border-radius:50%;border:0;box-shadow:inset 0 0 0 2px rgba(128,128,128,.35);font-size:24px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.pal button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}
.emo{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:18px}
.emo button{aspect-ratio:1;font-size:28px;border-radius:10px;border:0;background:var(--bg);cursor:pointer;padding:0}
.emo button.taken{opacity:.3}
.emo button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink);opacity:1}
.galhead{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.galhead h2{flex:1;margin:0}
.galhead .t{flex:1;min-width:0}
.galhead .t small{color:var(--muted);font-size:15px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 12px}
.thumb{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0}
.thumb canvas{width:100%;aspect-ratio:3/5;display:block;border-radius:3px;box-shadow:0 0 0 1px var(--line),var(--shadow);background:var(--paper)}
.thumb b{font-family:Caveat,cursive;font-size:28px;display:block;line-height:1.05;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb small{color:var(--muted);font-size:14px}
.empty{text-align:center;padding:48px 12px;color:var(--muted);font-size:17px}
.empty div{font-size:56px;margin-bottom:8px}

/* ---------- skins (fixed palettes, ignore system dark mode) ---------- */
:root[data-skin="atelier"]{
  --bg:#5c4330; --card:#3d2b1d; --ink:#fbf3e4; --muted:#d9c3a3; --line:rgba(251,243,228,.2);
  --primary:#d9472b; --primary-ink:#fff; --accent:#e8a33a; --accent-ink:#2b1d10;
  --ok:#6fbf73; --ok-ink:#10260f; --paper:#fbf6ea;
  --shadow:0 14px 26px -12px rgba(0,0,0,.6);
}
[data-skin="atelier"] body{background-color:#5c4330;background-image:repeating-linear-gradient(91deg,rgba(0,0,0,.06) 0 2px,transparent 2px 11px),repeating-linear-gradient(89deg,rgba(255,255,255,.035) 0 1px,transparent 1px 27px)}
[data-skin="atelier"] .btn{border-radius:24px 8px 24px 8px;border-color:transparent;background:var(--card)}
[data-skin="atelier"] .btn.primary,[data-skin="atelier"] .btn.accent{border-radius:8px 24px 8px 24px}
[data-skin="atelier"] .btn.primary{background:var(--primary)}
[data-skin="atelier"] .btn.accent{background:var(--accent)}
[data-skin="atelier"] .av{border-radius:52% 44% 56% 42% / 46% 56% 44% 54%}
[data-skin="atelier"] .swatch{border-radius:52% 44% 56% 42% / 46% 56% 44% 54%}
[data-skin="atelier"] .paper{box-shadow:0 0 0 7px #3d2b1d,0 0 0 8px rgba(0,0,0,.35),var(--shadow);border-radius:1px}
[data-skin="atelier"] .seg,[data-skin="atelier"] select,[data-skin="atelier"] input[type=text]{background-color:rgba(0,0,0,.18)}
[data-skin="atelier"] .seg button[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:none}
[data-skin="atelier"] .logo{color:#fbf3e4}
[data-skin="atelier"] .logo span{color:var(--accent)}
[data-skin="atelier"] .verdict{border-radius:30px 10px 30px 10px}
[data-skin="atelier"] .verdict.fake{background:var(--primary);color:#fff}

:root[data-skin="enquete"]{
  --bg:#d9c39a; --card:#efe2c4; --ink:#2a2418; --muted:#6b5c40; --line:rgba(42,36,24,.28);
  --primary:#2a2418; --primary-ink:#efe2c4; --accent:#b8261d; --accent-ink:#fff;
  --ok:#1f5f8a; --ok-ink:#fff; --paper:#fbfaf6; --r:3px;
  --shadow:0 12px 22px -12px rgba(40,25,5,.55);
}
[data-skin="enquete"] body{background-color:#d9c39a}
[data-skin="enquete"] body,[data-skin="enquete"] button,[data-skin="enquete"] input,[data-skin="enquete"] select{font-family:'Special Elite',ui-monospace,monospace;letter-spacing:.01em}
[data-skin="enquete"] .btn,[data-skin="enquete"] .chip{border:1.5px solid var(--ink);font-weight:400}
[data-skin="enquete"] .btn{background:transparent}
[data-skin="enquete"] .btn.primary{background:var(--ink);color:var(--card)}
[data-skin="enquete"] .btn.accent{background:var(--accent);border-color:var(--accent)}
[data-skin="enquete"] .av,[data-skin="enquete"] .swatch{border-radius:3px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
[data-skin="enquete"] .paper{border-radius:0;box-shadow:0 0 0 9px #fff,0 18px 0 9px #fff,0 18px 0 10px rgba(42,36,24,.2),var(--shadow)}
[data-skin="enquete"] .stage{padding:4px 10px 22px}
[data-skin="enquete"] .paper.view,[data-skin="enquete"] .thumb canvas{transform:rotate(-1.5deg)}
[data-skin="enquete"] .paper.view{margin:14px auto 30px}
[data-skin="enquete"] .thumb canvas{box-shadow:0 0 0 6px #fff,0 10px 18px -10px rgba(0,0,0,.5)}
[data-skin="enquete"] .gal{gap:26px 18px}
[data-skin="enquete"] .seg{background:transparent;border:1.5px solid var(--ink)}
[data-skin="enquete"] .seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);box-shadow:none}
[data-skin="enquete"] select,[data-skin="enquete"] input[type=text]{background-color:var(--card);border:0;border-bottom:1.5px solid var(--ink);border-radius:0}

[data-skin="enquete"] .verdict p{text-transform:none;letter-spacing:0}

        ${roleCounts()[0] + roleCounts()[1] >= roleCounts()[2] ? `<p class="muted" style="font-size:14px;margin:4px 2px 0">${t('rolesMax')(roleCounts()[2])}</p>` : ''}</div>

        <div class="seg" id="voteSeg">${['table', 'turns'].map(k => `<button data-v="${k}" aria-pressed="${(S.voteMode || 'table') === k}">${t(k === 'table' ? 'voteTable' : 'voteTurns')}</button>`).join('')}</div>
        <p class="muted" style="font-size:15px;margin:8px 2px 0">${S.voteMode === 'turns' ? t('voteTurnsHint') : t('voteTableHint')}</p></div>
      <div class="field"><label for="ffRange" class="rlabel"><span>${t('firstFake')}</span><b id="ffVal"></b></label>
        <div class="rrow"><button class="step" id="ffMinus" aria-label="−1">−</button><input type="range" id="ffRange" min="0" max="100" step="1"><button class="step" id="ffPlus" aria-label="+1">+</button></div>
        ${S.firstFake != null ? `<button class="link" id="ffReset" style="margin:4px 0 0 auto">${t('firstReset')}</button>` : ''}</div>
      <div class="field"><label>${t('target')}</label>
        <div class="seg" id="targetSeg">${[3, 5, 7, 10].map(n => `<button data-v="${n}" aria-pressed="${S.target === n}">${n}</button>`).join('')}</div></div>
      ${inkF}
      ${S.players.some(p => p.score) ? `<button class="link" id="resetBtn">${t('resetScores')}</button>` : ''}
    </div>`}` : ''}
    ${step === 'games' ? '' : `<div class="sticky">

  const seg = (id, fn) => $(id)?.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { fn(b.dataset.v); save(); render(); }));
  seg('countSeg', v => {
    setCount(+v);

    if (+v === 2) { if (!duo.includes(S.variant)) S.variant = 'same'; }

  seg('strokeSeg', v => S.chainStrokes = +v);
  app.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {

function setCount(n) {
  n = Math.min(MAX_PLAYERS, Math.max(MIN_PLAYERS, n));
  S.players = S.players.slice(0, n);
  while (S.players.length < n) {
    const taken = S.players.map(x => x.color);
    S.players.push({ id: uid(), name: '', color: COLORS.find(c => !taken.includes(c)), emoji: freeEmoji(), score: 0 });
  }
}

function pickWord(catFilter) {
  const pool = [];
  CATEGORIES.forEach(c => { if (catFilter === 'random' || c.id === catFilter) c.words.forEach((_, i) => pool.push(c.id + ':' + i)); });
  let fresh = pool.filter(k => !S.used.includes(k));
  if (!fresh.length) { S.used = S.used.filter(k => !pool.includes(k)); fresh = pool; }
  const k = pick(fresh);
  S.used.push(k);
  const [catId, i] = k.split(':');
  return { catId, wordIdx: +i };
}

function startGame() {
  if (S.variant === 'chain') return startChain();
  if (S.variant === 'same') return startSame();
  if (S.variant === 'sab') return startSab();
  if (S.variant === 'bluff') return startBluff();
  const ids = S.players.map(p => p.id);
  const gm = S.mode === 'gm' ? ids[S.gmPtr++ % ids.length] : null;
  const drawers = ids.filter(id => id !== gm);
  const [nf, nk] = roleCounts(), roles = {};
  const shuffled = [...drawers].sort(() => Math.random() - .5);
  shuffled.slice(0, nf).forEach(id => roles[id] = 'fake');
  shuffled.slice(nf, nf + nk).forEach(id => roles[id] = 'forger');
  // S.firstFake (0–100, or null = plain random) is the chance an impostor (a fake artist if any) opens the drawing.
  const lead = drawers.map((_, i) => i).filter(i => roles[drawers[i]] === (nf ? 'fake' : 'forger'));
  let start = Math.floor(Math.random() * drawers.length);
  if (S.firstFake != null) {
    if (Math.random() * 100 < S.firstFake) start = pick(lead);
    else { const others = drawers.map((_, i) => i).filter(i => !lead.includes(i)); start = pick(others); }
  }
  let w = gm ? { custom: null } : pickWord(S.cat);
  if (!gm && nk) {
    const pr = pickPair(S.cat);
    if (pr) w = pr;
    else { const c = catById(w.catId); w.forgerIdx = pick(c.words.map((_, i) => i).filter(i => i !== w.wordIdx)); }
  }
  const loop = drawers.slice(start).concat(drawers.slice(0, start));
  const order = [];
  for (let r = 0; r < S.rounds; r++) order.push(...loop);
  view = null;
  S.game = { ink: inkOf('fake'),
    phase: gm ? 'gm' : 'pass', gm, drawers, roles, order, turn: 0, strokes: [], pending: false,
    revealI: 0, secret: S.voteMode === 'turns', votes: {}, voteI: 0, accused: null, guessed: null, outcome: null, scored: false,
    ...w,
  };
  save(); render(); scrollTo(0, 0);
}

// ---------- drawing surface ----------
const PAPER = '#fffdf8', MAXZ = 6;
// Paints strokes in "world" units (w × h); the caller sets the view transform.
function paint(ctx, w, h, strokes, colorOf, limit = Infinity, under) {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, w, h);
  under?.(ctx, w, h);
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2.5, w * 0.011);
  let budget = limit;
  for (const s of strokes) {
    if (budget <= 0) break;
    const pts = s.pts.slice(0, Math.max(1, Math.min(s.pts.length, budget)));
    budget -= s.pts.length;
    ctx.strokeStyle = ctx.fillStyle = colorOf(s) || '#222';
    if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0][0] * w, pts[0][1] * h, ctx.lineWidth / 2, 0, 7); ctx.fill(); continue; }
    ctx.beginPath(); ctx.moveTo(pts[0][0] * w, pts[0][1] * h);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0] * w, pts[i][1] * h, mx * w, my * h);
    }
    const l = pts[pts.length - 1]; ctx.lineTo(l[0] * w, l[1] * h); ctx.stroke();
  }
}
function paintStatic(cv, strokes, colorOf) { paint(cv.getContext('2d'), cv.width, cv.height, strokes, colorOf); }

/* Sizes a canvas to its box and adds zoom: pinch / two-finger pan, wheel or ctrl+wheel, double-tap
   (view-only), and +/− buttons. With o.draw, one finger draws a stroke; a second finger landing right
   after the stroke starts turns it into a pinch instead. Returns { draw(limit), reset() }. */
function mountCanvas(cv, o) {
  const ctx = cv.getContext('2d'), wrap = cv.parentElement;
  let w = 0, h = 0, dpr = 1;
  const v = { s: 1, x: 0, y: 0 };
  const clampS = s => Math.min(MAXZ, Math.max(1, s));
  const clampV = () => { v.s = clampS(v.s); v.x = Math.min(0, Math.max(w - w * v.s, v.x)); v.y = Math.min(0, Math.max(h - h * v.s, v.y)); };

  const ctl = document.createElement('div'); ctl.className = 'zoomctl';
  ctl.innerHTML = `<button data-z="reset" title="${t('zoomReset')}" aria-label="${t('zoomReset')}">⤢</button><button data-z="out" title="${t('zoomOut')}" aria-label="${t('zoomOut')}">−</button><button data-z="in" title="${t('zoomIn')}" aria-label="${t('zoomIn')}">+</button>`;
  const lvl = document.createElement('div'); lvl.className = 'zoomlvl'; lvl.style.opacity = 0;
  wrap.append(ctl, lvl);
  const [bReset, bOut, bIn] = ctl.querySelectorAll('button');
  let lvlTimer = 0;
  const ui = () => {
    const zoomed = v.s > 1.01;
    bReset.hidden = !zoomed; bOut.disabled = !zoomed; bIn.disabled = v.s >= MAXZ - .01;
    cv.style.touchAction = o.draw || zoomed ? 'none' : 'pan-y';
  };
  const showLvl = () => { lvl.textContent = `×${v.s.toFixed(1)}`; lvl.style.opacity = 1; clearTimeout(lvlTimer); lvlTimer = setTimeout(() => lvl.style.opacity = 0, 900); };

  const draw = (limit = Infinity) => {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = PAPER; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr * v.s, 0, 0, dpr * v.s, dpr * v.x, dpr * v.y);
    paint(ctx, w, h, o.strokes(), o.colorOf, limit, o.under);
    ui();
  };
  const fit = () => {
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    const k = w ? r.width / w : 1;
    dpr = Math.min(3, devicePixelRatio || 1); w = r.width; h = r.height;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    v.x *= k; v.y *= k; clampV(); draw();
  };
  const zoomAt = (px, py, s) => {
    const ns = clampS(s), wx = (px - v.x) / v.s, wy = (py - v.y) / v.s;
    v.s = ns; v.x = px - wx * ns; v.y = py - wy * ns; clampV(); draw(); showLvl();
  };
  const reset = () => { v.s = 1; v.x = v.y = 0; draw(); };
  ctl.onclick = e => {
    const z = e.target.closest('button')?.dataset.z;
    if (z === 'in') zoomAt(w / 2, h / 2, v.s * 1.6);
    else if (z === 'out') zoomAt(w / 2, h / 2, v.s / 1.6);
    else if (z === 'reset') reset();
  };

  const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const c01 = n => Math.min(1, Math.max(0, n));
  const toPaper = ([px, py]) => [c01((px - v.x) / v.s / w), c01((py - v.y) / v.s / h)];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];

  const pts = new Map(), ignored = new Set();
  let mode = null, stroke = null, strokeId = null, strokeT = 0, pinch0 = null, panLast = null;
  let tap = null, lastTap = { t: 0, p: [0, 0] };
  const startPinch = () => {
    const [a, b] = [...pts.values()];
    mode = 'pinch'; pinch0 = { d: Math.max(10, dist(a, b)), m: mid(a, b), s: v.s, x: v.x, y: v.y };
  };
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (pts.size >= 2) { ignored.add(e.pointerId); return; }
    const p = local(e);
    pts.set(e.pointerId, p);
    try { cv.setPointerCapture(e.pointerId); } catch {}
    if (pts.size === 1) {
      tap = { t: performance.now(), p };
      if (o.draw && o.draw.can(toPaper(p))) {
        e.preventDefault(); mode = 'draw'; strokeId = e.pointerId; strokeT = performance.now();
        stroke = o.draw.start(toPaper(p)); stroke.len = 0; o.draw.onInk?.(1); draw();
      } else if (v.s > 1.01) { e.preventDefault(); mode = 'pan'; panLast = p; }
      else mode = null;
    } else {
      tap = null;
      if (mode === 'draw') {
        // A second finger right after touching down means "zoom", not "draw": drop the stroke.
        if (stroke.pts.length < 15 && performance.now() - strokeT < 350) { o.draw.cancel(); stroke = null; strokeId = null; draw(); }
        else { pts.delete(e.pointerId); ignored.add(e.pointerId); return; }
      }
      e.preventDefault(); startPinch();
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    if (mode === 'draw' && e.pointerId === strokeId) {
      const co = e.getCoalescedEvents?.();
      for (const ev of (co && co.length ? co : [e])) {
        const p = toPaper(local(ev)), l = stroke.pts[stroke.pts.length - 1];
        if (stroke.dry || Math.hypot(p[0] - l[0], p[1] - l[1]) <= 0.003 / v.s) continue;
        // Walls: a game can forbid parts of the sheet; the line stops at the edge (unused for now).
        if (o.draw.allow && !o.draw.allow(l, p)) { stroke.dry = true; o.draw.onBlock?.(); buzz(25); break; }
        // Ink: length in paper widths (y scaled by the paper's aspect); the line stops when it's spent.
        const max = o.draw.ink?.() || 0;
        if (max) {
          const d = Math.hypot(p[0] - l[0], (p[1] - l[1]) * h / w);
          if (stroke.len + d >= max) {
            const k = (max - stroke.len) / d;
            stroke.pts.push([l[0] + (p[0] - l[0]) * k, l[1] + (p[1] - l[1]) * k]);
            stroke.len = max; stroke.dry = true; o.draw.onInk?.(0); buzz(20); break;
          }
          stroke.len += d; o.draw.onInk?.(1 - stroke.len / max);
        }
        stroke.pts.push(p);
      }
      draw(); return;
    }
    const p = local(e);
    pts.set(e.pointerId, p);
    if (tap && dist(tap.p, p) > 10) tap = null;
    if (mode === 'pinch' && pts.size >= 2) {
      const [a, b] = [...pts.values()], m = mid(a, b);
      const ns = clampS(pinch0.s * dist(a, b) / pinch0.d);
      const wx = (pinch0.m[0] - pinch0.x) / pinch0.s, wy = (pinch0.m[1] - pinch0.y) / pinch0.s;
      v.s = ns; v.x = m[0] - wx * ns; v.y = m[1] - wy * ns; clampV(); draw(); showLvl();
    } else if (mode === 'pan') {
      v.x += p[0] - panLast[0]; v.y += p[1] - panLast[1]; panLast = p; clampV(); draw();
    }
  });
  const up = e => {
    if (ignored.delete(e.pointerId)) return;
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (mode === 'draw' && e.pointerId === strokeId) {
      mode = null; strokeId = null; const s = stroke; stroke = null; o.draw.end(s); draw(); return;
    }
    if (mode === 'pinch') {
      if (pts.size === 1) { mode = 'pan'; panLast = [...pts.values()][0]; } else if (!pts.size) mode = null;
      return;
    }
    if (!pts.size) mode = null;
    // Double-tap toggles zoom on view-only canvases.
    if (!o.draw && tap && e.type === 'pointerup' && performance.now() - tap.t < 300) {
      const now = performance.now();
      if (now - lastTap.t < 320 && dist(lastTap.p, tap.p) < 30) { v.s > 1.01 ? reset() : zoomAt(tap.p[0], tap.p[1], 2.5); lastTap.t = 0; }
      else lastTap = { t: now, p: tap.p };
    }
    tap = null;
  };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cv.addEventListener(ev, up));
  cv.addEventListener('wheel', e => {
    const [px, py] = local(e);
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomAt(px, py, v.s * Math.exp(-e.deltaY * 0.01)); }
    else if (v.s > 1.01) { e.preventDefault(); v.x -= e.deltaX; v.y -= e.deltaY; clampV(); draw(); }
  }, { passive: false });
  // Safari trackpad pinch (only when no touch pointers are down, so iOS touch pinch isn't counted twice).
  let gs0 = 1;
  cv.addEventListener('gesturestart', e => { e.preventDefault(); gs0 = v.s; });
  cv.addEventListener('gesturechange', e => { e.preventDefault(); if (pts.size) return; const [px, py] = local(e); zoomAt(px, py, gs0 * e.scale); });

  new ResizeObserver(fit).observe(cv);
  fit();
  return { draw, reset };
}

// Replay animation + PNG export, shared by the result screen and the gallery.
function replayer(api, strokes) {
  let anim = 0;
  return () => {
    cancelAnimationFrame(anim);
    const total = strokes.reduce((n, s) => n + s.pts.length, 0), t0 = performance.now(), dur = Math.min(9000, 700 * strokes.length);
    const step = now => { const k = Math.min(1, (now - t0) / dur); api.draw(Math.ceil(k * total)); if (k < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  };
}
function downloadPng(strokes, colorOf, word) {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 2000;
  paintStatic(c, strokes, colorOf);
  c.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = `faux-artiste-${norm(word) || 'dessin'}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
}

// ---------- Telephone: word → drawing → word → … around the table, ending on a word ----------
// Every player plays once. With an even count the phone deals the starting word and the first
// player draws it; with an odd count the first player writes it, so the chain always ends on a word.
// With "written by a player" and an even count, the first player writes then draws it too.
// With "random" and an odd count, the first player gets a random word pre-filled, which they may keep or change.
function startChain() {
  const ids = S.players.map(p => p.id), st = Math.floor(Math.random() * ids.length);
  let order = ids.slice(st).concat(ids.slice(0, st));
  const pw = pickWord(S.cat), dealt = catById(pw.catId).words[pw.wordIdx][L()];
  const own = S.chainFrom === 'own', even = order.length % 2 === 0;
  let start = null, prefill = '';
  if (!own && even) start = dealt;
  else if (!own) prefill = dealt;
  else if (even) order = [order[0], ...order];
  const kinds = order.map((_, i) => start == null && i === 0 ? 'start' : (i + (start == null ? 1 : 0)) % 2 === 0 ? 'draw' : 'word');
  view = null;
  S.game = { kind: 'chain', ink: inkOf('chain'), phase: 'chainPass', order, kinds, max: S.chainStrokes || 0, i: 0, steps: [], cur: [], start, prefill };
  save(); render(); scrollTo(0, 0);
}
// Kind of step i: 'start' (write the starting word), 'draw' or 'word'.
const chainKind = (g, i = g.i) => g.kinds[i];
const chainPrev = g => g.i === 0 ? null : g.steps[g.i - 1];
const chainWord = g => { const p = chainPrev(g); return p ? p.text : g.start; };

function renderChainPass() {
  const g = S.game, id = g.order[g.i];
  app.innerHTML = `<div class="pass center">

  $('ok').onclick = () => go('chainStep');
}

function chainNext(step) {
  const g = S.game;
  g.steps.push(step); g.cur = []; g.i++; buzz(15);
  go(g.i >= g.order.length ? 'chainEnd' : g.order[g.i] === step.id ? 'chainStep' : 'chainPass');
}

function renderChainStep() {

    ok.onclick = () => { if (g.cur.length) chainNext({ id, kind, strokes: g.cur }); };

// ---------- "Same word?": a 2-player duel. Half the time one player secretly gets a close word
// (same category). Reuses the role reveal and the stroke-by-stroke drawing, then secret bets.
function startSame() {
  // Always deal from a pair, even when both get the same word, so the word itself gives nothing away.
  const ids = S.players.slice(0, 2).map(p => p.id), roles = {};
  let w = pickPair(S.cat);
  const diff = Math.random() < .5;
  if (!w) {
    w = pickWord(S.cat);
    if (diff) { const c = catById(w.catId); w.forgerIdx = pick(c.words.map((_, i) => i).filter(i => i !== w.wordIdx)); }
  }
  if (diff) roles[pick(ids)] = 'forger';
  const n = S.sameStrokes || 3, first = Math.floor(Math.random() * 2), loop = [ids[first], ids[1 - first]], order = [];
  for (let r = 0; r < n; r++) order.push(...loop);
  view = null;
  S.game = { kind: 'same', ink: inkOf('same'), phase: 'pass', gm: null, drawers: ids, roles, order, rounds: n, turn: 0, strokes: [], pending: false,
    revealI: 0, bets: {}, betI: 0, outcome: null, scored: false, ...w };
  save(); render(); scrollTo(0, 0);
}
const sameWord = (g, id) => roleOf(g, id) === 'forger' ? forgerWord(g) : wordText(g);

function renderSameEnd() {
  const g = S.game, diff = Object.keys(g.roles).length > 0;
  if (!g.scored) {
    const gains = {};
    g.drawers.forEach((id, i) => {
      const bt = g.bets[id], other = g.drawers[1 - i];
      bt.ok = (bt.b === 'diff') === diff;
      bt.hit = diff && !!bt.guess && looksRight(bt.guess, sameWord(g, other));
      const n = (bt.ok ? 1 : 0) + (bt.hit ? 2 : 0);
      if (n) gains[id] = n;
    });
    g.gains = gains;
    for (const id in gains) P(id).score += gains[id];
    g.outcome = { fakeWins: false };
    g.archived = archive(g);
    g.scored = true; save();
  }
  const ranked = [...S.players].sort((a, b) => b.score - a.score);
  const champ = ranked[0].score >= S.target && (ranked.length < 2 || ranked[1].score < ranked[0].score) ? ranked[0] : null;
  app.innerHTML = `
    <div class="verdict ${diff ? 'fake' : 'art'}"><h2>${diff ? t('endDiff') : t('endSame')}</h2></div>

  const w = pickPair(S.cat) || pickPair('random');
  const n = S.sabStrokes || 2, st = Math.floor(Math.random() * drawers.length), loop = drawers.slice(st).concat(drawers.slice(0, st)), order = [];
  for (let r = 0; r < n; r++) order.push(...loop);

    revealI: 0, guess: '', hit: null, accused: null, outcome: null, scored: false, ...w };

// ---------- fake artist's last guess ----------
const norm = s => s.toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9]+/g, ' ').replace(/\b(le|la|les|l|un|une|des|du|de|d|the|a|an)\b/g, ' ').replace(/\s+/g, '').trim();
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const tmp = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = tmp; }
  }
  return d[b.length];
}
const looksRight = (guess, word) => { const a = norm(guess), b = norm(word); return !!a && (a === b || (b.length >= 4 && lev(a, b) <= Math.floor(b.length / 5) + 1)); };

    <div id="out"></div>
    <button class="btn primary" id="ok" style="margin-top:12px">${t('revealWord')}</button>`;
  const gi = $('gi'), okB = $('ok');
  gi.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); okB.click(); } };
  okB.onclick = function () {
    const guess = gi.value.trim(), word = wordText(g), m = guess && looksRight(guess, word);
    gi.disabled = true; this.remove();
    $('out').innerHTML = `
      <div class="compare"><div><small>${t('yourGuess')}</small><b>${guess ? esc(guess) : '🗣️'}</b></div><div><small>${t('theWord')}</small><b>${esc(word)}</b></div></div>
      ${guess ? `<p class="match" style="color:${m ? 'var(--ok)' : 'var(--muted)'}">${m ? t('autoMatch') : t('noMatch')}</p>` : ''}
      <div class="row"><button class="btn ${m ? 'accent' : ''}" id="yes">✓ ${t('gotIt')}</button><button class="btn ${m ? '' : 'primary'}" id="no">✗ ${t('missed')}</button></div>`;
    const done = hit => { g.outcome = { fakeWins: hit, reason: hit ? 'guessed' : 'caught' }; go('result'); };
    $('yes').onclick = () => done(true);
    $('no').onclick = () => done(false);
  };
}

// ---------- gallery (last 30 drawings, newest first, own storage key) ----------
const GKEY = 'faux-artiste-gallery', GMAX = 30;
function loadGal() { try { const l = JSON.parse(localStorage.getItem(GKEY)); return Array.isArray(l) ? l : []; } catch { return []; } }
function saveGal(list) {
  list = list.slice(0, GMAX);
  for (;;) {
    try { localStorage.setItem(GKEY, JSON.stringify(list)); return true; }
    catch { if (list.length <= 1) return false; list.pop(); } // storage full: drop the oldest
  }
}
function archive(g) {
  if (!g.strokes.length) return false;
  const r3 = n => Math.round(n * 1000) / 1000;
  const entry = {
    id: uid(), at: Date.now(), fakeWins: g.outcome.fakeWins,
    catId: g.custom || g.pw ? null : g.catId, wordIdx: g.custom || g.pw ? null : g.wordIdx,
    word: wordText(g), cat: catText(g),
    players: g.drawers.map(id => { const p = P(id); return { name: pname(p), color: p.color, emoji: p.emoji, fake: roleOf(g, id) === 'fake', forger: roleOf(g, id) === 'forger', sab: roleOf(g, id) === 'saboteur' }; }),
    strokes: g.strokes.map(s => ({ i: g.drawers.indexOf(s.id), pts: s.pts.map(([x, y]) => [r3(x), r3(y)]) })),
  };
  const list = loadGal(); list.unshift(entry);
  return saveGal(list);
}
const gWord = e => (e.catId && catById(e.catId)?.words[e.wordIdx]?.[L()]) || e.word;
const gCat = e => (e.catId && catById(e.catId)?.[S.lang]) || e.cat;
const gColor = e => s => e.players[s.i]?.color;
const gDate = at => new Date(at).toLocaleString(S.lang, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
function openGallery(shot) { view = shot == null ? {} : { shot }; render(); scrollTo(0, 0); }
function closeGallery() { view = null; render(); scrollTo(0, 0); }

function renderGallery() {
  const list = loadGal();
  app.innerHTML = `
    <div class="galhead"><button class="iconbtn" id="back" aria-label="${t('back')}">←</button><h2>${t('gallery')}</h2><span class="muted">${list.length}/${GMAX}</span></div>
    ${list.length ? `<div class="gal">${list.map((e, i) => `<button class="thumb" data-i="${i}">
        <canvas width="300" height="500"></canvas><b>${esc(gWord(e))}</b><small>${e.fakeWins ? '🎭' : '🎨'} ${gDate(e.at)}</small></button>`).join('')}</div>`
      : `<div class="empty"><div>🖼️</div>${t('galEmpty')}</div>`}`;
  $('back').onclick = closeGallery;
  app.querySelectorAll('.thumb').forEach(b => {
    const e = list[+b.dataset.i];
    paintStatic(b.querySelector('canvas'), e.strokes, gColor(e));
    b.onclick = () => openGallery(+b.dataset.i);
  });
}

function renderShot() {
  const list = loadGal(), i = view.shot, e = list[i];
  if (!e) return openGallery();
  app.innerHTML = `
    <div class="galhead"><button class="iconbtn" id="back" aria-label="${t('back')}">←</button>
      <div class="t"><div class="word">${esc(gWord(e))}</div><small>${esc(gCat(e))} · ${gDate(e.at)} · ${e.fakeWins ? t('fakeWins') : t('artistsWin')}</small></div></div>
    <div class="paper"><canvas id="cv"></canvas></div>
    <div class="legend">${e.players.map(p => `<span>${av(p.color, p.emoji)}${esc(p.name)}${p.fake ? ' 🎭' : p.forger ? ' 🥸' : p.sab ? ' 🤫' : ''}</span>`).join('')}</div>
    <div class="row"><button class="btn" id="replay">▶ ${t('replay')}</button><button class="btn" id="dl">⬇ ${t('save')}</button></div>
    <div class="row"><button class="btn" id="prev" ${i <= 0 ? 'disabled' : ''}>‹ ${t('prev')}</button><button class="btn" id="nxt" ${i >= list.length - 1 ? 'disabled' : ''}>${t('next2')} ›</button></div>
    <button class="link" id="del">🗑 ${t('del')}</button>`;
  const api = mountCanvas($('cv'), { strokes: () => e.strokes, colorOf: gColor(e) });
  $('back').onclick = () => openGallery();
  $('replay').onclick = replayer(api, e.strokes);
  $('dl').onclick = () => downloadPng(e.strokes, gColor(e), gWord(e));
  $('prev').onclick = () => openGallery(i - 1);
  $('nxt').onclick = () => openGallery(i + 1);
  $('del').onclick = () => ask(t('delConfirm'), t('delHint'), t('delOk'), () => {
    const l = loadGal().filter(x => x.id !== e.id); saveGal(l);
    l.length ? openGallery(Math.min(i, l.length - 1)) : openGallery();
  });
}

// ---------- result ----------
function applyScore(g) {
  const gains = {};
  if (g.outcome.fakeWins) { impostors(g).forEach(id => gains[id] = 2); if (g.gm) gains[g.gm] = 2; }
  else g.drawers.forEach(id => { if (roleOf(g, id) === 'artist') gains[id] = 1; });
  g.gains = gains;
  for (const id in gains) P(id).score += gains[id];
  g.archived = archive(g);
  g.scored = true;
}

function renderResult() {
  const g = S.game;
  if (!g.scored) { applyScore(g); save(); }
  const o = g.outcome, imp = impostors(g), f = imp.map(nameOf).join(S.lang === 'fr' ? ' et ' : ' and ');
  const a = g.accused !== 'tie' && P(g.accused) ? nameOf(g.accused) : '?';
  const others = imp.filter(id => id !== g.accused), more = others.length ? ' ' + t('them')(others.map(nameOf).join(S.lang === 'fr' ? ' et ' : ' and '), others.length) : '';
  const winT = imp.length > 1 ? 'impWins' : roleOf(g, imp[0]) === 'forger' ? 'forgerWins' : 'fakeWins';
  const reason = { tie: t('rTie')(f), wrong: t('rWrong')(a, f), guessed: t('rGuessed')(a) + more, caught: t('rCaught')(a) + more, forger: t('rForger')(a, esc(forgerWord(g))) + more }[o.reason];
  const fw = imp.some(id => roleOf(g, id) === 'forger') ? forgerWord(g) : '';
  const ranked = [...S.players].sort((a, b) => b.score - a.score);
  const champ = ranked[0].score >= S.target && (ranked.length < 2 || ranked[1].score < ranked[0].score) ? ranked[0] : null;
  app.innerHTML = `
    <div class="verdict ${o.fakeWins ? 'fake' : 'art'}"><h2>${o.fakeWins ? (SKIN_T[S.skin]?.[S.lang]?.fakeWins ?? t(winT)) : t('artistsWin')}</h2><p>${reason}</p></div>
    <p class="center" style="margin:6px 0 12px">${t('wordWas')}<br><span class="word">${esc(wordText(g))}</span><br><span class="catpill">${esc(catText(g))}</span>${fw ? `<br><small class="muted">${t('forgerWas')}${t('colon')}<b>${esc(fw)}</b> 🥸</small>` : ''}</p>
    ${champ ? `<div class="trophy">${t('champion')(esc(pname(champ)))}</div>` : ''}
    <div class="card">
      <div class="paper view"><canvas id="cv"></canvas></div>
      <div class="legend">${g.drawers.map(id => `<span>${dotOf(id)}${nameOf(id)}${roleIcon(g, id)}</span>`).join('')}</div>
      ${g.archived ? `<p class="note">${t('saved')}</p>` : ''}
      <div class="row"><button class="btn" id="replay">▶ ${t('replay')}</button><button class="btn" id="dl">⬇ ${t('save')}</button></div>
    </div>
    <div class="card"><h3>${t('scores')}</h3><ul class="scores">${ranked.map(p => `<li>${dotOf(p.id)}<span class="n">${esc(pname(p))}${p.id === g.gm ? ` · ${t('gm')}` : ''}${roleIcon(g, p.id)}</span>
      <span class="gain">${g.gains[p.id] ? '+' + g.gains[p.id] : ''}</span><span class="pts">${p.score}</span></li>`).join('')}</ul></div>
    ${champ ? `<button class="btn primary" id="newGame">${t('newGame')}</button>` : `<button class="btn primary" id="next">${t('next')} →</button>`}
    <button class="btn" id="settings">${t('settings')}</button>`;
  const colorOf = s => P(s.id)?.color;
  const api = mountCanvas($('cv'), { strokes: () => g.strokes, colorOf });
  $('replay').onclick = replayer(api, g.strokes);
  $('dl').onclick = () => downloadPng(g.strokes, colorOf, wordText(g));
  $('next')?.addEventListener('click', startGame);
  $('newGame')?.addEventListener('click', () => { S.players.forEach(p => p.score = 0); startGame(); });
  $('settings').onclick = () => { S.game = null; save(); goStep('settings'); };
}

// ---------- chrome ----------
// Settings menu: gallery, rules and language (gallery and language only between rounds, as before).
function openMenu() {
  const g = S.game, between = !g || !!view || g.phase === 'result' || g.phase === 'sameEnd' || g.phase === 'chainEnd' || g.phase === 'sabEnd' || g.phase === 'bluffEnd';
  modal(`<h2>${t('menu')}</h2>
    <div class="menu">
      ${between ? `<button class="btn" id="mGal">🖼️ ${t('gallery')}</button>` : ''}
      <button class="btn" id="mRules">📖 ${t('rulesTitle')}</button>
      <div class="field"><label class="flabel">${t('skin')}</label>
        <div class="seg" id="mSkin">${Object.keys(SKINS).map(k => `<button data-v="${k}" aria-pressed="${(S.skin || 'classic') === k}">${t('skinNames')[k]}</button>`).join('')}</div></div>
      ${!g || view ? `<div class="field"><label class="flabel">${t('language')}</label>
        <div class="seg" id="mLang">${[['fr', 'Français'], ['en', 'English']].map(([k, n]) => `<button data-v="${k}" aria-pressed="${S.lang === k}">${n}</button>`).join('')}</div></div>` : ''}
    </div>
    <button class="btn primary" id="mClose" style="margin-top:18px">${t('close')}</button>`);
  $('mGal')?.addEventListener('click', () => { dlg.close(); openGallery(); });
  $('mRules').onclick = showRules;
  $('mSkin').querySelectorAll('button').forEach(b => b.onclick = () => { S.skin = b.dataset.v; save(); render(); openMenu(); });
  $('mLang')?.querySelectorAll('button').forEach(b => b.onclick = () => { S.lang = b.dataset.v; save(); render(); openMenu(); });
  $('mClose').onclick = () => dlg.close();
}
$('menuBtn').onclick = openMenu;
$('quitBtn').onclick = () => ask(t('quitConfirm'), t('quitHint'), t('quitRound'), () => { S.game = null; save(); render(); scrollTo(0, 0); });
function showRules() {
  modal(`<h2>${t('rulesTitle')}</h2><ol>${t('rules').map(r => `<li>${r}</li>`).join('')}</ol>
    <button class="btn primary" onclick="this.closest('dialog').close()">${t('close')}</button>`);
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
