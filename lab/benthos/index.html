<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f807b">
<meta name="apple-mobile-web-app-title" content="Benthos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Benthos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 19c2-4 5-6 10-6s8 2 10 6"/>
        <ellipse cx="8.5" cy="8" rx="4" ry="3.6"/>
        <path d="M5 10.6c-1.4 1.4-2.2 2.6-2.6 4.4M8.5 11.6c-.4 1.8-.4 3-.8 4.6M12 10.6c1.2 1.4 1.8 2.6 2.6 4"/>
        <path d="M17 14c0-3 1.5-5 3.5-5.6"/>
      </svg>
      <span>Benthos</span>
    </div>
    <div id="turnbar" class="turnbar"></div>
    <div class="grow"></div>
    <button id="btn-help" class="ghostbtn">Rules</button>
    <button id="btn-params" class="ghostbtn">Parameters</button>
    <button id="btn-new" class="ghostbtn primary">New game</button>
  </header>

  <main>
    <section class="stage">
      <svg id="board" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="zoom">
        <button data-zoom="out" title="Zoom out">&#8722;</button>
        <button data-zoom="fit" title="Fit the reef">&#9635;</button>
        <button data-zoom="in" title="Zoom in">&#43;</button>
      </div>
      <div id="toast" class="toast" hidden></div>
      <div id="curtain" class="curtain" hidden></div>
    </section>
    <aside id="side" class="side"></aside>
  </main>

  <footer id="tray" class="tray"></footer>
  <div id="modal" class="modal" hidden></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
