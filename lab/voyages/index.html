<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe4cc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Voyages</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --paper:#efe4cc; --paper2:#e6d7b6; --ink:#2b2622; --muted:#7a6d5c;
  --sea:#cfe2e3; --sea2:#a9cbd0; --land:#dcc185; --land2:#a8874a;
  --route:#1f3a5f; --accent:#b8442f; --gold:#b98a1b; --ok:#3d7a4f;
  --card:#f6eedb; --chip:#f7efdc; --field:#fffaf0; --crossed:#e3d6bb; --crossed-ink:#a3957d; --sold:#d9ead9;
  --hexline:#9fb8ba; --regline:#6f9aa1; --wave:#ffffff; --wave2:#5f8f98; --dread:#4a3d3a; --dread2:#2a201e;
  --label:#5b4a2d; --gold-ink:#5b4310; --coin:#f2cf5b; --coin-done:#e9ddbf; --coin-line:#8a6a1c; --compline:#cdbb95;
  --accent-soft:#b8442f40; --on-accent:#fff; --on-route:#fff; --toast:#2b2622; --toast-ink:#fff; --scrim:#2b262299; --shadow:#0005;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#081325; --paper2:#1a2c4a; --ink:#e4ebf6; --muted:#8ea2c0;
  --sea:#0f3354; --sea2:#0a2643; --land:#6a6048; --land2:#9c8a5c;
  --route:#8fc1ff; --accent:#ff7f61; --gold:#e3b341; --ok:#5fbf86;
  --card:#0e1d36; --chip:#11233f; --field:#14284a; --crossed:#1f3354; --crossed-ink:#5b7194; --sold:#173f33;
  --hexline:#1d4669; --regline:#3a6f9c; --wave:#8cc4f0; --wave2:#03101f; --dread:#03070e; --dread2:#000;
  --label:#c8d5e8; --gold-ink:#2a1e04; --coin:#e3b341; --coin-done:#2e3c58; --coin-line:#8a6a1c; --compline:#2c4468;
  --accent-soft:#ff7f6140; --on-accent:#0b1626; --on-route:#081325; --toast:#dfe8f5; --toast-ink:#081325; --scrim:#000b; --shadow:#000a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#081325; --paper2:#1a2c4a; --ink:#e4ebf6; --muted:#8ea2c0;
  --sea:#0f3354; --sea2:#0a2643; --land:#6a6048; --land2:#9c8a5c;
  --route:#8fc1ff; --accent:#ff7f61; --gold:#e3b341; --ok:#5fbf86;
  --card:#0e1d36; --chip:#11233f; --field:#14284a; --crossed:#1f3354; --crossed-ink:#5b7194; --sold:#173f33;
  --hexline:#1d4669; --regline:#3a6f9c; --wave:#8cc4f0; --wave2:#03101f; --dread:#03070e; --dread2:#000;
  --label:#c8d5e8; --gold-ink:#2a1e04; --coin:#e3b341; --coin-done:#2e3c58; --coin-line:#8a6a1c; --compline:#2c4468;
  --accent-soft:#ff7f6140; --on-accent:#0b1626; --on-route:#081325; --toast:#dfe8f5; --toast-ink:#081325; --scrim:#000b; --shadow:#000a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.35 Georgia,"Iowan Old Style",serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--paper2);flex-wrap:wrap}
header h1{margin:0;font-size:20px;letter-spacing:.06em;font-variant:small-caps}
.chip{border:1px solid var(--land2);border-radius:999px;padding:2px 10px;font-size:13px;background:var(--chip);white-space:nowrap}
.grow{flex:1}
.stars{display:flex;gap:2px;font-size:15px}
.stars span{opacity:.25;filter:grayscale(1)}
.stars span.on{opacity:1;filter:none}
.iconbtn{border:1px solid var(--land2);background:var(--chip);border-radius:8px;padding:3px 9px}
main{display:grid;gap:12px;padding:12px 16px 24px;max-width:1200px;margin:0 auto}
@media(min-width:960px){main{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr)}#mapWrap{grid-column:1}#ctrl{grid-column:2;grid-row:1}#sheet{grid-column:1/3}}
.card{background:var(--card);border:1px solid var(--paper2);border-radius:12px;padding:12px}
#mapWrap{padding:6px}
#map{width:100%;height:auto;display:block;touch-action:manipulation}
.hex{stroke:var(--hexline);stroke-width:.35}
.hex.reg{fill:var(--sea2);stroke:var(--regline);stroke-dasharray:1.2 .8;stroke-width:.45}
.hex.land{fill:var(--land);stroke:var(--land2);stroke-width:.5}
.hex.dread{fill:var(--dread);stroke:var(--dread2)}
.wave{fill:url(#waves);pointer-events:none}
.trip,.stopdot{transition:none}
.hex.depart{stroke:var(--accent);stroke-width:1.1;cursor:pointer}
.ico{font-size:8.5px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.taken{opacity:.25}
.gold{font:bold 6px Georgia;fill:var(--gold-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.iname{font:3px Georgia;fill:var(--label);text-anchor:middle;pointer-events:none}
.trip{fill:none;stroke:var(--route);stroke-width:1;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.prev{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-dasharray:2 1.4;stroke-linecap:round}
.stopdot{fill:var(--route)}
h2{margin:0 0 8px;font-size:15px;font-variant:small-caps;letter-spacing:.05em;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{text-align:center;font-size:12px;color:var(--muted)}
.die{width:64px;height:64px;margin:4px auto 0;border-radius:12px;border:2px solid var(--ink);background:var(--field);display:block;padding:0;position:relative}
.die.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.die.mod::after{content:"✎";position:absolute;top:-8px;right:-8px;font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:50%;width:18px;height:18px;line-height:18px}
.die svg{width:100%;height:100%}
.dieval{font-size:12px;color:var(--ink);margin-top:2px}
.modbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px;min-height:34px}
.btn{border:1px solid var(--ink);background:var(--field);border-radius:9px;padding:7px 12px}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--route);color:var(--on-route);border-color:var(--route)}
.btn.small{padding:4px 9px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.info{margin:10px 0;min-height:40px;font-size:14px}
.info b{color:var(--accent)}
.compass{width:92px;height:92px;flex:none}
.hint{font-size:13px;color:var(--muted)}
#sheet{display:grid;gap:12px}
@media(min-width:700px){#sheet{grid-template-columns:repeat(3,1fr)}}
.sailors{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sb{aspect-ratio:1;border:1.5px solid var(--land2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--field);position:relative}
.sb.empty{border-style:dashed;opacity:.5}
.sb.spent{background:repeating-linear-gradient(45deg,var(--field) 0 4px,var(--crossed) 4px 6px);color:var(--muted)}
.sb .mk{position:absolute;bottom:0;right:2px;font-size:9px}
.cargo{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:90px repeat(3,1fr);gap:5px;align-items:center;font-size:13px}
.cs{height:30px;border:1.5px solid var(--land2);border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--field);position:relative;font-size:15px}
.cs small{position:absolute;top:-1px;left:3px;font-size:9px;color:var(--muted)}
.cs.sold{background:var(--sold);border-color:var(--ok)}
.duties{display:grid;grid-template-columns:repeat(6,1fr) 46px;gap:4px;font-size:15px}
.dc{aspect-ratio:1;border:1.5px solid var(--land2);border-radius:5px;display:flex;align-items:center;justify-content:center;background:var(--field);padding:0;font-weight:bold}
.dc.x{background:var(--crossed);color:var(--crossed-ink);text-decoration:line-through}
.dc.cand{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dc.pick{background:var(--accent);color:var(--on-accent)}
.dc.hole{visibility:hidden}
.rw{display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:5px;line-height:1}
.rw.done{opacity:.3}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.scoreline{display:flex;justify-content:space-between;border-bottom:1px dotted var(--land2);padding:3px 0;font-size:14px}
#modal{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
.mbox{background:var(--paper);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px var(--shadow)}
.mbox h3{margin:0 0 8px;font-variant:small-caps;letter-spacing:.05em}
.mbox .btns{display:grid;gap:8px;margin-top:12px}
.mbox input{font:inherit;padding:8px;border:1px solid var(--land2);border-radius:8px;width:100%;background:var(--field);text-transform:uppercase}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;gap:6px;z-index:20;width:min(92vw,420px);pointer-events:none}
.t{background:var(--toast);color:var(--toast-ink);padding:8px 12px;border-radius:10px;font-size:14px;animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.pickvals{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.log{font-size:12px;color:var(--muted);max-height:120px;overflow:auto;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Voyages</h1>
  <span class="chip" id="roundChip"></span>
  <span class="chip" id="goldChip"></span>

  <span class="chip" id="codeChip"></span>
  <button class="iconbtn" id="themeBtn" aria-label="Theme"></button>
  <button class="iconbtn" id="langBtn"></button>
  <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
</header>
<main>
  <section class="card" id="mapWrap"><svg id="map"></svg></section>
  <section class="card" id="ctrl"></section>
  <section id="sheet">
    <div class="card"><h2 data-i18n="crew"></h2><div class="sailors" id="sailorsEl"></div>
      <div class="legend"><span data-i18n="lg_sailor"></span><span data-i18n="lg_hero"></span><span data-i18n="lg_box12"></span></div></div>
    <div class="card"><h2 data-i18n="hold"></h2><div class="cargo" id="cargoEl"></div>
      <div class="legend"><span data-i18n="lg_sell"></span><span data-i18n="lg_unsold"></span></div></div>

      <div class="legend"><span data-i18n="lg_duties"></span></div></div>
  </section>
</main>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

  G:{name:'Tidecross',settle:true}, H:{name:'Coral Spire',gold:6}, I:{name:'Mistle Isle',gold:7},

const EMO = {fruit:'🍊',spice:'🌶️',hide:'🐾',gem:'💎',barrel:'🛢️',sailor:'⚓',relic:'🏺',star:'⭐',dread:'☠️',settle:'🏘️',hero:'🦸'};
const TYPES = ['fruit','spice','hide','gem'];
const SELL = [3,4,5];
// Seven ocean regions (3 north, 1 central, 3 south): every sea hex within one step of a centre.
const REGION_CENTRES = [[5,1],[10,1],[15,1],[8,5],[2,9],[9,9],[17,10]];
const DIRS = {1:[0,-1],2:[1,-1],3:[1,0],4:[0,1],5:[-1,1],6:[-1,0]};
const STARKEYS = ['cargo','duties','dread','explore','recruit'];

// ---------- Language ----------
let LANG = (()=>{ try{ const s=localStorage.getItem('voyages-lang'); if(s) return s; }catch(e){} return /^fr/i.test(navigator.language||'')?'fr':'en'; })();

  howHtml:`<h3>How to play</h3>
  <p><b>Each round</b> three dice are rolled. Give one to <b>Heading</b> (the compass: 1 N, 2 NE, 3 SE, 4 S, 5 SW, 6 NW), one to <b>Speed</b> and one to <b>Duty</b>. Tap two dice to swap them.</p>
  <p><b>Sailing.</b> You move the full speed in a straight line, stopping early when you reach an island, the Dread, or the map's edge. You only collect what's on the hex where you stop, and each icon only once.</p>

// ---------- Rules ----------
function computeMove(from, dir, dist){
  const startIsl = isIsland(...from) ? ch(...from) : null;
  let a = toAx(...from); const hexes=[from.slice()]; let stop=null;
  for (let i=0;i<dist;i++){

    const x=ch(...n);
    if(/[A-K]/.test(x) && x!==startIsl){ stop='island'; break; }

const $ = id => document.getElementById(id);

function hexPts(x,y,s=S){ let p=[]; for(let i=0;i<6;i++){ const a=Math.PI/3*i; p.push((x+s*Math.cos(a)).toFixed(2)+','+(y+s*Math.sin(a)).toFixed(2)); } return p.join(' '); }

  // routes
  let routes='';
  state.trips.forEach(t=>{ if(t.length<2) return; routes+=`<polyline class="trip" points="${t.map(h=>centre(...h).join(',')).join(' ')}"/>`; const [ex,ey]=centre(...t[t.length-1]); routes+=`<circle class="stopdot" cx="${ex}" cy="${ey}" r="1"/>`; });
  let prev='';
  if(state.phase==='plan'){
    const mv=computeMove(state.depart||state.pos, state.dice[0], state.dice[1]);
    prev=`<polyline class="prev" points="${mv.hexes.map(h=>centre(...h).join(',')).join(' ')}"/>`;
    const [ex,ey]=centre(...mv.end); prev+=`<polygon points="${hexPts(ex,ey,S*.82)}" fill="none" stroke="var(--accent)" stroke-width="1"/>`;
  }
  const [sx,sy]=centre(...(state.phase==='plan'&&state.depart?state.depart:state.pos));
  const ship=`<circle cx="${sx}" cy="${sy}" r="6.2" fill="var(--field)" stroke="var(--route)" stroke-width="1"/><text class="ico" x="${sx}" y="${sy+.4}" style="font-size:8.5px">⛵</text>`;
  const defs=`<defs><pattern id="waves" width="12" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)">
    <path d="M1 2 q1.25 -1 2.5 0 t2.5 0" fill="none" stroke="var(--wave)" stroke-width=".4" stroke-linecap="round" opacity=".7"/>
    <path d="M7 5.5 q1.25 -1 2.5 0 t2.5 0" fill="none" stroke="var(--wave2)" stroke-width=".35" stroke-linecap="round" opacity=".35"/></pattern></defs>`;
  svg.innerHTML=defs+base+routes+top+prev+ship;
}

function compassSvg(active){
  let s='<svg class="compass" viewBox="-50 -50 100 100"><polygon points="'+hexPts(0,0,30).replace(/(-?[\d.]+),(-?[\d.]+)/g,(m,a,b)=>a+','+b)+'" fill="var(--field)" stroke="var(--land2)"/>';
  for(let d=1;d<=6;d++){
    const [dq,dr]=DIRS[d]; // direction vector in pixel space for flat-top
    const [x1,y1]=[1.5*dq, R3*(dr+dq/2)]; const len=Math.hypot(x1,y1); const ux=x1/len, uy=y1/len;
    const on=d==active;
    s+=`<line x1="0" y1="0" x2="${ux*26}" y2="${uy*26}" stroke="${on?'var(--accent)':'var(--compline)'}" stroke-width="${on?4:2}" stroke-linecap="round"/>`;
    s+=`<circle cx="${ux*40}" cy="${uy*40}" r="8.5" fill="${on?'var(--accent)':'var(--card)'}" stroke="var(--land2)"/><text x="${ux*40}" y="${uy*40+.5}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="bold" fill="${on?'var(--on-accent)':'var(--ink)'}">${d}</text>`;
  }
  return s+'<circle r="3" fill="var(--ink)"/></svg>';
}

function renderCtrl(){
  const c=$('ctrl'); c.innerHTML='';
  const roundTxt = state.mode==='solo' ? tr('roundOf', state.round) : tr('round', state.round)+(state.endAfter?(state.round>=state.endAfter?tr('finalNow'):tr('finalNext')):'');
  if(state.phase==='over'){ c.append(el(`<div><h2>${tr('over')}</h2><p>${scoreHtml()}</p><div class="row"><button class="btn primary" id="again">${tr('newVoy')}</button></div></div>`)); $('again').onclick=setup; return; }
  if(state.phase==='roll' || state.phase==='prompt'){
    const last = state.rolled ? `<div class="hint">${tr('lastRoll', state.rolled.join(' · '))}</div>` : '';
    c.append(el(`<div><h2>${roundTxt}</h2>
      <p class="hint">${state.mode==='solo'?tr('soloGoal'):tr('groupInfo', state.seed)}</p>
      <div class="row"><button class="btn primary" id="rollBtn">${tr('roll')}</button>${state.mode==='group'?'<button class="btn" id="manBtn">'+tr('manual')+'</button>':''}</div>
      ${state.mode==='group'&&!state.endAfter?'<div class="row" style="margin-top:10px"><button class="btn small" id="trigBtn">'+tr('trig')+'</button></div>':''}
      ${last}</div>`));
    $('rollBtn').onclick=()=>{ const d=rollFor(state.seed,state.round); animateRoll(d); };
    if($('manBtn')) $('manBtn').onclick=manualRoll;
    if($('trigBtn')) $('trigBtn').onclick=()=>{ state.endAfter=state.round; save(); render(); toast(tr('finalToast')); };
    return;
  }
  // plan phase
  const labels=tr('labels');
  const slots=el('<div class="slots"></div>');
  state.dice.forEach((v,i)=>{
    const s=el(`<div class="slot">${labels[i]}<button class="die${state.sel===i?' sel':''}${state.mods[i]?' mod':''}" aria-label="${labels[i]} die ${v}">${pipSvg(v)}</button><div class="dieval">${i===0?tr('dir')[v]+' ('+v+')':i===1?tr('hexes',v):tr('cross',v)}</div></div>`);
    s.querySelector('button').onclick=()=>tapDie(i);
    slots.append(s);
  });
  const mv=computeMove(state.depart||state.pos, state.dice[0], state.dice[1]);
  const endX=ch(...mv.end);
  let dest = mv.stop==='island' ? tr('landsOn', iname(endX)) : mv.stop==='dread' ? tr('meetsDread') : mv.stop==='edge' ? tr('edgeAfter', mv.hexes.length-1) : '';
  if(!dest){ const k=key(...mv.end); dest = ICON[endX]&&!state.taken[k] ? tr('stopsOn', EMO[ICON[endX]], ware(ICON[endX])) : tr('openSea'); }
  const cands=dutyCands();
  const box=el(`<div><h2>${roundTxt}</h2></div>`);
  box.append(slots);
  const mod=el('<div class="modbar"></div>');
  if(state.sel==null) mod.append(el('<span class="hint">'+tr('tapHint')+'</span>'));
  else {
    const r=readyCount(), h=heroCount();
    const minus=el(`<button class="btn small" ${r?'':'disabled'}>⚓ −1</button>`), plus=el(`<button class="btn small" ${r?'':'disabled'}>⚓ +1</button>`);
    minus.onclick=()=>modDie(-1); plus.onclick=()=>modDie(1);
    const hero=el(`<button class="btn small" ${h?'':'disabled'}>${tr('setVal')}</button>`); hero.onclick=heroDie;
    const cancel=el('<button class="btn small">'+tr('done')+'</button>'); cancel.onclick=()=>{ state.sel=null; render(); };
    mod.append(minus,plus,hero,cancel);
  }
  box.append(mod);
  const info=el(`<div class="row" style="margin-top:6px;flex-wrap:nowrap"></div>`);
  info.append(el(compassSvg(state.dice[0])));
  info.append(el(`<div class="info">${tr('sailing', tr('dir')[state.dice[0]], state.dice[1], dest)}<br><span class="hint">${cands.length?(state.dutyPick==null?tr('tapDuty',state.dice[2]):tr('dutyChosen')):tr('dutySkip',state.dice[2])}${state.depart?tr('departHint'):''}</span></div>`));
  box.append(info);
  const row=el('<div class="row"></div>');
  const reset=el(`<button class="btn" ${state.mods.some(Boolean)?'':'disabled'}>${tr('resetCrew')}</button>`); reset.onclick=()=>{ state=JSON.parse(roundStart); render(); };
  const go=el(`<button class="btn primary">${tr('setSail')}</button>`); go.onclick=setSail;
  row.append(reset,go); box.append(row);
  c.append(box);
}
function tapDie(i){
  if(state.sel==null){ state.sel=i; }
  else if(state.sel===i){ state.sel=null; }
  else { const a=state.sel; [state.dice[a],state.dice[i]]=[state.dice[i],state.dice[a]]; [state.mods[a],state.mods[i]]=[state.mods[i],state.mods[a]]; state.sel=null; autoPick(); }
  render();
}
function modDie(d){
  const i=state.sel, j=state.sailors.indexOf('ready'); if(j<0) return;
  state.sailors[j]='spent'; state.dice[i]=((state.dice[i]-1+d+6)%6)+1; state.mods[i]=1; autoPick(); render();
}
function heroDie(){
  const i=state.sel;
  modal(`<h3>${tr('heroT')}</h3><p>${tr('heroP', tr('heroDie')[i])}</p><div class="pickvals">${[1,2,3,4,5,6].map(v=>`<button class="btn" data-v="${v}">${v}</button>`).join('')}</div><div class="btns"><button class="btn" id="mx">${tr('cancel')}</button></div>`);
  document.querySelectorAll('.pickvals button').forEach(b=>b.onclick=()=>{ state.sailors[state.sailors.indexOf('hero')]='spent'; state.dice[i]=+b.dataset.v; state.mods[i]=1; autoPick(); closeModal(); render(); });
  $('mx').onclick=closeModal;
}
function animateRoll(final){
  const c=$('ctrl'); let n=0;
  const t=setInterval(()=>{ n++; c.innerHTML='<h2>'+tr('rolling')+'</h2><div class="slots">'+[0,1,2].map(()=>`<div class="slot"><span class="die">${pipSvg(1+Math.random()*6|0)}</span></div>`).join('')+'</div>';
    if(n>7){ clearInterval(t); startRound(final); } }, 70);
}
function manualRoll(){
  let v=[1,1,1];
  const draw=()=>modal(`<h3>${tr('enterRoll')}</h3>${[0,1,2].map(i=>`<div class="pickvals" style="margin:8px 0">${[1,2,3,4,5,6].map(x=>`<button class="btn${v[i]===x?' primary':''}" data-i="${i}" data-v="${x}">${x}</button>`).join('')}</div>`).join('')}<div class="btns"><button class="btn primary" id="mok">${tr('useDice')}</button><button class="btn" id="mx">${tr('cancel')}</button></div>`);
  draw();
  $('mbox').onclick=e=>{ const b=e.target.closest('[data-i]'); if(b){ v[+b.dataset.i]=+b.dataset.v; draw(); }
    if(e.target.id==='mok'){ closeModal(); startRound(v); } if(e.target.id==='mx') closeModal(); };
}

function renderSheet(){
  // sailors
  const se=$('sailorsEl'); se.innerHTML='';
  for(let i=0;i<15;i++){ const s=state.sailors[i];
    se.append(el(`<div class="sb ${s?s:'empty'}">${s==='ready'?'⚓':s==='hero'?'🦸':s==='spent'?'✕':''}${i===11?'<span class="mk">⭐</span>':''}</div>`)); }
  // cargo
  const ce=$('cargoEl'); ce.innerHTML='';
  TYPES.forEach(t=>{ const r=el(`<div class="crow"><span>${EMO[t]} ${ware(t)}</span></div>`);
    state.cargo[t].forEach((s,i)=>r.append(el(`<div class="cs ${s===2?'sold':''}"><small>${SELL[i]}</small>${s===1?EMO[t]:s===2?'✓':''}</div>`)));
    ce.append(r); });
  // duties
  const de=$('dutiesEl'); de.innerHTML='';
  const cands = state.phase==='plan'?dutyCands():[];
  const rw = id => { const it=DUTY_REWARDS[id]; return it?`<div class="rw ${state.lines.includes(id)?'done':''}">${it.map(x=>EMO[x]).join('')}</div>`:'<div></div>'; };
  for(let r=0;r<5;r++){
    for(let c=0;c<6;c++){ const d=cellAt(r,c);
      if(!d){ de.append(el('<div class="dc hole"></div>')); continue; }
      const x=state.duties.includes(d.i), cand=cands.includes(d.i), pick=state.dutyPick===d.i;
      const b=el(`<button class="dc${x?' x':''}${cand?' cand':''}${pick?' pick':''}">${d.v}</button>`);
      if(cand) b.onclick=()=>{ state.dutyPick=d.i; render(); };
      de.append(b); }
    de.append(el(rw('r'+r)));
  }
  for(let c=0;c<6;c++) de.append(el(rw('c'+c)));
  de.append(el('<div></div>'));
}

function scoreHtml(){
  const s=score(), stars=starCount();
  const verdict = state.mode==='solo' ? (stars>=3?tr('win',stars):tr('lose',stars)) : tr('compare');
  return `${verdict}<div style="margin-top:10px">
  <div class="scoreline"><span>${tr('sc_isl')}</span><b>${s.islands}</b></div>
  <div class="scoreline"><span>${tr('sc_reg',s.n)}</span><b>${s.regions}</b></div>
  <div class="scoreline"><span>${tr('sc_sold')}</span><b>${s.sold}</b></div>
  <div class="scoreline"><span>${tr('sc_unsold')}</span><b>${s.unsold}</b></div>
  <div class="scoreline"><span>${tr('sc_hero')}</span><b>${s.heroes}</b></div>
  <div class="scoreline"><span>${tr('sc_dread')}</span><b>${s.dread}</b></div>
  <div class="scoreline"><span>${tr('sc_stars')}</span><b>${s.stars}</b></div>
  <div class="scoreline" style="font-size:17px"><span>${tr('sc_total')}</span><b>${s.total}</b></div></div>`;
}

function renderPrompt(){
  if(state.phase!=='prompt' || !state.queue.length) return;
  const p=state.queue[0];
  if(p.type==='barrel'){
    const opts=TYPES.filter(t=>state.cargo[t].includes(0));
    if(!opts.length){ modal('<h3>'+tr('barrel')+'</h3><p>'+tr('barrelFull')+'</p><div class="btns"><button class="btn primary" id="pk">'+tr('onward')+'</button></div>'); $('pk').onclick=()=>{ closeModal(); resolvePrompt(); }; return; }
    modal(`<h3>${tr('barrelWild')}</h3><p>${tr('inside')}</p><div class="btns">${opts.map(t=>`<button class="btn" data-t="${t}">${EMO[t]} ${ware(t)}</button>`).join('')}</div>`);
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ closeModal(); resolvePrompt(()=>addCargo(b.dataset.t)); });
  } else if(p.type==='settle'){
        if(!p.recruited){ p.recruited=true; addSailor(); save(); }
    const held=TYPES.filter(t=>state.cargo[t].includes(1));
    const btns=held.map(t=>{ const n=state.cargo[t].filter(s=>s===1).length; return `<button class="btn" data-sell="${t}">${tr('sellAll',EMO[t],ware(t),n,sellValue(t,n))}</button>`; });
    if(held.length>=2) btns.push(`<button class="btn" data-sell="each">${tr('sellEach',held.map(t=>EMO[t]).join(''),held.reduce((a,t)=>a+sellValue(t,1),0))}</button>`);
    modal(`<h3>🏘️ ${iname(p.id)}</h3><p>${tr('signs')} ${held.length?tr('sellQ'):tr('noCargo')}</p><div class="btns">${btns.join('')}<button class="btn primary" id="pk">${held.length?tr('keep'):tr('onward')}</button></div>`);
    const done=fn=>{ closeModal(); resolvePrompt(()=>{ state.used.push(p.id); fn&&fn(); }); };
    document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>done(()=>{ const t=b.dataset.sell;
      if(t==='each'){ const v=held.reduce((a,x)=>a+sellValue(x,1),0); held.forEach(x=>sell(x,1)); note(tr('soldEach',v)); }
      else { const n=state.cargo[t].filter(s=>s===1).length, v=sellValue(t,n); sell(t,n); note(tr('soldN',n,ware(t),v)); } }));
    $('pk').onclick=()=>done();
  }
}

function render(){
  $('roundChip').textContent = state.mode==='solo' ? tr('round',Math.min(state.round,16))+'/16' : tr('round',state.round);
  $('goldChip').textContent = '💰 '+score().total;
  $('codeChip').textContent = state.mode==='group' ? '🎲 '+state.seed : 'Solo';
  $('starsEl').innerHTML = STARKEYS.map(k=>`<span class="${state.stars[k]?'on':''}" title="${tr('star_'+k)}">⭐</span>`).join('');
  renderMap(); renderCtrl(); renderSheet(); renderPrompt();
  if(state.phase==='over' && !$('modal').classList.contains('on')) { modal(`<h3>${tr('over')}</h3>${scoreHtml()}<div class="btns"><button class="btn primary" id="ng">${tr('newVoy')}</button><button class="btn" id="mx">${tr('lookMap')}</button></div>`); $('ng').onclick=setup; $('mx').onclick=closeModal; }
}

// ---------- Modal / toast / menu ----------
function modal(html){ $('mbox').onclick=null; $('mbox').innerHTML=html; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); }
function toast(msg){ const t=el(`<div class="t">${msg}</div>`); $('toast').append(t); setTimeout(()=>t.remove(), 2600); while($('toast').children.length>3) $('toast').firstChild.remove(); }

function setup(){
  modal(`<h3>${tr('newT')}</h3><p>${tr('intro')}</p>
  <div class="btns"><button class="btn primary" id="solo">${tr('soloBtn')}</button></div>
  <p style="margin-top:16px">${tr('friends')}</p>
  <input id="code" maxlength="16" value="${randomCode()}" aria-label="${tr('codeAria')}">
  <div class="btns"><button class="btn" id="grp">${tr('grp')}</button><button class="btn" id="howBtn">${tr('how')}</button><button class="btn" id="setLang">${tr('otherLang')}</button>${state&&!state.over?'<button class="btn" id="mx">'+tr('cancel')+'</button>':''}</div>`);
  $('setLang').onclick=()=>{ setLang(LANG==='fr'?'en':'fr'); setup(); };
  $('solo').onclick=()=>begin('solo', randomCode());
  $('grp').onclick=()=>{ const v=$('code').value.trim().toUpperCase(); if(!v){ toast(tr('enterCode')); return; } begin('group', v); };
  $('howBtn').onclick=how;
  if($('mx')) $('mx').onclick=closeModal;
}
function begin(mode, seed){ state=newState(mode, seed); history=[]; roundStart=null; closeModal(); save(); render(); }
function how(){
  modal(`${tr('howHtml')}
  <div class="btns"><button class="btn primary" id="mx">${tr('gotIt')}</button></div>`);
  $('mx').onclick=()=>{ closeModal(); if(!state) setup(); };
}
function menu(){
  modal(`<h3>Menu</h3><div class="btns">
    <button class="btn" id="m1">${tr('how')}</button>
    <button class="btn" id="m2" ${history.length?'':'disabled'}>${tr('undoL')}</button>
    <button class="btn" id="m3">${tr('logT')}</button>
    <button class="btn" id="m4">${tr('scoreSoFar')}</button>
    <button class="btn" id="m5">${tr('newVoy')}</button>
    <button class="btn primary" id="mx">${tr('close')}</button></div>`);
  $('m1').onclick=how; $('m2').onclick=undo;
  $('m3').onclick=()=>{ modal(`<h3>${tr('logT')}</h3><div class="log" style="max-height:60vh">${state.log.map(l=>'<div>'+l+'</div>').join('')||tr('nothingYet')}</div><div class="btns"><button class="btn primary" id="mx">${tr('close')}</button></div>`); $('mx').onclick=closeModal; };
  $('m4').onclick=()=>{ modal(`<h3>${tr('goldSoFar')}</h3>${scoreHtml()}<div class="btns"><button class="btn primary" id="mx">${tr('close')}</button></div>`); $('mx').onclick=closeModal; };
  $('m5').onclick=setup; $('mx').onclick=closeModal;
}
$('menuBtn').onclick=menu;
$('themeBtn').onclick=()=>setTheme(isDark()?'light':'dark');
applyTheme();
$('langBtn').onclick=()=>setLang(LANG==='fr'?'en':'fr');
applyStatic();
$('modal').onclick=e=>{ if(e.target.id==='modal' && state && state.phase!=='prompt') closeModal(); };
$('map').addEventListener('click', e=>{
  const p=e.target.closest('polygon[data-c]'); if(!p || state.phase!=='plan' || !state.depart) return;
  const h=[+p.dataset.c, +p.dataset.r]; if(ch(...h)!==ch(...state.pos)) return;
  state.depart=h; render();
});

if(load()) render(); else { state=newState('solo','KRAKEN1'); render(); setup(); }
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
