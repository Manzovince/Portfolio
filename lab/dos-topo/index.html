<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dos topographiques</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#2c2c2a;--muted:#6f6d66;--line:#e2ddd0;--accent:#854F0B;--accent-soft:#FAEEDA;--stage:#e9e4d8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1c1b;--panel:#262624;--ink:#ecebe6;--muted:#a3a19a;--line:#3a3936;--accent:#EF9F27;--accent-soft:#3a2c14;--stage:#141413}}
:root[data-theme=dark]{--bg:#1c1c1b;--panel:#262624;--ink:#ecebe6;--muted:#a3a19a;--line:#3a3936;--accent:#EF9F27;--accent-soft:#3a2c14;--stage:#141413}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:272px 1fr;height:100vh;overflow:hidden}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:17px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
h1 svg{color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px;margin:4px 0 0}
section{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
section h2{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px}
.row label{font-size:13px}
.row output{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:52px;text-align:right}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:28px;height:28px;padding:0;font-size:16px;line-height:1}
.step input{width:44px;text-align:center;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dims>div{display:flex;flex-direction:column;gap:6px}
.dims span{font-size:13px}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme=dark] button.primary,:root:not([data-theme=light]) button.primary{color:#1c1c1b}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) button.primary{color:#fff}}
:root[data-theme=light] button.primary{color:#fff}
.btns[hidden]{display:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;white-space:nowrap}
.btns .wide{grid-column:1/-1}
.toggle{display:flex;align-items:center;justify-content:space-between;font-size:13px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;height:30px;font-size:12.5px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stats span{display:flex;justify-content:space-between;gap:4px}
.stats .big{grid-column:1/-1;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--ink)}
.sublab{font-size:13px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:28px;padding:0 10px;font-size:12.5px;border-radius:999px;color:var(--muted)}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
section h2{cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between}
section h2::after{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s;margin-right:4px}
section.closed h2::after{transform:rotate(-45deg)}
section.closed>:not(h2){display:none!important}
#freeOpts{display:flex;flex-direction:column;gap:12px}
section h2:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
#freeOpts.off,#shareRow.off{opacity:.45;pointer-events:none}
.row.off{opacity:.45;pointer-events:none}
.stats b{color:var(--ink);font-weight:600}
main{position:relative;overflow:auto;background:var(--stage)}
.stage{min-width:100%;min-height:100%;display:grid;place-items:center;padding:40px}
canvas{display:block;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 30px rgba(0,0,0,.12)}
.busy{position:sticky;top:12px;left:12px;float:left;margin:12px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--muted);z-index:2;opacity:0;transition:opacity .2s}
.busy.on{opacity:1}
body.nopanel{grid-template-columns:1fr}body.nopanel aside{display:none}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.icon{width:30px;height:30px;padding:0;display:grid;place-items:center;flex:none}
#show{position:fixed;top:12px;left:12px;z-index:3;display:none;align-items:center;gap:6px;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.zbar{position:fixed;top:12px;right:20px;z-index:3;display:flex;align-items:center;gap:6px;padding:5px 6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.zbar .icon{width:28px;height:28px;font-size:16px;line-height:1}
.zbar input{width:110px;accent-color:var(--accent)}
.zbar output{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:40px;text-align:right}
.zbar #fit{height:28px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:12.5px}
@media (max-width:760px){.zbar{top:auto;bottom:12px;right:12px}.zbar input{width:70px}}
.foot{position:sticky;bottom:-24px;margin:auto -18px -24px;padding:12px 18px 16px;background:var(--panel);border-top:1px solid var(--line)}
.foot button,#mix2{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;height:38px;font-weight:600}
#mix2{position:fixed;top:56px;left:12px;z-index:3;width:auto;display:none;box-shadow:0 2px 10px rgba(0,0,0,.15)}
body.nopanel #mix2{display:flex}
body.nopanel #show{display:flex}body.nopanel .busy{margin-left:140px}
@media (max-width:760px){body.nopanel{grid-template-rows:1fr}body{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh;overflow:auto}aside{border-right:0;border-bottom:1px solid var(--line)}main{min-height:70vh}}
</style>
</head>
<body>
<aside>
  <div class="hdr"><div>
    <h1><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 12c3-6 6 2 9-3s6 4 9-1"/><path d="M3 17c3-4 6 2 9-2s6 3 9 0"/><path d="M3 7c3-4 6 1 9-2s6 2 9 0"/></svg>Dos topographiques</h1>
    <p class="sub">Format poker 63 × 88 mm. Les courbes se raccordent quel que soit l'ordre des cartes.</p>
  </div><button id="hide" class="icon" title="Masquer les paramètres (P)" aria-label="Masquer les paramètres"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg></button></div>

  <section data-sec="grille">
    <h2>Grille</h2>
    <div class="dims">
      <div><span>Colonnes</span><div class="step"><button data-step="cols" data-d="-1" aria-label="Moins de colonnes">−</button><input id="cols" type="number" min="1" max="16" value="5"><button data-step="cols" data-d="1" aria-label="Plus de colonnes">+</button></div></div>
      <div><span>Rangées</span><div class="step"><button data-step="rows" data-d="-1" aria-label="Moins de rangées">−</button><input id="rows" type="number" min="1" max="12" value="3"><button data-step="rows" data-d="1" aria-label="Plus de rangées">+</button></div></div>
    </div>
    <div class="row"><label for="gap">Espacement</label><output id="gapOut"></output><input id="gap" type="range" min="0" max="12" step="0.5" value="0"></div>
  </section>

  <section data-sec="contenu">
    <h2>Contenu</h2>
    <label class="toggle">Jeu fixe de 52 cartes<input id="deck" type="checkbox"></label>
    <div class="btns" id="deckBtns"><button id="spread" title="Poser les 52 cartes en 13 × 4">Étaler les 52</button><button id="newDeck" title="Générer un autre jeu de 52">Nouveau jeu</button></div>
    <div id="freeOpts">
    <div><div class="sublab">Terrains</div><div class="chips" id="ters"></div></div>
    <div><div class="sublab">Éléments remarquables</div><div class="chips" id="els"></div></div>
    <div class="row"><label for="lmf">Fréquence des éléments</label><output id="lmfOut"></output><input id="lmf" type="range" min="0" max="100" step="5" value="40"></div>
    </div>
  </section>

  <section data-sec="cartes">
    <h2>Cartes</h2>
    <div class="row"><label for="lop">Opacité des courbes</label><output id="lopOut"></output><input id="lop" type="range" min="0" max="100" step="5" value="100"></div>
    <label class="toggle" id="shareRow">Terrains partagés entre cartes<input id="share" type="checkbox"></label>
    <div class="row" id="freqRow"><label for="freq">Fréquence des raccords</label><output id="freqOut"></output><input id="freq" type="range" min="5" max="100" step="5" value="50"></div>
    <label class="toggle">Retourner des cartes à 180°<input id="rot" type="checkbox"></label>
    <label class="toggle">Coins arrondis<input id="round" type="checkbox" checked></label>
    <label class="toggle">Nom du terrain<input id="labels" type="checkbox" checked></label>
    <div><div style="font-size:13px;margin-bottom:6px">Papier</div>
      <div class="seg" id="paper"><button data-v="auto" class="on">Auto</button><button data-v="light">Clair</button><button data-v="dark">Sombre</button></div></div>
  </section>

  <section data-sec="tirage">
    <h2>Tirage</h2>
    <div class="btns">
      <button id="png"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PNG</button>
      <button id="clear" title="Redessiner toutes les cartes"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Redessiner</button>
    </div>
    <div class="stats" id="stats"></div>
    <p class="sub" style="margin:0">Clic sur une carte : la tourner de 180°. Glisser : l'échanger avec une autre.</p>
  </section>
  <div class="foot"><button id="mix" class="primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h3c4 0 6 10 10 10h5M3 17h3c1.6 0 2.8-1.6 3.9-3.5M14.1 9.5C15.2 7.6 16.4 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>Remélanger</button></div>
</aside>
<button id="show" title="Afficher les paramètres (P)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M13 10l2 2-2 2"/></svg>Paramètres</button>
<button id="mix2" class="primary" title="Remélanger"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h3c4 0 6 10 10 10h5M3 17h3c1.6 0 2.8-1.6 3.9-3.5M14.1 9.5C15.2 7.6 16.4 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>Remélanger</button>
<div class="zbar" role="group" aria-label="Zoom">
  <button class="icon" id="zminus" title="Dézoomer" aria-label="Dézoomer">−</button>
  <input id="zoom" type="range" min="1" max="8" step="0.25" value="2.5" aria-label="Zoom">
  <button class="icon" id="zplus" title="Zoomer" aria-label="Zoomer">+</button>
  <output id="zoomOut"></output>
  <button id="fit" title="Ajuster à l'écran"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Ajuster</button>
</div>
<main id="main">
  <div class="busy" id="busy">Dessin…</div>
  <div class="stage"><canvas id="c"></canvas></div>
</main>

<script>
const W=63,H=88,TAU=Math.PI*2,THR=-.9,CL=.125,BL=7;
const PAL={
  light:{paper:'#FAEEDA',line:'#BA7517',idx:'#854F0B',water:'#B5D4F4',deep:'#85B7EB',shore:'#185FA5',ftint:'#D3E8B4',ftint2:'#B3D68A',tfill:'#97C459',cfill:'#6FA33A',tlight:'#C0DD97',tshade:'rgba(39,80,10,.3)',tstroke:'#3B6D11',rock:'#5F5E5A',grass:'#639922',lab:'#633806',edge:'#BA7517',bld:'#4A3626',road:'#A8743A',roadIn:'#FFF8EC',field:'#7FA046'},
  dark:{paper:'#2C2C2A',line:'#854F0B',idx:'#BA7517',water:'#0C447C',deep:'#042C53',shore:'#378ADD',ftint:'#2A4A14',ftint2:'#1F3D0B',tfill:'#3B6D11',cfill:'#2B560C',tlight:'#4F8A1C',tshade:'rgba(0,0,0,.35)',tstroke:'#97C459',rock:'#B4B2A9',grass:'#639922',lab:'#FAC775',edge:'#854F0B',bld:'#EAD9BC',road:'#C28A47',roadIn:'#3A3936',field:'#6E9A3A'}};
const T={montagne:'Montagne',foret:'Forêt',plaine:'Plaine',eau:'Eau'};
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const S={cols:5,rows:3,gap:0,zoom:2.5,rot:false,round:true,labels:true,paper:'auto',lop:100,panel:true,share:false,freq:50,deck:false,deckSeed:1,ters:['montagne','foret','plaine','eau'],els:['village','ferme','moulin','chapelle','tour','menhirs','mine','ponton','cabane'],lmf:40,closed:[]};
let shared=0,nel=0;
try{Object.assign(S,JSON.parse(localStorage.getItem('dos-topo')||'{}'));}catch(e){}
let cards=[];

const R=(a,b)=>a+Math.random()*(b-a);
const ss=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
const M=(x,y,m=13)=>ss(Math.min(x,W-x)/m)*ss(Math.min(y,H-y)/m);
function hsh(i,j,s){const v=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453;return(v-Math.floor(v))*2-1;}
function vn(x,y,s){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,a=fx*fx*(3-2*fx),b=fy*fy*(3-2*fy);
  const v00=hsh(i,j,s),v10=hsh(i+1,j,s),v01=hsh(i,j+1,s),v11=hsh(i+1,j+1,s);return v00+(v10-v00)*a+(v01-v00)*b+(v00-v10-v01+v11)*a*b;}
const fbm=(x,y,s)=>.6*vn(x/26,y/26,s)+.3*vn(x/12,y/12,s+1)+.12*vn(x/6,y/6,s+2);

const MOUTHS=[];
for(const[t,a,sg]of[[9,.6,2.6],[24,-.8,3.4]])MOUTHS.push([t,0,0,1,a,sg],[W-t,0,0,1,a,sg],[W-t,H,0,-1,a,sg],[t,H,0,-1,a,sg]);
for(const[t,a,sg]of[[16,-.65,3],[35,.8,3.6]])MOUTHS.push([0,t,1,0,a,sg],[0,H-t,1,0,a,sg],[W,H-t,-1,0,a,sg],[W,t,-1,0,a,sg]);
function spurs(){return MOUTHS.map(([x,y,dx,dy,a,sg])=>{const L=R(10,24),pts=[[x-dx*2,y-dy*2],[x,y],[x+dx*3,y+dy*3]];
  let ang=Math.atan2(dy,dx),cx=x+dx*3,cy=y+dy*3,turn=R(-.12,.12);
  for(let s=3;s<L;s+=2){turn+=R(-.08,.08);ang+=turn;cx+=Math.cos(ang)*2;cy+=Math.sin(ang)*2;pts.push([cx,cy]);}
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const r=3*sg;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[px,py]of pts){x0=Math.min(x0,px-r);y0=Math.min(y0,py-r);x1=Math.max(x1,px+r);y1=Math.max(y1,py+r);}
  return{pts,cum,a,sg,dx,dy,L:cum[cum.length-1]-2,box:[x0,y0,x1,y1]};});}
function spurV(c,x,y){let s=0;for(const sp of c.sp){const b=sp.box;if(x<b[0]||x>b[2]||y<b[1]||y>b[3])continue;
  const{pts,cum,a,sg,L,dx:ux,dy:uy}=sp,oth=ux?Math.min(y,H-y,ux>0?W-x:x):Math.min(x,W-x,uy>0?H-y:y);if(oth<.01)continue;
  let bd=1e9,bs=0;for(let i=0;i+1<pts.length;i++){const[x1,y1]=pts[i],[x2,y2]=pts[i+1],dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy,
    t=Math.max(0,Math.min(1,((x-x1)*dx+(y-y1)*dy)/l2)),ex=x1+t*dx-x,ey=y1+t*dy-y,d=ex*ex+ey*ey;if(d<bd){bd=d;bs=cum[i]+t*Math.sqrt(l2)-2;}}
  const tn=ux?(ux>0?x:W-x):(uy>0?y:H-y),sm=ux?y-pts[1][1]:x-pts[1][0],bl=ss(tn/4);
  const free=bd<9*sg*sg?Math.exp(-bd/(2*sg*sg))*(1-ss(bs/L)):0;
  s+=a*ss(oth/6)*(bl*free+(1-bl)*Math.exp(-sm*sm/(2*sg*sg)));}return s;}
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
function crown(g,[x,y,r,con,rot,n],ox,oy){x+=ox;y+=oy;g.beginPath();
  if(con){const k=7;for(let i=0;i<2*k;i++){const a=rot+i*Math.PI/k,q=i%2?r*.52:r;g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}}
  else{const m=n*6;for(let i=0;i<m;i++){const a=rot+i/m*TAU,q=r*(.78+.22*Math.abs(Math.sin(n*(a-rot)/2))+.05*Math.sin(3*a+rot*2));g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}}
  g.closePath();}
const bump=(g,x,y)=>{let s=0;for(const[a,b,amp,sg,p]of g){const r=Math.hypot(x-a,y-b)/sg;s+=amp*Math.exp(-Math.pow(r,p||2)/2);}return s;};
function H0(c,x,y,m){const w=ss(Math.min(x,W-x,y,H-y)/BL);return CL+spurV(c,x,y)+w*(c.na*fbm(x,y,c.seed)+m)+(c.feat.length?fx(c,'montagne',x,y):0);}

// Shared terrains: a feature sits on an edge midpoint or a corner and is split between neighbouring cards.
// On the edge itself its value is a fixed, symmetric profile (so any two cards with the same feature match);
// inside the card, its extent and a ragged noise vary per card and fade to nothing at the edges.
const FP={eau:{a:-2.6,s:9,t:9,c:10},foret:{a:1.25,s:12,t:10,c:13},montagne:{a:2.3,s:8,t:7.5}};
function fx(c,type,x,y){let v=0;const em=ss(Math.min(x,W-x,y,H-y)/5);
  for(const f of c.feat){if(f.t!==type)continue;const P=FP[type];let val,t;
    if(f.kind==='e'){const side=f.side,vert=side==='L'||side==='R',half=vert?H/2:W/2,s=vert?y-H/2:x-W/2;
      t=side==='L'?x:side==='R'?W-x:side==='T'?y:H-y;if(t>45)continue;
      const st=P.t*(1+.4*vn(s/7,.5,f.sd)),sfade=ss((half-Math.abs(s))/6);
      if(type==='montagne')val=P.a*Math.exp(-Math.pow(s*s/(P.s*P.s)+t*t/(st*st),.7)/2)*sfade;
      else val=P.a*Math.exp(-s*s/(2*P.s*P.s))*Math.exp(-t*t/(2*st*st))*sfade;}
    else{const u=Math.abs(x-f.cx),w=Math.abs(y-f.cy),r=Math.hypot(u,w),th=Math.atan2(w,u);t=Math.min(u,w);

function mk(kf){const tk=Object.keys(T).filter(k=>S.ters.includes(k)),pool=tk.length?tk:Object.keys(T),k=kf||pool[Math.floor(Math.random()*pool.length)],g=[],f=[],peaks=[],isl=[],seed=R(0,1000);

function deco(c){const{k,seed,peaks,D,F}=c,sh=c.feat.length>0,X0=sh?0:7,X1=W-X0,Y0=X0,Y1=H-X0;

// ---------- remarkable elements ----------
const EL={village:'Village',ferme:'Ferme',moulin:'Moulin',chapelle:'Chapelle',tour:'Tour de guet',menhirs:'Menhirs',mine:'Mine',ponton:'Ponton',cabane:'Cabane'};

const WT={village:3,ferme:2.5,moulin:1.5,chapelle:1,tour:1.2,menhirs:1,mine:1.5,ponton:2.5,cabane:2};

function wpick(list,u){const tot=list.reduce((a,e)=>a+WT[e],0);let acc=0;for(const e of list){acc+=WT[e]/tot;if(u<acc)return e;}return list[list.length-1];}
const rot=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];

function build(c,type){const p=spot(c,type);if(!p)return null;const[x,y]=p,e={t:type,x,y,r:4,circ:[[x,y,3]],rects:[]};

    if(big){const mains=e.roads.slice();for(const r of mains)for(let k=4;k<r.length-2;k+=Math.floor(R(4,7))){if(Math.random()<.35)continue;const[ax,ay]=r[k-1],[bx,by]=r[k],a=Math.atan2(by-ay,bx-ax)+(Math.random()<.5?1:-1)*Math.PI/2+R(-.3,.3);

function placeEls(c,want){c.els=[];
  if(want){const[list,two]=want.split('+'),al=list.split(',');const first=wpick(al,c.lp),e=build(c,first);if(e)c.els.push(e);

function drawRoad(g,C,pts,w){if(pts.length<2)return;g.beginPath();g.moveTo(...pts[0]);for(const p of pts.slice(1))g.lineTo(...p);

        g.fillStyle=C.field;g.globalAlpha=.2;g.fillRect(-w/2,-h/2,w,h);g.globalAlpha=1;g.beginPath();g.rect(-w/2,-h/2,w,h);g.save();g.clip();

      for(const sd of[1,-1]){g.moveTo(-1.1*sd,1.1);g.lineTo(1*sd,-1);g.moveTo(.4*sd,-1.35);g.quadraticCurveTo(1.1*sd,-1.15,1.35*sd,-.4);}g.stroke();
      g.fillStyle=C.rock;for(let i=0;i<9;i++){const a=i/9*TAU+.3;g.beginPath();g.arc(Math.cos(a)*2.1,Math.sin(a)*2.1+.3,.18,0,TAU);g.fill();}g.restore();}

// joints of the grid: v:c:r = edge between (c,r) and (c+1,r); h:c:r = edge between (c,r) and (c,r+1); x:c:r = corner shared by (c..c+1, r..r+1)
let joints={};
function joint(k){if(!joints[k]){const corner=k[0]==='x',r=Math.random();
  joints[k]={u:Math.random(),t:corner?(r<.5?'foret':'eau'):(r<.4?'foret':r<.75?'eau':'montagne')};}return joints[k];}
function share(){const n=S.cols*S.rows,pe=S.share?S.freq/100*.45:0,pc=S.share?S.freq/100*.3:0;const used=new Set();

    const E=(key,side)=>{const j=joint(key);if(j.u<pe&&S.ters.includes(j.t)){F.push({kind:'e',side,t:j.t});used.add(key);}};
    const V=(key,cx,cy)=>{const j=joint(key);if(j.u<pc&&S.ters.includes(j.t)){F.push({kind:'c',cx,cy,t:j.t});used.add(key);}};

// ---------- fixed 52-card deck ----------
// 22 plain cards fit anywhere; 30 carry a shared terrain that must meet a twin:
// long side (R) ×4 per lake/forest/mountain, both long sides ×1 lake & forest,
// short side (B) ×4 lake & forest, corners ×2 per diagonal for lake & forest. Turning a card 180° moves R→L, B→T, BR→TL.

  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}

function setDeck(on){if(on===S.deck)return;S.deck=on;

  else{cards=freeCards||[];perm=freePerm||[];}

let queue=[],raf=0;
function draw(){
  const n=S.cols*S.rows;
  if(S.deck){if(!deck){deck=makeDeck();dealt=null;}cards=deck;if(!dealt||dealt.length!==n)dealDeck();perm=dealt;
    nel=0;shared=0;for(let i=0;i<n;i++){const c=cards[perm[i]];if(!c)continue;nel+=c.els.length;const L=edges(c,!!c.turn),col=i%S.cols,row=Math.floor(i/S.cols);

  nel=0;for(let i=0;i<n;i++){const c=cards[i],w=wantEls(c);if(w!==c.esig){c.esig=w;placeEls(c,w);c.img=null;}nel+=c.els.length;}}

  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,L.tw,L.th);
  if(!S.deck&&(perm.length!==n||perm.some(v=>v>=n)))perm=[...Array(n).keys()];

function pump(){clearTimeout(raf);$('busy').classList.toggle('on',queue.length>0);

  raf=setTimeout(()=>{const t0=performance.now();while(queue.length&&performance.now()-t0<40){const i=queue.shift();if(i<S.cols*S.rows&&cards[perm[i]]){render(cards[perm[i]],S.zoom);blit(i);}}pump();},0);}

function stats(){const n=S.cols*S.rows,cnt={};for(let i=0;i<n;i++){const c=cards[perm[i]]||cards[i];if(c)cnt[c.k]=(cnt[c.k]||0)+1;}

  $('stats').innerHTML=`<span class="big"><span><b>${n}</b> carte${n>1?'s':''}</span><span>${(wmm/10).toFixed(1).replace('.',',')} × ${(hmm/10).toFixed(1).replace('.',',')} cm</span></span>`+
    Object.keys(T).filter(k=>cnt[k]).map(k=>`<span>${T[k]} <b>${cnt[k]}</b></span>`).join('')+(S.share||S.deck?`<span>Raccords <b>${shared}</b></span>`:'')+(nel?`<span>Éléments <b>${nel}</b></span>`:'')+(S.deck&&dealt?`<span class="big"><span>Jeu n°<b>${S.deckSeed}</b></span><span>${dealt.fit==='étalé'?'Jeu étalé':dealt.fit==='ok'?'Tout se raccorde':dealt.fit==='bord'?'Raccords coupés au bord':'Pas de donne parfaite'}</span></span>`:'');}

  $('lop').value=S.lop;$('lopOut').textContent=S.lop+' %';document.body.classList.toggle('nopanel',!S.panel);$('lmf').value=S.lmf;$('lmfOut').textContent=S.lmf+' %';

$('hide').onclick=()=>panel(false);$('show').onclick=()=>panel(true);
addEventListener('keydown',e=>{const t=document.activeElement;if(e.key.toLowerCase()!=='p'||e.metaKey||e.ctrlKey||e.altKey||t.tagName==='INPUT'&&t.type!=='range'&&t.type!=='checkbox')return;panel(!S.panel);});
$('ters').innerHTML=Object.entries(T).map(([k,v])=>`<button data-v="${k}">${v}</button>`).join('');
$('els').innerHTML=Object.entries(EL).map(([k,v])=>`<button data-v="${k}">${v}</button>`).join('');
const tog=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];
document.querySelectorAll('#ters button').forEach(b=>b.onclick=()=>{const nx=tog(S.ters,b.dataset.v);if(!nx.length)return;S.ters=nx;sync();draw();});
document.querySelectorAll('#els button').forEach(b=>b.onclick=()=>{S.els=tog(S.els,b.dataset.v);sync();draw();});
let et;$('lmf').oninput=e=>{S.lmf=+e.target.value;sync();clearTimeout(et);et=setTimeout(draw,150);};
document.querySelectorAll('section[data-sec] h2').forEach(h=>{h.tabIndex=0;h.setAttribute('role','button');
  const go=()=>{S.closed=tog(S.closed,h.parentNode.dataset.sec);h.setAttribute('aria-expanded',!S.closed.includes(h.parentNode.dataset.sec));sync();save();};
  h.onclick=go;h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
$('deck').onchange=e=>setDeck(e.target.checked);
$('spread').onclick=()=>{S.cols=13;S.rows=4;dealt=[...Array(52).keys()];dealt.fit='étalé';deck&&deck.forEach(c=>c.turn=false);sync();draw();$('fit').click();};
$('newDeck').onclick=()=>{S.deckSeed=1+Math.floor(Math.random()*9999);deck=null;dealt=null;draw();};
$('share').onchange=e=>{S.share=e.target.checked;sync();draw();};
let ft;$('freq').oninput=e=>{S.freq=+e.target.value;sync();clearTimeout(ft);ft=setTimeout(draw,150);};
$('rot').onchange=e=>{S.rot=e.target.checked;draw();};
$('round').onchange=e=>{S.round=e.target.checked;draw();};
$('labels').onchange=e=>{S.labels=e.target.checked;draw();};
document.querySelectorAll('#paper button').forEach(b=>b.onclick=()=>{S.paper=b.dataset.v;
  if(S.paper==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=S.paper;sync();draw();});
$('mix').onclick=$('mix2').onclick=()=>{if(S.deck){dealt=null;draw();return;}cards=[];joints={};perm=[];draw();};
// click a card: turn it 180°; drag it onto another slot: swap the two
let drag=null;
function slotAt(e){const r=cv.getBoundingClientRect(),{cw,ch,g}=layout(),x=e.clientX-r.left,y=e.clientY-r.top,col=Math.floor(x/(cw+g)),row=Math.floor(y/(ch+g));
  if(col<0||row<0||col>=S.cols||row>=S.rows||x-col*(cw+g)>cw||y-row*(ch+g)>ch)return -1;return row*S.cols+col;}
function mark(i,on){if(i<0)return;blit(i);if(!on)return;const{cw,ch,g}=layout(),ox=(i%S.cols)*(cw+g),oy=Math.floor(i/S.cols)*(ch+g);
  ctx.save();ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent');ctx.lineWidth=3;ctx.setLineDash([8,5]);ctx.strokeRect(ox+1.5,oy+1.5,cw-3,ch-3);ctx.restore();}
cv.addEventListener('pointerdown',e=>{const i=slotAt(e);if(i<0||e.button||!cards[perm[i]])return;cv.setPointerCapture(e.pointerId);drag={i,x:e.clientX,y:e.clientY,moved:false,over:-1,gh:null};});
cv.addEventListener('pointermove',e=>{if(!drag){cv.style.cursor=slotAt(e)<0?'':'grab';return;}
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;
  const{cw,ch}=layout();
  if(!drag.moved){drag.moved=true;cv.style.cursor='grabbing';const c=cards[perm[drag.i]],gh=document.createElement('canvas'),d=devicePixelRatio||1;
    gh.width=cw*d;gh.height=ch*d;gh.style.cssText=`position:fixed;pointer-events:none;z-index:9;width:${cw}px;height:${ch}px;border-radius:${S.round?3*S.zoom:0}px;box-shadow:0 12px 32px rgba(0,0,0,.3);opacity:.92;transform:rotate(-2deg)`;
    const gx=gh.getContext('2d');if(c.img){if(turned(c)){gx.translate(gh.width,gh.height);gx.rotate(Math.PI);}gx.drawImage(c.img,0,0,gh.width,gh.height);}
    document.body.appendChild(gh);drag.gh=gh;ctx.save();const{g}=layout(),ox=(drag.i%S.cols)*(cw+g),oy=Math.floor(drag.i/S.cols)*(ch+g);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(ox,oy,cw,ch);ctx.restore();}
  drag.gh.style.left=e.clientX-cw/2+'px';drag.gh.style.top=e.clientY-ch/2+'px';
  const o=slotAt(e),t=o===drag.i?-1:o;if(t!==drag.over){if(drag.over>=0)mark(drag.over,false);drag.over=t;mark(t,true);}});
function endDrag(e,cancel){if(!drag)return;const d=drag;drag=null;cv.style.cursor='grab';
  if(d.gh)d.gh.remove();
  if(!d.moved){if(!cancel){const c=cards[perm[d.i]];c.turn=!c.turn;blit(d.i);}return;}
  if(!cancel&&d.over>=0){[perm[d.i],perm[d.over]]=[perm[d.over],perm[d.i]];}
  blit(d.i);if(d.over>=0)blit(d.over);}
cv.addEventListener('pointerup',e=>endDrag(e,false));cv.addEventListener('pointercancel',e=>endDrag(e,true));
cv.style.touchAction='none';
$('clear').onclick=()=>{cards.forEach(c=>c.img=null);draw();};
$('png').onclick=()=>{if(queue.length){$('busy').textContent='Attends la fin du dessin';return;}
  const a=document.createElement('a');a.download=`dos-topo-${S.cols}x${S.rows}.png`;a.href=cv.toDataURL('image/png');a.click();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.paper==='auto')draw();});
if(S.paper!=='auto')document.documentElement.dataset.theme=S.paper;
sync();draw();
</script>
</body>
</html>
