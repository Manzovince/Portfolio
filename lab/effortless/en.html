<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effortless™ — Sign up in seconds*</title>
<style>
  :root {
    --ink: #2b2140;
    --muted: #8a8399;
    --brand: #6c3ce0;
    --brand2: #1fb5a8;
    --bad: #e0344b;
    --good: #2fae5c;
    --card: #fffdf7;
    --line: #d9d2e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: #efeaf7;
    min-height: 100vh;
    transition: background .6s;
    overflow-x: hidden;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px;
    background: linear-gradient(90deg, var(--brand), #b03cd8);
    color: #fff;
  }
  .logo { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
  .logo sup { font-size: 10px; cursor: default; user-select: none; -webkit-user-select: none; }
  #steps { font-size: 13px; opacity: .9; }
  #timer {
    font-family: "Courier New", monospace; font-weight: 700; font-size: 18px;
    background: rgba(0,0,0,.25); padding: 4px 10px; border-radius: 6px;
  }
  #timer.pen { animation: flash .6s 3; }
  @keyframes flash { 50% { background: var(--bad); } }
  #progress { height: 6px; background: #d8cfe9; }
  #bar { height: 100%; width: 5%; background: var(--brand2); transition: width 1.2s cubic-bezier(.6,-0.6,.4,1.6); }

  main { max-width: 640px; margin: 28px auto 120px; padding: 0 16px; transition: transform 1s; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 24px; box-shadow: 0 10px 30px rgba(60,30,120,.12); position: relative;
  }
  h1 { margin: 0 0 10px; font-size: 34px; line-height: 1.12; }
  h2 { margin: 0 0 6px; font-size: 22px; }
  .lead { color: var(--muted); margin: 0 0 22px; }
  .fine { font-size: 10px; color: #b8b2c4; margin-top: 26px; }
  .small { font-size: 13px; }
  .hint { min-height: 1.2em; color: var(--brand); font-size: 13px; font-style: italic; }

  /* ---------- buttons ---------- */
  button { font: inherit; cursor: pointer; }
  .big {
    display: block; width: 100%; padding: 22px; margin: 6px 0 18px;
    font-size: 26px; font-weight: 800; letter-spacing: 1px;
    border: 0; border-radius: 12px; color: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.18);
  }
  .big:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .green { background: var(--good); }
  .blue { background: #2f6fe0; }
  .purple { background: var(--brand); }
  .meh {
    background: #e7e3ee; color: #a59fb2; border: 1px dashed #cfc8dc;
    padding: 6px 12px; border-radius: 4px; font-size: 12px;
  }
  .linkish {
    background: none; border: 0; padding: 0; color: #9a94a8; text-decoration: underline;
    font-size: 11px;
  }
  a { color: var(--brand); }
  .sneaky { cursor: pointer; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }

  /* ---------- forms ---------- */
  label.f { display: block; margin: 16px 0 4px; font-size: 13px; font-weight: 700; }
  label.f small { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=password], select {
    font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink); width: 100%; min-width: 0;
  }
  input.ghost { color: #b9b3c6; }
  input.err, select.err { border-color: var(--bad); background: #fff3f4; }
  .email { display: grid; grid-template-columns: 1fr auto 1fr auto 96px; gap: 4px; align-items: center; }
  .email span { font-weight: 700; color: var(--muted); }
  .rules { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; }
  .rules li { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; }
  .rules li.ok { background: #e8f7ee; color: #1f7a42; }
  .rules li.no { background: #fdecee; color: var(--bad); }
  .errbox { color: var(--bad); font-size: 13px; min-height: 1.2em; margin-top: 12px; }
  input[type=range] { width: 100%; accent-color: var(--brand); }
  .readout { font-family: "Courier New", monospace; font-size: 20px; font-weight: 700; }
  .daybox {
    display: inline-block; min-width: 54px; text-align: center; padding: 8px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; font-weight: 700;
  }
  .die { display: inline-block; }
  .die.rolling { animation: roll .7s cubic-bezier(.3,.7,.4,1); }
  @keyframes roll {
    0% { transform: translateY(0) rotate(0); }
    30% { transform: translateY(-14px) rotate(260deg) scale(1.3); }
    60% { transform: translateY(0) rotate(520deg); }
    80% { transform: translateY(-4px) rotate(680deg); }
    100% { transform: translateY(0) rotate(720deg); }
  }
  .tiny.spinning { color: var(--brand); font-family: "Courier New", monospace; min-width: 44px; }
  .wheelwrap { position: relative; width: 240px; max-width: 80%; margin: 6px auto 10px; }
  .wheel { display: block; width: 100%; transition: transform 3.5s cubic-bezier(.15,.75,.1,1); filter: drop-shadow(0 4px 8px rgba(0,0,0,.2)); }
  .wheelptr { position: absolute; left: 50%; top: -8px; margin-left: -11px; width: 0; height: 0; z-index: 1;
    border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 22px solid var(--ink); }
  .tiny { padding: 6px 10px; font-size: 12px; border: 1px solid var(--line); background: #fff; border-radius: 5px; }

  /* cookies */
  .cookie { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px dotted var(--line); font-size: 14px; }
  .cookie label { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .cookie-list { max-height: 260px; overflow: auto; margin-bottom: 14px; }
  .cookie.new { animation: pop .5s; }
  @keyframes pop { from { background: #fff4a8; } }

  /* interests */
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin: 14px 0; }
  .chip { display: flex; gap: 8px; align-items: center; padding: 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; font-size: 14px; cursor: pointer; transition: transform .25s; }
  .chip.on { border-color: var(--brand); background: #f1ebff; }

  /* terms */
  .terms { height: 220px; overflow: auto; border: 1px solid var(--line); padding: 12px; font-size: 12px;
    background: #fff; line-height: 1.5; }
  .terms p { margin: 0 0 10px; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0; font-size: 14px; }
  .check input { margin-top: 3px; }

  /* captcha */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px auto; max-width: 300px; }
  .tile { aspect-ratio: 1; display: grid; place-items: center; font-size: 46px; background: #f4f1f8;
    border: 3px solid transparent; border-radius: 8px; cursor: pointer; user-select: none; }
  .tile.sel { border-color: #2f6fe0; background: #dfe9ff; transform: scale(.94); }
  .captcha-q { background: #2f6fe0; color: #fff; padding: 12px 14px; border-radius: 8px; font-size: 15px; }
  .captcha-q b { font-size: 19px; display: block; }
  .micro { font-size: 8px; padding: 0 3px; border: 1px solid var(--line); background: #fff; border-radius: 2px; color: var(--muted); }
  #r37.micro { font-size: 12px; padding: 4px 8px; border-radius: 4px; }
  .rot { font-size: 90px; text-align: center; margin: 16px 0; transition: transform .3s; }

  /* calibration */
  .calib { position: relative; height: 300px; border: 2px dashed var(--line); border-radius: 12px; margin: 16px 0;
    background: repeating-linear-gradient(0deg, transparent 0 29px, #eee8f6 29px 30px), repeating-linear-gradient(90deg, transparent 0 29px, #eee8f6 29px 30px);
    touch-action: none; user-select: none; -webkit-user-select: none; }
  @media (pointer: fine) { .calib, .calib * { cursor: none !important; } }
  .target { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    background: radial-gradient(circle, var(--bad) 0 4px, #fff 4px 8px, var(--bad) 8px 11px, #fff 11px 15px); box-shadow: 0 0 0 2px var(--bad); }
  .mark { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; color: var(--bad); font: 700 14px/14px monospace;
    text-align: center; pointer-events: none; animation: markfade 2.5s forwards; }
  @keyframes markfade { 70% { opacity: 1; } to { opacity: 0; } }
  .fakecur { position: absolute; width: 22px; height: 28px; pointer-events: none; z-index: 2; display: none; }
  .meter { font-family: "Courier New", monospace; font-size: 13px; color: var(--muted); }

  /* final */
  .arena { position: relative; height: 260px; border: 2px dashed var(--line); border-radius: 12px; margin: 16px 0; }
  .shell { position: absolute; width: 270px; max-width: 92%; height: 54px; padding: 0; margin: 0; border: 0; background: none;
    transform: translate(-50%, -50%); transform-style: preserve-3d; transition: left .5s ease-in-out, top .5s ease-in-out, transform .5s; }
  .shell.down { transform: translate(-50%, -50%) rotateY(180deg); }
  .shell .face { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 12px; color: #fff;
    font-weight: 800; font-size: 15px; box-shadow: 0 6px 0 rgba(0,0,0,.18); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .shell .front { background: var(--good); }
  .shell .back { background: var(--brand); transform: rotateY(180deg); font-size: 24px;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 8px, transparent 8px 16px); }
  #flee { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: auto;
    padding: 16px 22px; font-size: 18px; margin: 0; transition: left .18s, top .18s; white-space: nowrap; }

  /* ---------- overlays ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(30,15,60,.45); display: grid; place-items: center;
    z-index: 50; padding: 16px; }
  .modal { background: #fff; border-radius: 12px; padding: 22px; max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3); position: relative; }
  .modal h3 { margin: 0 0 10px; }
  .modal .hx { font-size: 15px; color: #b9b3c6; cursor: pointer; line-height: 1; }
  .modal .micro { cursor: pointer; }
  .modal .copy { font-size: 9px; color: #c4bfcf; margin-top: 10px; cursor: pointer; }
  .modal .btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .modal .btns button { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .modal .btns button.primary { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 700; }

  #chat { position: fixed; right: 16px; bottom: 16px; width: 270px; max-width: calc(100vw - 32px);
    background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 40; overflow: hidden;
    animation: up .4s; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  #chat .head { background: var(--brand2); color: #fff; padding: 10px 12px; font-weight: 700; font-size: 14px;
    display: flex; justify-content: space-between; }
  #chat .head button { background: none; border: 0; color: rgba(255,255,255,.55); font-size: 9px; padding: 0 2px; }
  #chat .body { padding: 12px; font-size: 14px; min-height: 60px; }
  #chat.talk { width: 320px; }
  #chat.talk .body { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .msg { padding: 7px 10px; border-radius: 12px; font-size: 13px; max-width: 85%; animation: up .25s; }
  .msg.g { background: #e6f6f3; align-self: flex-start; border-bottom-left-radius: 3px; }
  .msg.u { background: var(--brand); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
  .msg.typing { font-style: italic; color: var(--muted); background: none; padding-left: 0; }
  #chat .acts button:disabled { opacity: .45; cursor: default; }
  #chat .acts { display: flex; gap: 6px; padding: 0 12px 12px; }
  #chat .acts button { flex: 1; padding: 10px 8px; border-radius: 8px; border: 2px solid; color: #fff; font-size: 14px; font-weight: 800;
    box-shadow: 0 3px 0 rgba(0,0,0,.2); text-shadow: 0 1px 0 rgba(0,0,0,.2); }
  #chat .acts button.wiggle { animation: wiggle .5s 2; }
  @keyframes wiggle { 25% { transform: rotate(-4deg) scale(1.05); } 75% { transform: rotate(4deg) scale(1.05); } }

  #longload { position: fixed; inset: 0; background: rgba(255,255,255,.96); z-index: 60; display: grid; place-items: center;
    text-align: center; padding: 16px; font-size: 15px; }
  .llbar { width: 260px; max-width: 80vw; height: 12px; background: #e3dcf0; border-radius: 6px; overflow: hidden; margin: 14px auto 6px; }
  #llFill { height: 100%; width: 0; background: var(--brand); transition: width .25s; }
  .llsay { max-width: 300px; margin: 18px auto 4px; font-size: 14px; background: #e6f6f3; padding: 8px 12px; border-radius: 12px; text-align: left; }
  #crank { touch-action: none; cursor: grab; display: block; margin: 8px auto 0; }
  #loader { position: fixed; inset: 0; background: rgba(255,255,255,.92); z-index: 60; display: grid; place-items: center;
    font-size: 15px; text-align: center; }
  .spin { width: 44px; height: 44px; border: 5px solid #e3dcf0; border-top-color: var(--brand); border-radius: 50%;
    margin: 0 auto 12px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast { position: fixed; left: 50%; top: 80px; transform: translate(-50%, -20px); opacity: 0;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 70;
    transition: .3s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  [hidden] { display: none !important; }

  /* ---------- progressive decay ---------- */
  body.d3 { background: #e9f2e0; }
  body.d3 h1, body.d3 h2 { font-family: Georgia, "Times New Roman", serif; }
  body.d4 { background: repeating-linear-gradient(45deg, #f6e7ff 0 22px, #e4fff4 22px 44px); }
  body.d4 .card { border-radius: 2px 30px 4px 18px; }
  body.d5 main { transform: rotate(-1.2deg); }
  body.d5 h1, body.d5 h2 { font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", cursive; color: #c0287a; }
  body.d5 { background: repeating-radial-gradient(circle at 30% 30%, #fff6b0 0 18px, #ffd1ec 18px 36px); }
  body.d6 main { transform: rotate(1.4deg) skewX(-1deg); }
  body.d7 { background: #1b1b1b; animation: hue 6s linear infinite; }
  body.d7 main { animation: wobble 5s ease-in-out infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  @keyframes wobble { 50% { transform: rotate(-1.6deg) translateY(4px); } }

  @media (max-width: 520px) {
    h1 { font-size: 29px; }
    .email { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) 78px; gap: 3px; }
    .email span.dot { display: none; }
    .email input, .email select { padding: 10px 7px; font-size: 15px; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">Effortless<sup id="tm">™</sup></div>
  <div id="steps"></div>
  <div id="timer">00:00</div>
</header>
<div id="progress"><div id="bar"></div></div>
<main id="app"></main>

<div id="chat" hidden>
  <div class="head"><span>💬 Gary from Support</span><button id="chatX" aria-label="close">close</button></div>
  <div class="body" id="chatBody"></div>
  <div class="acts"><button id="chatYes">Yes please</button><button id="chatNo">No thanks</button></div>
</div>
<div id="loader" hidden><div><div class="spin"></div><div id="loaderTxt">Loading…</div></div></div>
<div id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const S = { level: 0, start: 0, penalty: 0, clicks: 0, done: false };
let cleanups = [];
const onLeave = fn => cleanups.push(fn);

/* ---------- utilities ---------- */
let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}
function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function penalize(sec, why) {
  S.penalty += sec; toast(`+${sec}s ${why}`);
  const t = $('#timer'); t.classList.remove('pen'); void t.offsetWidth; t.classList.add('pen');
}
function modal(html) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  return bg;
}
document.addEventListener('click', () => S.clicks++, true);

/* ---------- timer & header lies ---------- */
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const elapsed = () => S.start ? (Date.now() - S.start) / 1000 + S.penalty : 0;
setInterval(() => { if (!S.done) $('#timer').textContent = fmt(elapsed()); }, 250);

const STEP_LIES = [['1', '3'], ['1', '3'], ['2', '4'], ['5', '4'], ['3', '4'], ['π', '4'], ['7', '6'], ['6', '6'], ['8', '7'], ['9', '8'], ['✓', '✓']];
const BAR_LIES = [3, 35, 22, 61, 48, 83, 34, 12, 99, 100, 100];

let goToken = 0;
function go(n, opts = {}) {
  cleanups.forEach(f => f()); cleanups = [];
  const token = ++goToken;
  if (cancelLong) cancelLong();
  const forward = n > S.level;
  S.level = n;
  if (n === 1 && !S.start) S.start = Date.now();
  const render = () => {
    if (token !== goToken) return;
    document.body.className = [[3, 'd3'], [4, 'd4'], [5, 'd5'], [6, 'd6'], [8, 'd7']].filter(([l]) => n >= l).map(([, c]) => c).join(' ');
    const [a, b] = STEP_LIES[n];
    $('#steps').textContent = `Step ${a} of ${b}`;
    $('#bar').style.width = BAR_LIES[n] + '%';
    STAGES[n]();
    window.scrollTo(0, 0);
  };
  if (forward && n >= 5 && !opts.fast) (n === 6 ? longLoad : fakeLoad)(render); else render();
}

// the very long one: ~50 s on its own, until Gérard brings a crank
let longLoading = false, cancelLong = null;
const LL_LINES = ["Loading the captcha…", "Looking for pictures of crosswalks…", "Counting traffic lights…", "On its way…", "Still there?", "Thank you for your patience (you have no choice).", "Checking your patience…", "Almost… no.", "Defragmenting cookies…", "Waking up the server…", "The server fell asleep again…"];
function longLoad(then) {
  longLoading = true;
  const ov = document.createElement('div'); ov.id = 'longload';
  ov.innerHTML = `<div>
    <div class="spin"></div>
    <div id="llTxt">${LL_LINES[0]}</div>
    <div class="llbar"><div id="llFill"></div></div>
    <div class="readout" id="llPct">0 %</div>
    <div id="llGary" hidden>
      <p class="llsay">💬 <b>Gary :</b> <span id="llSay"></span></p>
      <svg id="crank" viewBox="0 0 120 120" width="130" height="130">
        <circle cx="60" cy="60" r="54" fill="#f4f1f8" stroke="#d9d2e6" stroke-width="3"/>
        <g id="arm"><rect x="56" y="16" width="8" height="44" rx="4" fill="#8a8399"/><circle cx="60" cy="20" r="12" fill="#e0344b" stroke="#fff" stroke-width="3"/></g>
        <circle cx="60" cy="60" r="9" fill="#2b2140"/>
      </svg>
      <p class="small" style="color:var(--muted)">Turn the crank (click and drag in circles)</p>
    </div>
  </div>`;
  document.body.appendChild(ov);
  let p = 0, stall = 0, line = 0, t0 = Date.now(), rot = 0, drag = false, last = 0;
  const draw = () => { ov.querySelector('#llFill').style.width = p + '%'; ov.querySelector('#llPct').textContent = Math.floor(p) + ' %'; };
  const iv = setInterval(() => {
    const el = Date.now() - t0;
    if (stall > 0) stall -= 250;
    else if (Math.random() < .06) stall = rand(2000, 5000);
    else if (Math.random() < .03) p = Math.max(0, p - 2);
    else p += Math.random() * 2;
    if (el > 8000 && ov.querySelector('#llGary').hidden) {
      ov.querySelector('#llSay').textContent = garyMood === 'sulky' ? "I shouldn’t help you, after what you did. But fine. Here, a crank. 🙂" : garyMood === 'grateful' ? "To thank you for listening, I made you a crank 🥹 Turn it!" : "Psst! It’s Gary. Slow, huh? I rigged up a crank. Turn it!";
      ov.querySelector('#llGary').hidden = false;
    }
    if (el / 4000 > line + 1) ov.querySelector('#llTxt').textContent = LL_LINES[++line % LL_LINES.length];
    if (p >= 100) { p = 100; draw(); finish(true); return; }
    draw();
  }, 250);
  const crank = ov.querySelector('#crank'), arm = ov.querySelector('#arm');
  const angle = e => { const r = crank.getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI; };
  crank.addEventListener('pointerdown', e => { drag = true; last = angle(e); crank.setPointerCapture(e.pointerId); p += .3; });
  crank.addEventListener('pointermove', e => {
    if (!drag) return;
    const a = angle(e); let d = a - last; last = a;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    rot += d; p = Math.min(100, p + Math.abs(d) / 360 * 8);
    arm.setAttribute('transform', `rotate(${rot} 60 60)`);
    draw();
  });
  const up = () => drag = false;
  crank.addEventListener('pointerup', up); crank.addEventListener('pointercancel', up);
  const finish = ok => {
    clearInterval(iv); ov.remove(); longLoading = false; cancelLong = null;
    if (ok) then();
  };
  cancelLong = () => finish(false);
}

      <div class="row between"><button class="tiny" id="reroll">↻ new images</button><button class="big blue" id="verify" style="width:auto;margin:0;padding:12px 26px;font-size:17px">VERIFY</button></div>`;
    const sel = new Set();
    $('#grid').onclick = e => {
      const t = e.target.closest('.tile'); if (!t) return;
      const i = +t.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); t.classList.toggle('sel');
    };
    $('#reroll').onclick = () => { penalize(5, 'for being picky'); drawRound(); };
    $('#verify').onclick = () => {
      const right = tiles.every((t, i) => R.ok(t.k) === sel.has(i));
      if (!right) { toast(pick(['Wrong. Are you a robot? 🤖', 'Incorrect. Very robot of you.', 'Nope. Beep boop?'])); drawRound(); return; }
      round++;
      round < ROUNDS.length ? drawRound() : drawRotate();
    };
  };
  const drawRotate = () => {
    let a = rand(90, 270);
    cap.innerHTML = `
      <h2>One last check</h2>
      <p class="lead small">Round 4 of 4 (we said 3, we lied)</p>
      <div class="captcha-q">Rotate the cat so it's <b>upright.</b></div>
      <div class="rot" id="cat">🐈</div>
      <button class="big purple" id="r1" style="font-size:44px;padding:30px">−1°</button>
      <div style="text-align:right"><button class="micro" id="r37">+37°</button></div>
      <p class="errbox" id="err"></p>
      <button class="big blue" id="verify">VERIFY</button>`;
    const cat = $('#cat');
    const set = () => cat.style.transform = `rotate(${a}deg)`;
    set();
    // near upright, the big and small buttons quietly swap their steps
    let big = -1, small = 37;
    const relabel = () => {
      const off = Math.abs(((a % 360) + 540) % 360 - 180);
      [big, small] = off <= 40 ? [37, -1] : [-1, 37];
      $('#r1').textContent = (big > 0 ? '+' : '−') + Math.abs(big) + '°';
      $('#r37').textContent = (small > 0 ? '+' : '−') + Math.abs(small) + '°';
    };
    $('#r1').onclick = () => { a += big; set(); relabel(); };
    $('#r37').onclick = () => { a += small; set(); relabel(); };
    $('#verify').onclick = () => {
      const off = ((a % 360) + 540) % 360 - 180;
      if (off === 0) go(7);
      else if (Math.abs(off) <= 5) $('#err').textContent = `Almost! ${Math.abs(off)}° to go. The cat is very picky.`;
      else $('#err').textContent = `The cat is ${Math.abs(off)}° unhappy.`;
    };
  };
  drawRound();
}

// the visible arrow sits 25–45px away from the real pointer, in a new direction after every hit
function stageCalibrate() {
  app.innerHTML = `
  <section class="card">
    <h2>Pointer calibration 🎯</h2>
    <p class="lead small">For your security, please hit 5 targets. Our High-Precision Pointer™ is enabled.</p>
    <div class="row between meter"><span>Targets : <b id="hits">0</b>/5</span><span>Accuracy : <b id="acc">100</b> %</span></div>
    <div class="calib" id="calib">
      <div class="target" id="tgt"></div>
      <svg class="fakecur" id="cur" viewBox="0 0 22 28"><path d="M1 1 L1 22 L6 17 L10 26 L13 25 L9 16 L16 16 Z" fill="#000" stroke="#fff" stroke-width="1.5"/></svg>
    </div>
    <p class="hint" id="hint"></p>
  </section>`;
  const box = $('#calib'), tgt = $('#tgt'), cur = $('#cur');
  const MISS = ["Missed.", "Missed. Your mouse seems poorly calibrated.", "Missed again. Have you tried aiming?", "The red × is where you actually clicked. Interesting, right?", "Tip: the offset changes after every target you hit. Good luck."], OK = ["Hit!", "Nice.", "Not bad.", "One more!", "Calibration complete ✓"];
  let hits = 0, shots = 0, misses = 0, size = 30, tx = 0, ty = 0, ox = 30, oy = 30, lx = null, ly = null;
  const rollOffset = () => {
    const ang = Math.random() * Math.PI * 2, d = rand(25, 45);
    ox = Math.round(Math.cos(ang) * d); oy = Math.round(Math.sin(ang) * d);
    if (lx !== null) { cur.style.left = lx + ox + 'px'; cur.style.top = ly + oy + 'px'; }
  };
  const local = e => { const r = box.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const place = () => {
    tx = rand(30, box.clientWidth - 30); ty = rand(30, box.clientHeight - 30);
    tgt.style.left = tx + 'px'; tgt.style.top = ty + 'px';
    tgt.style.transform = `scale(${size / 30})`;
  };
  place();
  box.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const [x, y] = local(e);
    cur.style.display = 'block';
    lx = x; ly = y;
    cur.style.left = x + ox + 'px'; cur.style.top = y + oy + 'px';
  });
  box.addEventListener('pointerleave', () => cur.style.display = 'none');
  box.addEventListener('pointerdown', e => {
    e.preventDefault();
    let [x, y] = local(e);
    // no arrow on touch screens: shift the finger instead
    if (e.pointerType !== 'mouse') { x -= ox; y -= oy; }
    const m = document.createElement('div'); m.className = 'mark'; m.textContent = '×';
    m.style.left = x + 'px'; m.style.top = y + 'px'; box.appendChild(m);
    setTimeout(() => m.remove(), 2600);
    shots++;
    if (Math.hypot(x - tx, y - ty) <= size / 2 + 2) {
      hits++;
      rollOffset();   // a new offset only once you've figured out the current one
      $('#hint').textContent = OK[hits - 1] + (hits === 3 ? ' ' + "The target shrinks, for the challenge." : '');
      if (hits >= 3) size = 20;
      if (hits >= 5) { setTimeout(() => go(8), 700); } else place();
    } else {
      misses++;
      $('#hint').textContent = MISS[Math.min(misses - 1, MISS.length - 1)];
    }
    $('#hits').textContent = hits;
    $('#acc').textContent = Math.round(hits / shots * 100);
  });
}

function stageFinal() {
  app.innerHTML = `
  <section class="card">
    <h2>You're almost there! 🎉</h2>
    <p class="lead small">Just click the button below to create your account.</p>
    <div class="arena" id="arena"><button class="big green" id="flee">Create account</button></div>
    <p class="hint" id="hint"></p>
  </section>`;
  const btn = $('#flee'), arena = $('#arena');
  const LIMIT = 6;
  let dodges = 0, swapT = null, paused = false;
  const quips = ["Whoops!", "Too slow.", "Over here!", "Catch me 😜", "So close!", "Okay okay. Fine. 😮‍💨"];
  onLeave(() => clearTimeout(swapT));
  const dodge = () => {
    if (dodges >= LIMIT) return false;
    const w = arena.clientWidth - btn.offsetWidth, h = arena.clientHeight - btn.offsetHeight;
    btn.style.transform = 'none';
    btn.style.left = rand(0, Math.max(0, w)) + 'px';
    btn.style.top = rand(0, Math.max(0, h)) + 'px';
    $('#hint').textContent = quips[dodges];
    if (++dodges === LIMIT) setTimeout(shellGame, 900);
    return true;
  };
  btn.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(); });
  btn.addEventListener('pointerdown', e => { if (dodge()) e.preventDefault(); });

  // then the shell game: the three buttons turn face down, swap places, and you pick one
  const confirmRestart = onNo => {
    const opts = shuffle([['y', "Yes"], ['n', "No"]]);
    const bg = modal(`<h3>Do you not want to cancel starting over?</h3><div class="btns">${opts.map(([k, l]) => `<button data-k="${k}" class="${k === 'y' ? 'primary' : ''}">${l}</button>`).join('')}</div>`);
    bg.querySelector('.btns').onclick = e => {
      const k = e.target.dataset.k; if (!k) return;
      bg.remove();
      if (k === 'y') { toast("Back to the beginning! 🎉"); go(0); } else { toast("Phew. Starting over cancelled. Reshuffling!"); onNo(); }
    };
  };
  function shellGame() {
    if (!btn.isConnected) return;
    btn.remove();
    const hint = $('#hint');
    const btns = [['create', "Create account"], ['restart', "Start over from the beginning"], ['gary', "Help Gary 💚"]].map(([k, l]) => {
      const b = document.createElement('button');
      b.className = 'shell'; b.dataset.k = k;
      b.innerHTML = `<span class="face front">${l}</span><span class="face back">❓</span>`;
      arena.appendChild(b);
      return b;
    });
    let order = shuffle([0, 1, 2]), busy = true;
    const place = () => order.forEach((bi, slot) => {
      btns[bi].style.left = arena.clientWidth / 2 + 'px';
      btns[bi].style.top = arena.clientHeight * (slot + .5) / 3 + 'px';
    });
    const speed = d => btns.forEach(b => b.style.transitionDuration = d + 's');
    const round = () => {
      busy = true; speed(.5);
      btns.forEach(b => b.classList.remove('down'));
      hint.textContent = "Remember where “Create account” is…";
      swapT = setTimeout(() => {
        btns.forEach(b => b.classList.add('down'));
        hint.textContent = "Shuffling 🎩";
        let n = 0;
        const total = rand(3, 5);
        const step = () => {
          const i = rand(0, 2); let j = rand(0, 1); if (j >= i) j++;
          [order[i], order[j]] = [order[j], order[i]];
          const d = Math.max(.45, .75 - n * .06);
          speed(d); place(); n++;
          swapT = setTimeout(n < total ? step : () => { speed(.5); busy = false; hint.textContent = "Your turn! Which one is “Create account”?"; }, d * 1000 + 80);
        };
        swapT = setTimeout(step, 800);
      }, 3500);
    };
    arena.onclick = e => {
      const b = e.target.closest('.shell'); if (!b || busy) return;
      busy = true;
      b.classList.remove('down');
      hint.textContent = '🤞';
      swapT = setTimeout(() => {
        if (b.dataset.k === 'create') confirmChain(0);
        else if (b.dataset.k === 'restart') confirmRestart(round);
        else {
          if (garyMood !== 'talking') { $('#chat').hidden = false; garyTalks(); }
          toast("Gary thanks you. Reshuffling!");
          swapT = setTimeout(round, 1500);
        }
      }, 650);
    };
    place();
    round();
  }
  shellGame();   // straight to the shell game, no running-away phase
}

const CONFIRMS = [
  { q: 'Are you sure you want to create an account?', yes: 'Yes', no: 'Cancel', good: 'yes' },
  { q: 'Do you want to cancel account creation?', yes: 'Yes', no: 'No', good: 'no' },
  { q: "Are you not unsure that you don't want to stop now?", yes: 'Yes', no: 'No', good: 'yes' },
  { q: 'Last one. Abort?', yes: 'Abort', no: 'Abort abort', good: 'no' },
];
function confirmChain(i) {
  if (i >= CONFIRMS.length) return go(9, { fast: true });
  const C = CONFIRMS[i];
  // positions and emphasis are shuffled every time
  const btns = shuffle([['yes', C.yes], ['no', C.no]]);
  const primary = rand(0, 1);
  const bg = modal(`<h3>${C.q}</h3><div class="btns">${btns.map(([k, l], j) => `<button data-k="${k}" class="${j === primary ? 'primary' : ''}">${l}</button>`).join('')}</div>`);
  bg.querySelector('.btns').onclick = e => {
    const k = e.target.dataset.k; if (!k) return;
    bg.remove();
    if (k === C.good) confirmChain(i + 1);
    else { penalize(15, 'for second-guessing yourself'); toast('Account creation cancelled. Let\'s start the questions over.'); setTimeout(() => confirmChain(0), 700); }
  };
}

  const now = Date.now();
  const busy = longLoading || !$('#loader').hidden || document.querySelector('.modal-bg');
  if (S.level >= 2 && now > garyAt && $('#chat').hidden && !busy) showGary();
  if (S.level >= 3 && S.level <= 9 && !hurryOpen && $('#loader').hidden && !longLoading && now > hurryAt) hurry();
}, 1000);

// secret: 2 quick clicks on the ™ skip to the next step
let tmClicks = [];
$('#tm').addEventListener('click', () => {
  const now = Date.now();
  tmClicks = tmClicks.filter(t => now - t < 1000).concat(now);
  if (tmClicks.length < 2 || S.level >= STAGES.length - 1) return;
  tmClicks = [];
  document.querySelectorAll('.modal-bg').forEach(m => m.remove());
  hurryOpen = false; hurryAt = Date.now() + 30000;
  if (!S.start) S.start = Date.now();
  go(S.level + 1, { fast: true });
});

go(0);
</script>
</body>
